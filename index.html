/* The engine: pure state and rules, no DOM, stepped by update(dt).
   Uses the seedable rng so tests stay deterministic. */
function ArcadeEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var floorY = H - 70;
  var E = {
    cfg: cfg, W: W, H: H, floorY: floorY,
    wave: 0, spawned: 0, spawnTimer: 700, bearSeq: 0,
    bears: [], shots: [], drops: [], fx: [],
    bull: { x: W/2 - cfg.bull.w/2, y: floorY + 10, w: cfg.bull.w, h: cfg.bull.h,
            cooldown: 0, invulnUntil: 0, flash: 0 },
    input: { left: false, right: false },
    elapsed: 0,
    hits: 0, damagePts: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }

  function spawnBear(){
    var wc = waveCfg();
    E.bearSeq++;
    var fat = wc.fatEvery > 0 && (E.bearSeq % wc.fatEvery === 0);
    var w = fat ? 42 : 28, h = fat ? 34 : 26;
    var baseX = 30 + rng() * (W - 60 - w);
    E.bears.push({
      x: baseX, y: -h, w: w, h: h, baseX: baseX,
      hp: fat ? wc.fatHp : wc.hp, fat: fat,
      fall: wc.fall * (0.85 + rng() * 0.3),
      sway: wc.sway, phase: rng() * 6.28
    });
    E.spawned++;
  }

  function addFx(text, x, y, bad){
    E.fx.push({ text: text, x: x, y: y, t: 950, bad: !!bad });
  }

  function takeHit(reason, x, y){
    E.playerHits++;
    E.combo = 0;
    E.bull.invulnUntil = E.elapsed + 900;
    E.bull.flash = 900;
    addFx(reason, x, y, true);
  }

  E.fire = function(){
    if (E.over) return false;
    if (E.bull.cooldown > 0) return false;
    E.bull.cooldown = cfg.shot.cooldown;
    E.shots.push({ x: E.bull.x + E.bull.w/2 - cfg.shot.w/2,
                   y: E.bull.y - cfg.shot.h, w: cfg.shot.w, h: cfg.shot.h });
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();

    // the bull moves and reloads
    if (E.input.left)  E.bull.x -= cfg.bull.speed * s;
    if (E.input.right) E.bull.x += cfg.bull.speed * s;
    E.bull.x = Math.max(8, Math.min(E.bull.x, W - 8 - E.bull.w));
    if (E.bull.cooldown > 0) E.bull.cooldown -= dt;
    if (E.bull.flash > 0) E.bull.flash -= dt;

    // the market keeps sending bears
    if (E.spawned < wc.count){
      E.spawnTimer -= dt;
      if (E.spawnTimer <= 0){ spawnBear(); E.spawnTimer = wc.spawnGap; }
    }

    // bears fall, sway, and fling sell orders
    for (var i = E.bears.length - 1; i >= 0; i--){
      var b = E.bears[i];
      b.y += b.fall * s;
      b.x = b.baseX + Math.sin(E.elapsed / 700 + b.phase) * b.sway;
      if (rng() < wc.dropPerSec * s){
        E.drops.push({ x: b.x + b.w/2 - cfg.drop.w/2, y: b.y + b.h,
                       w: cfg.drop.w, h: cfg.drop.h, fall: wc.dropFall });
      }
      if (b.y + b.h >= floorY){
        E.bears.splice(i, 1);
        takeHit((cfg.lines && cfg.lines.through) || "THE BEAR GOT THROUGH", b.x + b.w/2, floorY - 18);
      }
    }

    // buy orders rise and land
    for (var j = E.shots.length - 1; j >= 0; j--){
      var sh = E.shots[j];
      sh.y -= cfg.shot.speed * s;
      if (sh.y + sh.h < 0){ E.shots.splice(j, 1); continue; }
      for (var k = E.bears.length - 1; k >= 0; k--){
        var bb = E.bears[k];
        if (rectsOverlap(sh.x, sh.y, sh.w, sh.h, bb.x, bb.y, bb.w, bb.h)){
          E.shots.splice(j, 1);
          bb.hp--;
          E.hits++;
          E.damagePts += cfg.hitPts;
          E.combo++;
          if (E.combo > E.bestCombo) E.bestCombo = E.combo;
          var line = "+" + cfg.hitPts;
          if (E.combo % cfg.comboEvery === 0){
            E.comboPts += cfg.comboBonus;
            line = "STREAK x" + E.combo + " +" + cfg.comboBonus;
          }
          addFx(line, bb.x + bb.w/2, bb.y, false);
          if (bb.hp <= 0) E.bears.splice(k, 1);
          break;
        }
      }
    }

    // sell orders fall on the bull
    for (var m = E.drops.length - 1; m >= 0; m--){
      var d = E.drops[m];
      d.y += d.fall * s;
      if (d.y > H){ E.drops.splice(m, 1); continue; }
      if (rectsOverlap(d.x, d.y, d.w, d.h, E.bull.x, E.bull.y, E.bull.w, E.bull.h)){
        E.drops.splice(m, 1);
        if (E.elapsed >= E.bull.invulnUntil)
          takeHit((cfg.lines && cfg.lines.drop) || "SELL ORDER LANDED", E.bull.x + E.bull.w/2, E.bull.y - 16);
      }
    }

    // floating feedback decays
    for (var f = E.fx.length - 1; f >= 0; f--){
      E.fx[f].t -= dt; E.fx[f].y -= 20 * s;
      if (E.fx[f].t <= 0) E.fx.splice(f, 1);
    }

    // wave and game progression
    if (E.spawned >= wc.count && E.bears.length === 0 && E.drops.length === 0){
      if (E.wave < cfg.waves.length - 1){
        E.wave++; E.spawned = 0; E.spawnTimer = 900; E.bearSeq = 0;
        addFx("WAVE " + (E.wave + 1), W/2, H/2 - 40, false);
      } else {
        E.over = true;
      }
    }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0) ? cfg.noHitBonus : 0;
    var speed = E.over
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts,
      comboPts: E.comboPts,
      bestCombo: E.bestCombo,
      noHit: noHit,
      speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* =====================================================
   THE SAFETY NET. Milestone 11. The Chapter 2 cabinet.
   A lane catcher in the classic catch game tradition:
   needs fall from the courtyard windows, the player
   slides the collective net to catch them, urgent cases
   pay triage, and grievance forms must not be caught.
   Pure state, no DOM, seeded rng, stepped by update(dt).
   Public API mirrors ArcadeEngine: input, fire, update,
   score, over, banked, hits, playerHits, elapsed.
   ===================================================== */
function CatchEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var floorY = H - 70;
  var E = {
    kind: "catch",
    cfg: cfg, W: W, H: H, floorY: floorY,
    wave: 0, spawned: 0, spawnTimer: 800, itemSeq: 0,
    items: [], fx: [],
    net: { x: W/2 - cfg.net.w/2, y: floorY - 4, w: cfg.net.w, h: cfg.net.h,
           boostUntil: 0, cooldown: 0, invulnUntil: 0, flash: 0 },
    input: { left: false, right: false },
    elapsed: 0,
    hits: 0, damagePts: 0, urgentCaught: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }

  function spawnItem(){
    var wc = waveCfg();
    E.itemSeq++;
    var grievance = rng() < wc.griefShare;
    var urgent = !grievance && wc.urgentEvery > 0 && (E.itemSeq % wc.urgentEvery === 0);
    var kinds = ["bread", "med", "parcel"];
    var type = grievance ? "grievance" : (urgent ? "urgent" : kinds[Math.floor(rng() * kinds.length)]);
    var w = grievance ? 18 : 20, h = grievance ? 22 : 18;
    var baseX = 26 + rng() * (W - 52 - w);
    E.items.push({
      x: baseX, y: -h, w: w, h: h, baseX: baseX, type: type,
      fall: wc.fall * (urgent ? 1.45 : 0.85 + rng() * 0.3),
      sway: type === "grievance" ? wc.sway * 1.8 : wc.sway * 0.5,
      phase: rng() * 6.28
    });
    E.spawned++;
  }

  function addFx(text, x, y, bad){
    E.fx.push({ text: text, x: x, y: y, t: 950, bad: !!bad });
  }

  function takeHit(reason, x, y){
    E.playerHits++;
    E.combo = 0;
    E.net.invulnUntil = E.elapsed + 700;
    E.net.flash = 700;
    addFx(reason, x, y, true);
  }

  // FIRE is the hustle: a short burst of net speed on a cooldown
  E.fire = function(){
    if (E.over) return false;
    if (E.net.cooldown > 0) return false;
    E.net.cooldown = cfg.hustle.cooldown;
    E.net.boostUntil = E.elapsed + cfg.hustle.duration;
    addFx("HUSTLE", E.net.x + E.net.w/2, E.net.y - 26, false);
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();

    // the net slides, faster on a hustle
    var sp = cfg.net.speed * (E.elapsed < E.net.boostUntil ? cfg.hustle.mult : 1);
    if (E.input.left)  E.net.x -= sp * s;
    if (E.input.right) E.net.x += sp * s;
    E.net.x = Math.max(8, Math.min(E.net.x, W - 8 - E.net.w));
    if (E.net.cooldown > 0) E.net.cooldown -= dt;
    if (E.net.flash > 0) E.net.flash -= dt;

    // the windows keep sending needs
    if (E.spawned < wc.count){
      E.spawnTimer -= dt;
      if (E.spawnTimer <= 0){ spawnItem(); E.spawnTimer = wc.spawnGap; }
    }

    // items fall and drift; the net catches, the cobbles judge
    for (var i = E.items.length - 1; i >= 0; i--){
      var it = E.items[i];
      it.y += it.fall * s;
      it.x = it.baseX + Math.sin(E.elapsed / 600 + it.phase) * it.sway;

      if (rectsOverlap(it.x, it.y, it.w, it.h, E.net.x, E.net.y - 8, E.net.w, E.net.h + 8)){
        E.items.splice(i, 1);
        if (it.type === "grievance"){
          if (E.elapsed >= E.net.invulnUntil)
            takeHit((cfg.lines && cfg.lines.drop) || "A GRIEVANCE STUCK TO THE NET",
              it.x + it.w/2, E.net.y - 20);
          continue;
        }
        var pts = cfg.hitPts * (it.type === "urgent" ? 2 : 1);
        if (it.type === "urgent") E.urgentCaught++;
        E.hits++;
        E.damagePts += pts;
        E.combo++;
        if (E.combo > E.bestCombo) E.bestCombo = E.combo;
        var line = (it.type === "urgent" ? "URGENT +" : "+") + pts;
        if (E.combo % cfg.comboEvery === 0){
          E.comboPts += cfg.comboBonus;
          line = "STREAK x" + E.combo + " +" + cfg.comboBonus;
        }
        addFx(line, it.x + it.w/2, E.net.y - 22, false);
        continue;
      }

      if (it.y + it.h >= floorY + 18){
        E.items.splice(i, 1);
        if (it.type === "grievance"){
          addFx("FILED", it.x + it.w/2, floorY - 8, false);
        } else {
          takeHit((cfg.lines && cfg.lines.through) || "A NEED HIT THE COBBLES",
            it.x + it.w/2, floorY - 18);
        }
      }
    }

    // floating feedback decays
    for (var f = E.fx.length - 1; f >= 0; f--){
      E.fx[f].t -= dt; E.fx[f].y -= 20 * s;
      if (E.fx[f].t <= 0) E.fx.splice(f, 1);
    }

    // wave and game progression
    if (E.spawned >= wc.count && E.items.length === 0){
      if (E.wave < cfg.waves.length - 1){
        E.wave++; E.spawned = 0; E.spawnTimer = 900; E.itemSeq = 0;
        addFx("SHIFT " + (E.wave + 1), W/2, H/2 - 40, false);
      } else {
        E.over = true;
      }
    }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0) ? cfg.noHitBonus : 0;
    var speed = E.over
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts,
      comboPts: E.comboPts,
      bestCombo: E.bestCombo,
      noHit: noHit,
      speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* One dispatcher: each chapter names its engine in its arcade config,
   per the roadmap. Unknown or missing engines fall back to the shooter. */

/* QUOTA! the Chapter 3 arcade, the third distinct engine.
   A falling block stacker in the Tetris tradition: ration crates
   descend onto a loading floor, the verb is FULFILL, and a row
   packed across every column ships as a met quota and clears.
   A column stacked to the ceiling is a jam, the shortage made
   physical. Pure state, seedable rng, time stepped, so it runs
   headless in jsdom exactly like the shooter and the net. The
   engine API mirrors the others so makeArcade and the flow code
   never learn which engine they are holding. */
function StackEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var cols = cfg.cols || 8, rows = cfg.rows || 12;
  var cell = Math.floor(Math.min((W - 120) / cols, (H - 140) / rows));
  var fieldW = cell * cols, fieldH = cell * rows;
  var originX = Math.floor((W - fieldW) / 2);
  var originY = 96;

  function emptyGrid(){
    var g = [];
    for (var r = 0; r < rows; r++){ g.push([]); for (var c = 0; c < cols; c++) g[r].push(null); }
    return g;
  }

  var E = {
    kind: "stack",
    cfg: cfg, W: W, H: H,
    cols: cols, rows: rows, cell: cell,
    originX: originX, originY: originY, fieldW: fieldW, fieldH: fieldH,
    grid: emptyGrid(),
    active: null,
    wave: 0, spawned: 0, spawnTimer: 600, pieceSeq: 0,
    moveTimer: 0,
    fx: [],
    input: { left: false, right: false },
    elapsed: 0,
    hits: 0, damagePts: 0, rushShipped: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }

  function addFx(text, col, row, bad){
    E.fx.push({ text: text, x: originX + col * cell + cell / 2, y: originY + row * cell, t: 900, bad: !!bad });
  }

  var GOODS = ["steel", "grain", "fuel"];

  function spawnPiece(){
    var wc = waveCfg();
    E.pieceSeq++;
    var rush = wc.rushEvery > 0 && (E.pieceSeq % wc.rushEvery === 0);
    var type = rush ? "rush" : GOODS[Math.floor(rng() * GOODS.length)];
    E.active = {
      col: Math.floor(cols / 2),
      y: originY - cell,
      type: type,
      rush: rush,
      fall: wc.fall * (rush ? 1.6 : 1)
    };
    E.spawned++;
  }

  function landingRow(col){
    for (var r = rows - 1; r >= 0; r--){ if (!E.grid[r][col]) return r; }
    return -1; // column full
  }

  function clearRows(lockCol, lockRow){
    var cleared = 0;
    for (var r = rows - 1; r >= 0; r--){
      var full = true;
      for (var c = 0; c < cols; c++){ if (!E.grid[r][c]){ full = false; break; } }
      if (full){
        E.grid.splice(r, 1);
        var nr = []; for (var c2 = 0; c2 < cols; c2++) nr.push(null);
        E.grid.unshift(nr);
        cleared++;
        r++; // recheck the row that shifted down into this slot
      }
    }
    if (cleared > 0){
      for (var k = 0; k < cleared; k++){
        E.hits++;
        E.damagePts += cfg.hitPts;
        E.combo++;
        if (E.combo > E.bestCombo) E.bestCombo = E.combo;
        if (E.combo % cfg.comboEvery === 0){ E.comboPts += cfg.comboBonus; }
      }
      var label = cleared > 1 ? ("QUOTA x" + cleared + " +" + (cfg.hitPts * cleared)) : ("SHIPPED +" + cfg.hitPts);
      addFx(label, lockCol, lockRow, false);
    }
  }

  function jam(col){
    E.playerHits++;
    E.combo = 0;
    // spill: clear the top occupied cells of the offending column so play continues
    for (var r = 0; r < rows; r++){ if (E.grid[r][col]){ E.grid[r][col] = null; break; } }
    addFx((cfg.lines && cfg.lines.jam) || "JAMMED", col, 0, true);
  }

  function lockActive(){
    var a = E.active; if (!a) return;
    var lr = landingRow(a.col);
    if (lr < 0){ jam(a.col); E.active = null; return; }
    E.grid[lr][a.col] = { type: a.type };
    if (a.rush){ E.rushShipped++; E.damagePts += cfg.rushBonus || 0; addFx("RUSH +" + (cfg.rushBonus || 0), a.col, lr, false); }
    var lockCol = a.col;
    E.active = null;
    clearRows(lockCol, lr);
    // a stack that reaches the ceiling row anywhere is a jam too
    for (var c = 0; c < cols; c++){ if (E.grid[0][c]){ jam(c); } }
  }

  // FIRE is the hard drop: slam the crate home now
  E.fire = function(){
    if (E.over || !E.active) return false;
    lockActive();
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();

    // steering: repeat move on a short cooldown while held
    if (E.moveTimer > 0) E.moveTimer -= dt;
    if (E.active && E.moveTimer <= 0){
      if (E.input.left && !E.input.right){ E.active.col = Math.max(0, E.active.col - 1); E.moveTimer = 110; }
      else if (E.input.right && !E.input.left){ E.active.col = Math.min(cols - 1, E.active.col + 1); E.moveTimer = 110; }
    }

    // bring the next crate down
    if (!E.active){
      if (E.spawned < wc.count){
        E.spawnTimer -= dt;
        if (E.spawnTimer <= 0){ spawnPiece(); E.spawnTimer = wc.spawnGap; }
      }
    } else {
      var a = E.active;
      a.y += a.fall * s;
      var lr = landingRow(a.col);
      var landY = lr < 0 ? originY - cell : originY + lr * cell;
      if (lr < 0){ // column already full: locking here jams
        if (a.y >= originY){ lockActive(); }
      } else if (a.y >= landY){
        a.y = landY; lockActive();
      }
    }

    // feedback decays
    for (var ff = E.fx.length - 1; ff >= 0; ff--){
      E.fx[ff].t -= dt; E.fx[ff].y -= 18 * s;
      if (E.fx[ff].t <= 0) E.fx.splice(ff, 1);
    }

    // wave / run progression: wave ends when its crates are spent and none is falling
    if (E.spawned >= wc.count && !E.active){
      if (E.wave < cfg.waves.length - 1){
        E.wave++; E.spawned = 0; E.spawnTimer = 700; E.pieceSeq = 0;
        addFx("PLAN YEAR " + (E.wave + 1), Math.floor(cols / 2), Math.floor(rows / 2), false);
      } else {
        E.over = true;
      }
    }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0) ? cfg.noHitBonus : 0;
    var speed = E.over
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts,
      comboPts: E.comboPts,
      bestCombo: E.bestCombo,
      noHit: noHit,
      speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* CROSS THE AISLE, the Chapter 4 arcade, the fourth distinct engine.
   A road crosser in the Frogger tradition: the player is a bill moving in
   four directions across an avenue of alternating lanes, market traffic
   running one way and red tape the other, climbing from the lobby to the
   chamber. Reach the top and the bill passes; get clipped and it is knocked
   back to the start. The verb is BALANCE. Pure state, seedable rng, time
   stepped, same engine API as the others, so makeArcade and the flow code
   never learn which engine they hold. The only new wire is input.up/down. */
function CrosserEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var topPad = 58;                 // HUD band
  var botPad = 54;                 // the lobby the bill starts in
  var laneCount = cfg.lanes || 6;
  var laneTop = topPad + 24;        // first lane top
  var laneArea = H - botPad - laneTop;
  var laneH = Math.floor(laneArea / laneCount);
  var goalY = topPad + 2;           // the chamber band, just above the lanes
  var startY = H - botPad + 8;

  var E = {
    kind: "crosser",
    cfg: cfg, W: W, H: H,
    laneCount: laneCount, laneTop: laneTop, laneH: laneH, goalY: goalY, startY: startY,
    wave: 0, spawnTimers: [],
    bill: { x: W/2 - 9, y: startY, w: 18, h: 16, sprintUntil: 0, cooldown: 0, invulnUntil: 800, flash: 0, reached: false },
    obstacles: [], fx: [],
    input: { left: false, right: false, up: false, down: false },
    elapsed: 0,
    hits: 0, damagePts: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0, passesThisWave: 0,
    over: false, banked: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }
  function laneDir(i){ return (i % 2 === 0) ? 1 : -1; }
  function laneKind(i){ return (i % 2 === 0) ? "market" : "tape"; }
  function laneY(i){ return E.laneTop + i * E.laneH; }
  for (var li = 0; li < laneCount; li++){ E.spawnTimers.push(rng() * 700); }

  function addFx(text, x, y, bad){ E.fx.push({ text: text, x: x, y: y, t: 950, bad: !!bad }); }

  function spawnObstacle(lane){
    var wc = waveCfg();
    var dir = laneDir(lane), kind = laneKind(lane);
    var w = (kind === "market" ? wc.carW : wc.tapeW) + Math.floor(rng() * 10);
    var speed = wc.speed * (0.85 + rng() * 0.4);
    var x = dir > 0 ? -w - 4 : W + 4;
    E.obstacles.push({ lane: lane, x: x, y: laneY(lane) + 4, w: w, h: E.laneH - 8, dir: dir, kind: kind, speed: speed });
  }

  function resetBill(knocked){
    E.bill.x = W/2 - E.bill.w/2;
    E.bill.y = E.startY;
    E.bill.reached = false;
    if (knocked){ E.bill.invulnUntil = E.elapsed + 800; E.bill.flash = 800; }
  }

  // FIRE is the sprint: a short forward burst on a cooldown
  E.fire = function(){
    if (E.over) return false;
    if (E.bill.cooldown > 0) return false;
    E.bill.cooldown = cfg.sprint.cooldown;
    E.bill.sprintUntil = E.elapsed + cfg.sprint.duration;
    addFx("SPRINT", E.bill.x + E.bill.w/2, E.bill.y - 16, false);
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();
    var B = E.bill;

    // the bill moves in four directions, faster on a sprint
    var sp = cfg.speed * (E.elapsed < B.sprintUntil ? cfg.sprint.mult : 1);
    if (E.input.left)  B.x -= sp * s;
    if (E.input.right) B.x += sp * s;
    if (E.input.up)    B.y -= sp * s;
    if (E.input.down)  B.y += sp * s;
    B.x = Math.max(6, Math.min(B.x, W - 6 - B.w));
    B.y = Math.max(E.goalY - 2, Math.min(B.y, E.startY));
    if (B.cooldown > 0) B.cooldown -= dt;
    if (B.flash > 0) B.flash -= dt;

    // each lane keeps sending traffic
    for (var l = 0; l < E.laneCount; l++){
      E.spawnTimers[l] -= dt;
      if (E.spawnTimers[l] <= 0){ spawnObstacle(l); E.spawnTimers[l] = wc.spawnGap * (0.7 + rng() * 0.6); }
    }

    // traffic flows, wraps off, and judges the bill
    for (var i = E.obstacles.length - 1; i >= 0; i--){
      var o = E.obstacles[i];
      o.x += o.dir * o.speed * s;
      if ((o.dir > 0 && o.x > W + 8) || (o.dir < 0 && o.x + o.w < -8)){ E.obstacles.splice(i, 1); continue; }
      if (E.elapsed >= B.invulnUntil && rectsOverlap(B.x, B.y, B.w, B.h, o.x, o.y, o.w, o.h)){
        E.playerHits++;
        E.combo = 0;
        addFx(o.kind === "market" ? (cfg.lines.market || "RUN DOWN BY THE MARKET")
                                   : (cfg.lines.tape || "TANGLED IN RED TAPE"),
              B.x + B.w/2, B.y - 14, true);
        resetBill(true);
      }
    }

    // reaching the chamber passes the bill
    if (B.y <= E.goalY && !B.reached){
      B.reached = true;
      E.hits++; E.passesThisWave++;
      E.damagePts += cfg.hitPts;
      E.combo++;
      if (E.combo > E.bestCombo) E.bestCombo = E.combo;
      var line = "+" + cfg.hitPts;
      if (E.combo % cfg.comboEvery === 0){ E.comboPts += cfg.comboBonus; line = "STREAK x" + E.combo + " +" + cfg.comboBonus; }
      addFx(line, B.x + B.w/2, E.goalY + 16, false);
      if (E.passesThisWave >= wc.count){
        if (E.wave < cfg.waves.length - 1){
          E.wave++; E.passesThisWave = 0;
          addFx("SESSION " + (E.wave + 1), W/2, H/2 - 30, false);
          resetBill(false);
        } else { E.over = true; }
      } else { resetBill(false); }
    }

    for (var f = E.fx.length - 1; f >= 0; f--){ E.fx[f].t -= dt; E.fx[f].y -= 18 * s; if (E.fx[f].t <= 0) E.fx.splice(f, 1); }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0) ? cfg.noHitBonus : 0;
    var speed = E.over ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000))) : 0;
    return {
      damage: E.damagePts, comboPts: E.comboPts, bestCombo: E.bestCombo,
      noHit: noHit, speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

function makeArcade(cfg){
  if (cfg.engine === "catch") return CatchEngine(cfg);
  if (cfg.engine === "stack") return StackEngine(cfg);
  if (cfg.engine === "crosser") return CrosserEngine(cfg);
  return ArcadeEngine(cfg);
}

   simulation: every tick is fed through a synthetic one

   per the parking lot, and says so on screen.

function FreePlayEngine(cfg){
  // the inner DeskEngine owns the needles, the clamps, and the collapse check
  var inner = DeskEngine({
    beats: [ { id: "tick", options: [ { fx: {}, fit: 0, why: "" } ] } ],
    collapseLines: cfg.collapseLines
  });
  var F = {
    cfg: cfg,
    inner: inner,
    needles: inner.needles,
    levers: cfg.levers.map(function(l){ return l.start; }),
    quarter: 0,
    acc: 0,
    paused: false,
    over: false,
    collapsed: null,
    lastDeltas: null,
    lastShock: null,
    shockCount: 0,
    nextShockIn: 0
  };
  function rollShockGap(){
    var span = cfg.shockEvery.max - cfg.shockEvery.min + 1;
    F.nextShockIn = cfg.shockEvery.min + Math.floor(rng() * span);
  }
  rollShockGap();

  F.setLever = function(li, pos){
    if (F.over) return false;
    if (!cfg.levers[li] || !cfg.levers[li].positions[pos]) return false;
    F.levers[li] = pos;
    return true;
  };

  F.tickFx = function(){
    var fx = {};
    NEEDLE_DEFS.forEach(function(n){ fx[n.id] = cfg.drift[n.id] || 0; });
    cfg.levers.forEach(function(l, i){
      var p = l.positions[F.levers[i]].fx;
      NEEDLE_DEFS.forEach(function(n){ fx[n.id] += p[n.id] || 0; });
    });
    return fx;
  };

  F.step = function(){
    if (F.over) return null;
    var fx = F.tickFx();
    var shock = null;
    F.nextShockIn--;
    if (F.nextShockIn <= 0){
      shock = cfg.shocks[Math.floor(rng() * cfg.shocks.length)];
      NEEDLE_DEFS.forEach(function(n){ fx[n.id] = (fx[n.id] || 0) + (shock.fx[n.id] || 0); });
      F.shockCount++;
      rollShockGap();
    }
    inner.cfg.beats[0].options[0].fx = fx;
    var res = inner.choose(0);
    inner.beat = 0;                       // stay on the synthetic beat forever
    if (!inner.collapsed) inner.done = false;
    F.quarter++;
    F.lastDeltas = res.deltas;
    F.lastShock = shock;
    if (inner.collapsed){ F.over = true; F.collapsed = inner.collapsed; }
    return res;
  };

  F.update = function(dt){
    if (F.paused || F.over) return false;
    F.acc += dt;
    var stepped = false;
    while (F.acc >= cfg.tickMs && !F.over){
      F.acc -= cfg.tickMs;
      F.step();
      stepped = true;
    }
    return stepped;
  };

  return F;
}

    e.fill.style.width = v + "%";
    e.val.textContent = String(v);
    e.g.classList.toggle("low", v <= 15);
    var d = free.lastDeltas ? (free.lastDeltas[n.id] || 0) : 0;
    e.chip.textContent = d > 0 ? "\u25B2" + d : d < 0 ? "\u25BC" + (-d) : "";

    freeEls.event.textContent = "Quarter " + free.quarter + " closes. The levers hold until you move them.";

      : "You gathered the parts, passed the lesson, and ran the system from the chair without being asked to believe a word of it. Two doors are open now: the arcade is pure candy, and Free Play hands you the chair with no script and no clock."));

  var play = el("button", "btn tick", "PLAY THE ARCADE");
  play.addEventListener("click", openArcade);
  completeInner.appendChild(play);

  if (nextChapterId()){
    var onward = el("button", "btn tick", "ONWARD TO " + CHAPTERS[nextChapterId()].name);
    onward.addEventListener("click", goNextChapter);
    completeInner.appendChild(onward);
  }

  var fp = el("button", "btn", "FREE PLAY: RUN THE TOWN");
  fp.addEventListener("click", function(){ openFreePlay(); });
  completeInner.appendChild(fp);

  var again = el("button", "btn ghost", "WALK AGAIN");
  again.addEventListener("click", resetRun);
  completeInner.appendChild(again);

  panelComplete.classList.add("open");
}

  G.slowUntil = 0;
  G.careUntil = 0;

  G.deskPassed = false;

/* ---------- The title hub: a chapter chooser ---------- */
function refreshTitle(){
  var prog = document.getElementById("title-progress");
  var list = document.getElementById("chapter-list");
  if (!prog || !list) return;
  if (G.lifetime > 0){
    prog.style.display = "";
    prog.innerHTML = "LIFETIME: " + G.lifetime;
  } else {
    prog.style.display = "none";
  }
  list.innerHTML = "";
  CHAPTER_ORDER.forEach(function(id){
    var ch = CHAPTERS[id];
    if (!ch) return;
    var p = Progress[id];
    var open = chapterUnlocked(id);
    var card = el("div", "ch-card" + (open ? "" : " locked"));
    card.appendChild(el("div", "ch-name", ch.name));
    card.appendChild(el("div", "ch-sub", ch.titleSub));
    var status = "";
    if (!open){
      status = "LOCKED. CLEAR " + CHAPTERS[ch.unlock].name.split(":")[0] + " TO OPEN.";
    } else if (p.cleared){
      status = '<span class="clr">CLEARED' + (p.clears > 1 ? " x" + p.clears : "") + "</span>"
        + "  \u2022  BEST DESK +" + p.bestDesk
        + (p.bestArcade ? "  \u2022  BEST ARCADE +" + p.bestArcade : "");
    } else {
      status = "OPEN. THE WALK IS WAITING.";
    }
    card.appendChild(el("div", "ch-status", status));
    var row = el("div", "ch-row");
    if (open){
      var go = el("button", "btn", "START THE WALK");
      go.addEventListener("click", function(){ startChapter(id); });
      row.appendChild(go);
    }
    if (p.cleared){
      var fp = el("button", "btn ghost", "FREE PLAY");
      fp.addEventListener("click", function(){ openFreePlay(id); });
      row.appendChild(fp);
    }
    card.appendChild(row);
    list.appendChild(card);
  });
}

function startChapter(id){
  sceneFlash();
  sceneHide();
  spawnCritters(id);
  if (!CHAPTERS[id] || !chapterUnlocked(id)) return;
  selectChapter(id);
  resetRun();
  panelTitle.classList.remove("open");
  refreshHUD();
  toast(CUR.walkToast, 4200);
}

function startGame(){
  // SPACE on the title: the furthest open, uncleared chapter, else Chapter 1
  var pick = null;
  CHAPTER_ORDER.forEach(function(id){
    if (!pick && CHAPTERS[id] && chapterUnlocked(id) && !Progress[id].cleared) pick = id;
  });
  startChapter(pick || "ch1");
}

/* ---------- Update ---------- */
function tryMove(dx, dy){
  var p = G.player;
  var nx = p.x + dx, ny = p.y + dy;
  // AABB corners against solid tiles, with a small inset
  var pad = 4;
  var corners = [
    [nx+pad, ny+pad],[nx+p.w-pad, ny+pad],
    [nx+pad, ny+p.h-pad],[nx+p.w-pad, ny+p.h-pad]
  ];
  for (var i=0;i<corners.length;i++){
    var tx = Math.floor(corners[i][0]/TILE), ty = Math.floor(corners[i][1]/TILE);
    if (isSolid(tx,ty)) return false;
  }
  p.x = nx; p.y = ny;
  return true;
}

function update(dt){
  G.time += dt;
  if (G.scene==="ARCADE"){ arcadeUpdate(dt); return; }
  if (G.scene==="FREEPLAY"){ freeUpdate(dt); return; }
  if (G.scene!=="WALK") return;
  var p = G.player;
  var speed = p.speed * (G.time < G.slowUntil ? 0.5 : 1);
  var step = speed * dt/1000;
  var moved = false;
  if (G.keys.up)    { p.dir="up";    moved = tryMove(0,-step) || moved; }
  if (G.keys.down)  { p.dir="down";  moved = tryMove(0, step) || moved; }
  if (G.keys.left)  { p.dir="left";  moved = tryMove(-step,0) || moved; }
  if (G.keys.right) { p.dir="right"; moved = tryMove(step,0)  || moved; }
  if (moved) p.anim += dt; else p.anim = 0;

  updateHazards(dt);
  updateCritters(dt);

  // door proximity: standing on the tile directly below a doorway
  G.nearDoor = null;
  var cx = Math.floor((p.x+p.w/2)/TILE), cy = Math.floor((p.y+p.h/2)/TILE);
  for (var i=0;i<BUILDINGS.length;i++){
    var b = BUILDINGS[i];
    if (cx===b.door.x && cy===b.door.y+1){ G.nearDoor = b; break; }
  }

  // NPC proximity: within ~1.5 tiles
  G.nearNPC = null;
  for (var j=0;j<NPCS.length;j++){
    var n = NPCS[j];
    var ddx = (n.tx*TILE+TILE/2) - (p.x+p.w/2);
    var ddy = (n.ty*TILE+TILE/2) - (p.y+p.h/2);
    if (ddx*ddx + ddy*ddy < (TILE*1.5)*(TILE*1.5)){ G.nearNPC = n; break; }
  }

  // gate proximity: within 2 tiles of the fountain when the desk or the charter is open
  G.nearGate = false;
  if (gateOpen() || deskOpen()){
    var gdx = GATE.tx*TILE - (p.x+p.w/2);
    var gdy = GATE.ty*TILE - (p.y+p.h/2);
    if (gdx*gdx + gdy*gdy < (TILE*2.5)*(TILE*2.5)) G.nearGate = true;
  }
  refreshHUD();
}

/* ---------- Render ---------- */
function camera(){
  var p = G.player;
  var cx = Math.round(p.x + p.w/2 - VIEW_W/2);
  var cy = Math.round(p.y + p.h/2 - VIEW_H/2);
  cx = Math.max(0, Math.min(cx, MAP_W*TILE - VIEW_W));
  cy = Math.max(0, Math.min(cy, MAP_H*TILE - VIEW_H));
  return {x:cx, y:cy};
}

function render(){
  if (!ctx) return; // headless safe
  if (arcade && (G.scene==="ARCADE" || G.scene==="ARCADE_MENU")){ renderArcade(); return; }
  if (G.scene === "INTERIOR" && currentRoom){ drawRoomCanvas(currentRoom); return; }
  var cam = camera();
  ctx.fillStyle = CUR.palette.bg;
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  var x0 = Math.floor(cam.x/TILE), y0 = Math.floor(cam.y/TILE);
  var x1 = Math.min(MAP_W-1, Math.ceil((cam.x+VIEW_W)/TILE));
  var y1 = Math.min(MAP_H-1, Math.ceil((cam.y+VIEW_H)/TILE));

  // ground, themed per chapter. Milestone 8.
  for (var y=y0;y<=y1;y++){
    for (var x=x0;x<=x1;x++){
      var sx = x*TILE-cam.x, sy = y*TILE-cam.y;
      drawGroundTile(MAP_ROWS[y][x], x, y, sx, sy);
    }
  }

  // street decor, drawn under the buildings
  (CH_DECOR[CHAPTER_ID] || []).forEach(function(d){
    var sx = d.tx*TILE-cam.x, sy = d.ty*TILE-cam.y;
    if (sx<-100||sy<-100||sx>VIEW_W+100||sy>VIEW_H+100) return;
    drawDecorItem(d, sx, sy);
  });

  // buildings
  BUILDINGS.forEach(function(b){
    var bx = b.x*TILE-cam.x, by = b.y*TILE-cam.y;
    var bw = b.w*TILE, bh = b.h*TILE;
    if (bx>VIEW_W||by>VIEW_H||bx+bw<0||by+bh<0) return;
    // facade, per archetype
    drawBuildingArt(b, bx, by, bw, bh);
    // door
    var dx = b.door.x*TILE-cam.x, dy = b.door.y*TILE-cam.y;
    ctx.fillStyle = "#241a12"; ctx.fillRect(dx+4, dy+2, TILE-8, TILE-2);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(dx+TILE-12, dy+TILE/2, 3, 3);
    // sign
    ctx.fillStyle = "#15121c"; ctx.fillRect(bx+bw/2-34, by+12, 68, 13);
    var locked = (b.kind==="institute" && insightCount() < LESSON_IDS.length);
    ctx.fillStyle = locked ? "#5a526e" : (b.kind==="lesson") ? "#e8b04b" : (b.kind==="institute") ? "#7fe5b0" : "#3fb8af";
    ctx.font = "8px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText(b.sign, bx+bw/2, by+22);
    if (locked){
      ctx.fillStyle = "#5a526e";
      ctx.fillRect(bx+bw/2-5, by+30, 10, 8);
      ctx.fillRect(bx+bw/2-3, by+26, 6, 5);
    }
    // star marker over required lesson buildings
    if (b.kind==="lesson" && !G.insights[b.id]){
      var bob = Math.sin(G.time/300)*3;
      ctx.fillStyle = "#e8b04b";
      drawStar(bx+bw/2, by-10+bob, 8);
    }
    // star over the Institute once it unlocks, until it is passed
    if (b.kind==="institute" && !locked && !G.institutePassed){
      var bob2 = Math.sin(G.time/300)*3;
      ctx.fillStyle = "#7fe5b0";
      drawStar(bx+bw/2, by-10+bob2, 8);
    }
  });

  // hazards
  HAZARDS.forEach(function(h){
    var hx = Math.round(h.x-cam.x), hy = Math.round(h.y-cam.y);
    if (hx<-40||hy<-40||hx>VIEW_W+40||hy>VIEW_H+40) return;
    if (h.skin==="taxi"){
      // the yellow cab: checker band, glass, a roof light that ticks
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+2, hy+h.h-3, h.w-4, 5);
      ctx.fillStyle = "#d8a420"; ctx.fillRect(hx, hy+4, h.w, h.h-8);
      ctx.fillStyle = "#b8880e"; ctx.fillRect(hx, hy+h.h-8, h.w, 4);
      ctx.fillStyle = "#1c2734";
      ctx.fillRect(hx+5, hy+6, 8, 6); ctx.fillRect(hx+h.w-13, hy+6, 8, 6);
      ctx.fillStyle = "#15121c";
      for (var ck = 0; ck < Math.floor(h.w/6); ck++){
        if (ck % 2 === 0) ctx.fillRect(hx+ck*6, hy+13, 4, 3);
      }
      ctx.fillStyle = "#241a12";
      ctx.beginPath(); ctx.arc(hx+7, hy+h.h-3, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+h.w-7, hy+h.h-3, 4, 0, 7); ctx.fill();
      var lit = Math.floor(G.time/500) % 2 === 0;
      ctx.fillStyle = lit ? "#ffe9b0" : "#8a7a40"; ctx.fillRect(hx+h.w/2-4, hy, 8, 4);
    } else if (h.skin==="suit"){
      // the debt collector in a sharp suit, briefcase swinging
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+3, hy+h.h-3, h.w-6, 5);
      ctx.fillStyle = "#1e2530"; ctx.fillRect(hx+2, hy+8, h.w-4, h.h-10);
      ctx.fillStyle = "#efe6d2"; ctx.fillRect(hx+h.w/2-3, hy+9, 6, 8);
      ctx.fillStyle = "#a32a2a"; ctx.fillRect(hx+h.w/2-1, hy+9, 2, 8);
      ctx.fillStyle = "#e8c39e"; ctx.fillRect(hx+5, hy+2, h.w-10, 9);
      ctx.fillStyle = "#2a2a30"; ctx.fillRect(hx+4, hy, h.w-8, 3);
      var swg = Math.round(Math.sin(G.time/240) * 2);
      ctx.fillStyle = "#54301a"; ctx.fillRect(hx+h.w-7, hy+14+swg, 8, 8);
      ctx.fillStyle = "#e8b04b"; ctx.fillRect(hx+h.w-5, hy+13+swg, 4, 2);
      ctx.fillStyle = "#e8b04b"; ctx.font="8px 'Press Start 2P', monospace"; ctx.textAlign="center";
      ctx.fillText("$", hx+h.w/2, hy+24);
    } else if (h.skin==="tram"){
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+2, hy+h.h-3, h.w-4, 5);
      ctx.fillStyle = "#a3504f"; ctx.fillRect(hx, hy+3, h.w, h.h-7);
      ctx.fillStyle = "#cfc8b8";
      for (var twx=hx+4; twx<hx+h.w-8; twx+=9){ ctx.fillRect(twx, hy+7, 6, 6); }
      ctx.fillStyle = "#6e3231"; ctx.fillRect(hx+2, hy, h.w-4, 4);

      ctx.fillRect(hx+4, hy+h.h-4, 6, 4); ctx.fillRect(hx+h.w-10, hy+h.h-4, 6, 4);
      ctx.strokeStyle = "#241a12";
      ctx.beginPath(); ctx.moveTo(hx+h.w/2+.5, hy); ctx.lineTo(hx+h.w/2+.5, hy-6); ctx.stroke();
    } else if (h.skin==="canvasser"){
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+3, hy+h.h-3, h.w-6, 5);
      ctx.fillStyle = "#6e3231"; ctx.fillRect(hx+2, hy+8, h.w-4, h.h-10);
      ctx.fillStyle = "#e8c39e"; ctx.fillRect(hx+5, hy+2, h.w-10, 9);
      ctx.fillStyle = "#a3504f"; ctx.fillRect(hx+3, hy, h.w-6, 4);
      ctx.fillStyle = "#f2e8d5"; ctx.fillRect(hx+h.w/2-6, hy+12, 12, 9);
      ctx.fillStyle = "#15121c"; ctx.font="7px 'Press Start 2P', monospace"; ctx.textAlign="center";

    } else if (h.skin==="grievance"){

    } else if (h.skin==="truck"){

      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+2, hy+h.h-3, h.w-4, 5);
      ctx.fillStyle = "#4a4c54"; ctx.fillRect(hx, hy+4, h.w-10, h.h-8);

      ctx.fillStyle = "#241a12";
      ctx.beginPath(); ctx.arc(hx+7, hy+h.h-2, 5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+h.w-7, hy+h.h-2, 5, 0, 7); ctx.fill();

      ctx.fillStyle = "#e8c39e"; ctx.fillRect(hx+5, hy+2, h.w-10, 9);
      ctx.fillStyle = "#15121c"; ctx.fillRect(hx+3, hy, h.w-6, 4);
      ctx.fillStyle = "#e25549"; ctx.fillRect(hx+h.w/2-5, hy+13, 10, 6);
      ctx.fillStyle = "#e8b04b"; ctx.font="8px 'Press Start 2P', monospace"; ctx.textAlign="center";

    } else if (h.type==="bubble"){

    if (sx<-30||sy<-30||sx>VIEW_W+30||sy>VIEW_H+30) return;

  });

  NPCS.forEach(function(n){

    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(nx+8, ny+24, 16, 5);

    }
  });

  // the open gate: a beacon over the fountain. The Desk comes first, the Charter after.
  if (gateOpen() || deskOpen()){
    var deskPhase = deskOpen();
    var beaconColor = deskPhase ? "#7fb2e5" : "#e8b04b";

    drawStar(gx, gy-44 + Math.sin(G.time/300)*4, pulse);
    ctx.fillStyle = beaconColor; ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText(beaconLabel, gx, gy-62);

      ctx.fillStyle = "rgba(21,18,28,.9)";
      ctx.fillRect(gx-62, gy+38, 124, 18);
      ctx.strokeStyle = beaconColor; ctx.strokeRect(gx-62.5, gy+38.5, 125, 18);
      ctx.fillStyle = beaconColor;
      ctx.fillText(beaconPrompt, gx, gy+50);
    }
  }

  // doorway prompt
  if (G.nearDoor && G.scene==="WALK"){
    var b = G.nearDoor;
    var dx = b.door.x*TILE-cam.x+TILE/2, dy = (b.door.y+1)*TILE-cam.y-44;
    ctx.fillStyle = "rgba(21,18,28,.9)";
    ctx.fillRect(dx-58, dy, 116, 18);
    ctx.strokeStyle = "#3fb8af"; ctx.strokeRect(dx-58.5, dy+.5, 117, 18);
    ctx.fillStyle = "#3fb8af"; ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText("A: ENTER", dx, dy+12);
  } else if (G.nearNPC && G.scene==="WALK"){
    var n2 = G.nearNPC;
    var tx2 = n2.tx*TILE-cam.x+TILE/2, ty2 = n2.ty*TILE-cam.y-26;
    ctx.fillStyle = "rgba(21,18,28,.9)";
    ctx.fillRect(tx2-50, ty2, 100, 18);
    ctx.strokeStyle = "#3fb8af"; ctx.strokeRect(tx2-50.5, ty2+.5, 101, 18);
    ctx.fillStyle = "#3fb8af"; ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText("A: TALK", tx2, ty2+12);
  }

  // player
  var p = G.player;
  var px = Math.round(p.x-cam.x), py = Math.round(p.y-cam.y);
  var bobp = (p.anim>0) ? Math.round(Math.sin(p.anim/90)*2) : 0;
  var flashing = (G.time < G.invulnUntil) && (Math.floor(G.time/120)%2===0);
  if (G.time < G.careUntil){
    ctx.strokeStyle = "rgba(63,184,175,.7)";
    ctx.beginPath(); ctx.arc(px+p.w/2, py+p.h/2, 20 + Math.sin(G.time/200)*2, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(px+2, py+p.h-4, p.w-4, 5);
  if (!flashing){
  ctx.fillStyle = "#2c4f7c"; ctx.fillRect(px, py+8+bobp, p.w, p.h-8);     // coat
  ctx.fillStyle = "#e8c39e"; ctx.fillRect(px+4, py+bobp, p.w-8, 12);      // face
  ctx.fillStyle = "#5a3a23"; ctx.fillRect(px+3, py-3+bobp, p.w-6, 6);     // hair
  ctx.fillStyle = "#15121c";
  if (p.dir!=="up"){ ctx.fillRect(px+7, py+4+bobp, 2,2); ctx.fillRect(px+p.w-9, py+4+bobp, 2,2); }
  ctx.fillStyle = "#e8b04b"; ctx.fillRect(px+p.w/2-2, py+12+bobp, 4, 4);  // brass button
  }
}

/* ---------- The arcade renderer: a trading floor terminal ---------- */
var TICKER_TAPE = "GRAIN \u25BC12   RAIL \u25B24   DYE \u25BC7   PINS \u25B29   BREAD \u25BC3   COAL \u25B26   HYPE \u25BC22   ";

function renderArcadeTerminal(){
  var E = arcade;
  // the terminal: near black, faint green grid, scanlines
  ctx.fillStyle = "#04100a";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.strokeStyle = "rgba(67,209,124,.07)";
  ctx.lineWidth = 1;
  for (var gx = 0; gx <= VIEW_W; gx += 32){
    ctx.beginPath(); ctx.moveTo(gx+.5, 0); ctx.lineTo(gx+.5, VIEW_H); ctx.stroke();
  }
  for (var gy = 0; gy <= VIEW_H; gy += 32){
    ctx.beginPath(); ctx.moveTo(0, gy+.5); ctx.lineTo(VIEW_W, gy+.5); ctx.stroke();
  }
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (var sl = 0; sl < VIEW_H; sl += 4) ctx.fillRect(0, sl, VIEW_W, 2);

  // the tape scrolls along the top
  ctx.fillStyle = "#02120a";
  ctx.fillRect(0, 0, VIEW_W, 22);
  ctx.strokeStyle = "rgba(67,209,124,.4)";
  ctx.beginPath(); ctx.moveTo(0, 22.5); ctx.lineTo(VIEW_W, 22.5); ctx.stroke();
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#2f8a56";
  var tapeW = ctx.measureText(TICKER_TAPE).width || 600;
  var off = (E.elapsed / 18) % tapeW;
  ctx.fillText(TICKER_TAPE + TICKER_TAPE, -off, 15);

  // the floor line the bears must not cross
  ctx.strokeStyle = "rgba(226,85,73,.55)";
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(0, E.floorY+.5); ctx.lineTo(VIEW_W, E.floorY+.5); ctx.stroke();
  ctx.setLineDash([]);

  // live HUD: score, streak, wave, clock
  var liveScore = E.damagePts + E.comboPts;
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.fillStyle = "#43d17c";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + liveScore, 12, 42);
  ctx.fillStyle = E.combo >= E.cfg.comboEvery ? "#e8b04b" : "#9fe0b8";
  ctx.fillText("STREAK x" + E.combo, 12, 58);
  ctx.textAlign = "right";
  ctx.fillStyle = "#43d17c";
  ctx.fillText("WAVE " + (E.wave+1) + " OF " + E.cfg.waves.length, VIEW_W-12, 42);
  ctx.fillStyle = "#9fe0b8";
  ctx.fillText(Math.floor(E.elapsed/1000) + "s  PAR " + E.cfg.par, VIEW_W-12, 58);

  // sell orders: red down arrows
  E.drops.forEach(function(d){
    var dxc = d.x + d.w/2;
    ctx.fillStyle = "#e25549";
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.w, d.y);
    ctx.lineTo(d.x + d.w, d.y + d.h*0.55);
    ctx.lineTo(dxc, d.y + d.h);
    ctx.lineTo(d.x, d.y + d.h*0.55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillRect(dxc-1, d.y+2, 2, d.h*0.4);
  });

  // bears descend
  E.bears.forEach(function(b){
    var bx = Math.round(b.x), by = Math.round(b.y);
    var body = b.fat ? "#7d4a2a" : "#6e4a24";
    var dark = b.fat ? "#54301a" : "#4a3018";
    // body
    ctx.fillStyle = body;
    ctx.fillRect(bx, by+8, b.w, b.h-8);
    // head and ears
    ctx.fillStyle = dark;
    ctx.fillRect(bx + b.w/2 - 9, by, 18, 12);
    ctx.fillRect(bx + b.w/2 - 11, by-3, 5, 5);
    ctx.fillRect(bx + b.w/2 + 6,  by-3, 5, 5);
    // eyes
    ctx.fillStyle = "#e25549";
    ctx.fillRect(bx + b.w/2 - 6, by+4, 3, 3);
    ctx.fillRect(bx + b.w/2 + 3, by+4, 3, 3);
    // claws
    ctx.fillStyle = "#f2e8d5";
    ctx.fillRect(bx+2, by+b.h-4, 4, 4);
    ctx.fillRect(bx+b.w-6, by+b.h-4, 4, 4);
    // a second wind for fat bears
    if (b.fat && b.hp > 1){
      ctx.fillStyle = "#e8b04b";
      ctx.fillRect(bx + b.w/2 - 8, by + b.h + 3, 16, 3);
    }
  });

  // buy orders rise: brass coins
  E.shots.forEach(function(sh){
    var cx2 = sh.x + sh.w/2, cy2 = sh.y + sh.h/2;
    ctx.fillStyle = "#e8b04b";
    ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "#8a6422";
    ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign = "center";
    ctx.fillText("$", cx2, cy2+3);
  });

  // the bull
  var bl = E.bull;
  var blink = (bl.flash > 0) && (Math.floor(E.elapsed/110) % 2 === 0);
  if (!blink){
    var px = Math.round(bl.x), py = Math.round(bl.y);
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.fillRect(px+4, py+bl.h-2, bl.w-8, 5);
    // body
    ctx.fillStyle = "#b08334";
    ctx.fillRect(px, py+8, bl.w, bl.h-10);
    // head
    ctx.fillStyle = "#8a6422";
    ctx.fillRect(px + bl.w/2 - 10, py, 20, 14);
    // horns
    ctx.fillStyle = "#f2e8d5";
    ctx.fillRect(px + bl.w/2 - 16, py-4, 6, 7);
    ctx.fillRect(px + bl.w/2 + 10, py-4, 6, 7);
    // eyes and snout
    ctx.fillStyle = "#15121c";
    ctx.fillRect(px + bl.w/2 - 6, py+4, 3, 3);
    ctx.fillRect(px + bl.w/2 + 3, py+4, 3, 3);
    ctx.fillStyle = "#43d17c";
    ctx.fillRect(px + bl.w/2 - 4, py+10, 8, 3);
    // hooves
    ctx.fillStyle = "#54301a";
    ctx.fillRect(px+3, py+bl.h-4, 6, 4);
    ctx.fillRect(px+bl.w-9, py+bl.h-4, 6, 4);
  }

  // floating feedback
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "center";
  E.fx.forEach(function(f){
    ctx.globalAlpha = Math.max(0, Math.min(1, f.t/600));
    ctx.fillStyle = f.bad ? "#e25549" : "#43d17c";
    ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
  });
  ctx.globalAlpha = 1;

  // last frame holds under the closing bell
  if (E.over){
    ctx.fillStyle = "rgba(2,10,6,.45)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* The dispatch board: the Chapter 2 skin. Warm rose and cream,
   needs descending as bowls, parcels rising, grievance forms falling. */
var DISPATCH_TAPE = "BREAD QUEUE 12 MIN   TRAM ON TIME   CLINIC WAIT 40 MIN   BOOTS RESTOCKED   MEETING RUNS LONG   HARVEST FAIR   QUOTA 96 PCT   ";

function renderArcadeDispatch(){
  var E = arcade;
  // the board: deep plum, faint rose grid, soft scanlines
  ctx.fillStyle = "#16090f";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.strokeStyle = "rgba(214,126,140,.07)";
  ctx.lineWidth = 1;
  for (var gx = 0; gx <= VIEW_W; gx += 32){
    ctx.beginPath(); ctx.moveTo(gx+.5, 0); ctx.lineTo(gx+.5, VIEW_H); ctx.stroke();
  }
  for (var gy = 0; gy <= VIEW_H; gy += 32){
    ctx.beginPath(); ctx.moveTo(0, gy+.5); ctx.lineTo(VIEW_W, gy+.5); ctx.stroke();
  }
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (var sl = 0; sl < VIEW_H; sl += 4) ctx.fillRect(0, sl, VIEW_W, 2);

  // the dispatch tape along the top
  ctx.fillStyle = "#1d0b12";
  ctx.fillRect(0, 0, VIEW_W, 22);
  ctx.strokeStyle = "rgba(214,126,140,.4)";
  ctx.beginPath(); ctx.moveTo(0, 22.5); ctx.lineTo(VIEW_W, 22.5); ctx.stroke();
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#a06a76";
  var tapeW = ctx.measureText(DISPATCH_TAPE).width || 600;
  var off = (E.elapsed / 18) % tapeW;
  ctx.fillText(DISPATCH_TAPE + DISPATCH_TAPE, -off, 15);

  // the waiting line the needs must not reach
  ctx.strokeStyle = "rgba(226,85,73,.55)";
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(0, E.floorY+.5); ctx.lineTo(VIEW_W, E.floorY+.5); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(226,85,73,.5)";
  ctx.fillText("THE WAITING LINE", VIEW_W-10, E.floorY-6);

  // live HUD
  var liveScore = E.damagePts + E.comboPts;
  ctx.fillStyle = "#e6b8c0";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + liveScore, 12, 42);
  ctx.fillStyle = E.combo >= E.cfg.comboEvery ? "#e8b04b" : "#d6a0ac";
  ctx.fillText("STREAK x" + E.combo, 12, 58);
  ctx.textAlign = "right";
  ctx.fillStyle = "#e6b8c0";
  ctx.fillText("WAVE " + (E.wave+1) + " OF " + E.cfg.waves.length, VIEW_W-12, 42);
  ctx.fillStyle = "#d6a0ac";
  ctx.fillText(Math.floor(E.elapsed/1000) + "s  PAR " + E.cfg.par, VIEW_W-12, 58);

  // grievance forms drift down: cream paper with rule lines
  E.drops.forEach(function(d){
    ctx.fillStyle = "#efe6d2";
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = "#b8a98c";
    ctx.fillRect(d.x+2, d.y+3, d.w-4, 1);
    ctx.fillRect(d.x+2, d.y+6, d.w-4, 1);
    ctx.fillRect(d.x+2, d.y+9, d.w-4, 1);
    ctx.fillStyle = "#e25549";
    ctx.fillRect(d.x+2, d.y+d.h-3, 4, 2);
  });

  // needs descend: soup bowls, crates when fat
  E.bears.forEach(function(b){
    var bx = Math.round(b.x), by = Math.round(b.y);
    if (b.fat){
      // a heavy crate of needs
      ctx.fillStyle = "#8a5a3c";
      ctx.fillRect(bx, by+4, b.w, b.h-4);
      ctx.fillStyle = "#5c3a25";
      ctx.fillRect(bx, by+4, b.w, 4);
      ctx.fillRect(bx + b.w/2 - 2, by+4, 4, b.h-4);
      ctx.fillStyle = "#efe6d2";
      ctx.fillRect(bx+4, by+b.h/2, b.w-8, 5);
      if (b.hp > 1){
        ctx.fillStyle = "#e8b04b";
        ctx.fillRect(bx + b.w/2 - 8, by + b.h + 3, 16, 3);
      }
    } else {
      // a bowl with steam
      ctx.fillStyle = "#d6a0ac";
      ctx.beginPath();
      ctx.moveTo(bx, by+10);
      ctx.lineTo(bx + b.w, by+10);
      ctx.lineTo(bx + b.w - 6, by + b.h);
      ctx.lineTo(bx + 6, by + b.h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#9e6f7a";
      ctx.fillRect(bx, by+10, b.w, 3);
      ctx.fillStyle = "rgba(239,230,210,.7)";
      var wob = Math.floor(E.elapsed/240) % 2 === 0 ? 0 : 2;
      ctx.fillRect(bx + 8 + wob, by, 2, 7);
      ctx.fillRect(bx + b.w - 12 - wob, by+1, 2, 7);
    }
  });

  // parcels rise: brown paper with a cross of twine
  E.shots.forEach(function(sh){
    ctx.fillStyle = "#b08334";
    ctx.fillRect(sh.x-2, sh.y, sh.w+4, sh.h);
    ctx.fillStyle = "#efe6d2";
    ctx.fillRect(sh.x-2, sh.y + sh.h/2 - 1, sh.w+4, 2);
    ctx.fillRect(sh.x + sh.w/2 - 1, sh.y, 2, sh.h);
  });

  // the courier and the cart
  var bl = E.bull;
  var blink = (bl.flash > 0) && (Math.floor(E.elapsed/110) % 2 === 0);
  if (!blink){
    var px = Math.round(bl.x), py = Math.round(bl.y);
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.fillRect(px+4, py+bl.h-2, bl.w-8, 5);
    // the cart bed, stacked with parcels
    ctx.fillStyle = "#7a4a2e";
    ctx.fillRect(px, py+10, bl.w, bl.h-12);
    ctx.fillStyle = "#b08334";
    ctx.fillRect(px+4, py+3, 10, 9);
    ctx.fillRect(px+17, py+5, 9, 7);
    ctx.fillStyle = "#efe6d2";
    ctx.fillRect(px+4, py+7, 10, 1);
    ctx.fillRect(px+17, py+8, 9, 1);
    // the courier at the handle, teal cap
    ctx.fillStyle = "#e0b88a";
    ctx.fillRect(px + bl.w - 9, py+2, 7, 7);
    ctx.fillStyle = "#3fae9e";
    ctx.fillRect(px + bl.w - 10, py, 9, 3);
    ctx.fillStyle = "#3a5a6e";
    ctx.fillRect(px + bl.w - 9, py+9, 7, 9);
    // wheels
    ctx.fillStyle = "#2a1c12";
    ctx.fillRect(px+5, py+bl.h-5, 7, 5);
    ctx.fillRect(px+bl.w-13, py+bl.h-5, 7, 5);
  }

  // floating feedback
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "center";
  E.fx.forEach(function(f){
    ctx.globalAlpha = Math.max(0, Math.min(1, f.t/600));
    ctx.fillStyle = f.bad ? "#e25549" : "#e6b8c0";
    ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
  });
  ctx.globalAlpha = 1;

  // last frame holds under the end of shift
  if (E.over){
    ctx.fillStyle = "rgba(20,6,12,.45)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* The courtyard at dusk: the SAFETY NET frame. Warm brick, lit windows
   the needs fall from, a laundry line, the waiting folk, and the net. */
function renderCatchNet(){
  if (!ctx || !arcade) return;
  var A = arcade, W = A.W, H = A.H;
  // dusk air
  ctx.fillStyle = "#241b14"; ctx.fillRect(0, 0, W, H);
  // the courtyard wall and its window rows
  ctx.fillStyle = "#3a241c"; ctx.fillRect(0, 0, W, 130);
  ctx.fillStyle = "#6e3231"; ctx.fillRect(0, 126, W, 6);
  for (var wx = 24; wx < W - 30; wx += 56){
    for (var wy = 18; wy < 110; wy += 46){
      var lit = tileHash(wx, wy) % 4 !== 0;
      ctx.fillStyle = lit ? "rgba(255,225,170,.55)" : "rgba(20,14,10,.8)";
      ctx.fillRect(wx, wy, 22, 28);
      ctx.fillStyle = "rgba(20,14,10,.5)";
      ctx.fillRect(wx + 10, wy, 2, 28); ctx.fillRect(wx, wy + 13, 22, 2);
      ctx.fillStyle = "#241a12"; ctx.fillRect(wx - 3, wy + 28, 28, 4);
    }
  }
  // the laundry line, still working the night shift
  ctx.strokeStyle = "rgba(220,215,200,.35)";
  ctx.beginPath(); ctx.moveTo(0, 148); ctx.lineTo(W, 142); ctx.stroke();
  var swy = Math.round(Math.sin(G.time / 420) * 2);
  var lcols = ["#efe6d2", "#3fb8af", "#e8b04b", "#a3504f"];
  for (var lc = 0; lc < 8; lc++){
    ctx.fillStyle = lcols[lc % 4];
    ctx.fillRect(40 + lc * (W - 90) / 8 + (lc % 2 === 0 ? swy : -swy), 144, 14, 16);
  }
  // the cobbled floor and the waiting folk the net protects
  ctx.fillStyle = "#2c211a"; ctx.fillRect(0, A.floorY + 18, W, H - A.floorY - 18);
  ctx.fillStyle = "rgba(255,255,255,.05)";
  for (var cb = 0; cb < W; cb += 26){ ctx.fillRect(cb, A.floorY + 26, 13, 2); }
  for (var p = 0; p < 9; p++){
    var px = 30 + p * (W - 60) / 9, ph = tileHash(p, 7) % 5;
    ctx.fillStyle = ["#8a6a4c","#5b7f9e","#a3504f","#7a9e5b","#cfc8b8"][p % 5];
    ctx.fillRect(px, A.floorY + 34 - ph, 14, 22 + ph);
    ctx.fillStyle = "#e8c39e"; ctx.fillRect(px + 3, A.floorY + 26 - ph, 8, 8);
  }
  // falling items
  for (var i = 0; i < A.items.length; i++){
    var it = A.items[i];
    if (it.type === "grievance"){
      var flut = Math.sin(A.elapsed / 160 + it.phase) * 3;
      ctx.fillStyle = "#cfc8c0"; ctx.fillRect(it.x + flut, it.y, it.w, it.h);
      ctx.fillStyle = "rgba(60,60,70,.6)";
      ctx.fillRect(it.x + flut + 3, it.y + 4, it.w - 6, 2);
      ctx.fillRect(it.x + flut + 3, it.y + 9, it.w - 6, 2);
      ctx.fillRect(it.x + flut + 3, it.y + 14, it.w - 9, 2);
      ctx.fillStyle = "#a3504f"; ctx.fillRect(it.x + flut + it.w - 7, it.y + it.h - 6, 5, 4);
    } else if (it.type === "urgent"){
      var pulse = Math.floor(A.elapsed / 180) % 2 === 0;
      ctx.fillStyle = pulse ? "#e25549" : "#a83a32";
      ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.fillStyle = "#efe6d2";
      ctx.fillRect(it.x + it.w/2 - 2, it.y + 3, 4, it.h - 6);
      ctx.fillRect(it.x + 3, it.y + it.h/2 - 2, it.w - 6, 4);
    } else if (it.type === "bread"){
      ctx.fillStyle = "#caa06a"; ctx.fillRect(it.x, it.y + 4, it.w, it.h - 6);
      ctx.fillStyle = "#e8b04b"; ctx.fillRect(it.x + 2, it.y + 2, it.w - 4, 6);
      ctx.fillStyle = "rgba(0,0,0,.15)";
      ctx.fillRect(it.x + 4, it.y + 6, 2, it.h - 10); ctx.fillRect(it.x + it.w - 7, it.y + 6, 2, it.h - 10);
    } else if (it.type === "med"){
      ctx.fillStyle = "#efe6d2"; ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.fillStyle = "#3fb8af";
      ctx.fillRect(it.x + it.w/2 - 2, it.y + 3, 4, it.h - 6);
      ctx.fillRect(it.x + 3, it.y + it.h/2 - 2, it.w - 6, 4);
    } else {
      ctx.fillStyle = "#8a5a3c"; ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.fillStyle = "#5c3a25"; ctx.fillRect(it.x, it.y + it.h/2 - 2, it.w, 4);
      ctx.fillStyle = "#e8d8bc"; ctx.fillRect(it.x + it.w/2 - 2, it.y, 4, it.h);
    }
  }
  // the net: two poles and the woven mesh between
  var N = A.net;
  var flash = N.flash > 0 && Math.floor(N.flash / 90) % 2 === 0;
  ctx.fillStyle = flash ? "#e25549" : "#5c4632";
  ctx.fillRect(N.x - 4, N.y - 14, 4, 28); ctx.fillRect(N.x + N.w, N.y - 14, 4, 28);
  ctx.strokeStyle = flash ? "rgba(226,85,73,.9)" : "rgba(232,216,188,.85)";
  ctx.beginPath(); ctx.moveTo(N.x, N.y - 10);
  ctx.quadraticCurveTo(N.x + N.w/2, N.y + N.h + 6, N.x + N.w, N.y - 10); ctx.stroke();
  for (var mx = 1; mx < 5; mx++){
    ctx.beginPath();

function renderStack(){
  if (!ctx || !arcade) return;
  var A = arcade, W = A.W, H = A.H, cell = A.cell;
  var ox = A.originX, oy = A.originY;
  // depot concrete
  ctx.fillStyle = "#1b1f23"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#23282d"; ctx.fillRect(0, 0, W, 84);
  ctx.fillStyle = "#7a3b2e"; ctx.fillRect(0, 80, W, 4);
  // faint slab grid on the back wall
  ctx.strokeStyle = "rgba(255,255,255,.03)";
  for (var gx = 0; gx < W; gx += 32){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 84); ctx.stroke(); }
  // the loading floor frame, oxide red
  ctx.strokeStyle = "#7a3b2e"; ctx.lineWidth = 4;
  ctx.strokeRect(ox - 4, oy - 4, A.fieldW + 8, A.fieldH + 8);
  ctx.lineWidth = 1;
  // cell guide lines
  ctx.strokeStyle = "rgba(255,255,255,.05)";
  for (var c = 0; c <= A.cols; c++){ ctx.beginPath(); ctx.moveTo(ox + c * cell, oy); ctx.lineTo(ox + c * cell, oy + A.fieldH); ctx.stroke(); }
  for (var r = 0; r <= A.rows; r++){ ctx.beginPath(); ctx.moveTo(ox, oy + r * cell); ctx.lineTo(ox + A.fieldW, oy + r * cell); ctx.stroke(); }

  function crate(px, py, type){
    var face = type === "steel" ? "#8a9099" : type === "grain" ? "#caa14b" : type === "fuel" ? "#3f8f8a" : "#d2603a";
    var dark = type === "steel" ? "#5d636b" : type === "grain" ? "#8f6f2e" : type === "fuel" ? "#266360" : "#9c3f23";
    ctx.fillStyle = dark; ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);
    ctx.fillStyle = face; ctx.fillRect(px + 3, py + 3, cell - 6, cell - 6);
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.moveTo(px + 3, py + 3); ctx.lineTo(px + cell - 3, py + cell - 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px + cell - 3, py + 3); ctx.lineTo(px + 3, py + cell - 3); ctx.stroke();
  }

  // settled crates
  for (var rr = 0; rr < A.rows; rr++){
    for (var cc = 0; cc < A.cols; cc++){
      var g = A.grid[rr][cc];
      if (g) crate(ox + cc * cell, oy + rr * cell, g.type);
    }
  }
  // landing ghost for the active column
  if (A.active){
    var lr = -1;
    for (var rg = A.rows - 1; rg >= 0; rg--){ if (!A.grid[rg][A.active.col]){ lr = rg; break; } }
    if (lr >= 0){
      ctx.fillStyle = "rgba(210,96,58,.16)";
      ctx.fillRect(ox + A.active.col * cell + 1, oy + lr * cell + 1, cell - 2, cell - 2);
    }
    // the falling crate
    crate(ox + A.active.col * cell, Math.round(A.active.y), A.active.type);
  }
  // loader rail
  ctx.fillStyle = "#3a2018"; ctx.fillRect(ox - 4, oy + A.fieldH + 6, A.fieldW + 8, 8);

  // floating feedback
  ctx.textAlign = "center"; ctx.font = "8px 'Press Start 2P', monospace";
  for (var ffi = 0; ffi < A.fx.length; ffi++){
    var x = A.fx[ffi];
    ctx.fillStyle = x.bad ? "#e25549" : "#7fe5b0";
    ctx.globalAlpha = Math.min(1, x.t / 500);
    ctx.fillText(x.text, x.x, x.y);
    ctx.globalAlpha = 1;
  }
  // HUD
  ctx.textAlign = "left"; ctx.fillStyle = "#e8d8bc";
  ctx.fillText("QUOTA " + A.hits, 14, 22);
  ctx.fillText("STREAK x" + A.combo, 14, 40);
  ctx.textAlign = "right";
  ctx.fillText("PLAN YR " + (A.wave + 1) + "/" + A.cfg.waves.length, W - 14, 22);
  ctx.fillText(Math.floor(A.elapsed / 1000) + "s", W - 14, 40);
}

function renderCrosser(){
  if (!ctx || !arcade) return;
  var A = arcade, W = A.W, H = A.H, B = A.bill;
  // the civic avenue at dusk
  ctx.fillStyle = "#11161d"; ctx.fillRect(0, 0, W, H);

  // the chamber band at the top: a pale marble portico the bill climbs toward,
  // its columns glowing a touch brighter when the bill is near
  var nearGoal = B.y < A.laneTop + A.laneH;
  ctx.fillStyle = "#2a3344"; ctx.fillRect(0, 0, W, A.goalY + 18);
  ctx.fillStyle = "#cfc8b8"; ctx.fillRect(0, A.goalY + 2, W, 16);
  ctx.fillStyle = "#b3ac9a";
  ctx.beginPath(); ctx.moveTo(W/2, A.goalY - 14); ctx.lineTo(W/2 - 70, A.goalY + 2); ctx.lineTo(W/2 + 70, A.goalY + 2); ctx.closePath(); ctx.fill();
  ctx.fillStyle = nearGoal ? "rgba(232,176,75,.85)" : "#efe6d2";
  for (var col = 40; col < W - 30; col += 48){ ctx.fillRect(col, A.goalY + 4, 8, 12); }
  ctx.fillStyle = "#3fb8af"; ctx.fillRect(0, A.goalY + 18, W, 2);

  // the lanes: market asphalt one way, red tape corridor the other
  for (var l = 0; l < A.laneCount; l++){
    var ly = A.laneTop + l * A.laneH;
    var market = (l % 2 === 0);
    ctx.fillStyle = market ? "#1c2026" : "#2a2533";
    ctx.fillRect(0, ly, W, A.laneH);
    if (market){
      // center dashes scrolling with the lane direction
      ctx.fillStyle = "rgba(232,216,140,.4)";
      var off = (Math.floor(A.elapsed / 24) % 36);
      for (var dx = -off; dx < W; dx += 36){ ctx.fillRect(dx, ly + A.laneH/2 - 1, 18, 2); }
    } else {
      // a faint filing grid on the tape corridor
      ctx.strokeStyle = "rgba(255,255,255,.04)";
      for (var gx = 0; gx < W; gx += 22){ ctx.beginPath(); ctx.moveTo(gx, ly); ctx.lineTo(gx, ly + A.laneH); ctx.stroke(); }
    }
    ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(0, ly, W, 2);
  }
  // the lobby steps the bill starts from
  ctx.fillStyle = "#24303a"; ctx.fillRect(0, A.startY - 6, W, H - A.startY + 6);
  ctx.fillStyle = "rgba(255,255,255,.05)";
  for (var syb = A.startY + 2; syb < H; syb += 8){ ctx.fillRect(0, syb, W, 1); }

  // the traffic
  for (var i = 0; i < A.obstacles.length; i++){
    var o = A.obstacles[i];
    if (o.kind === "market"){
      // a market vehicle: body, cab window, two wheels, facing its direction
      ctx.fillStyle = "#3f6e6a"; ctx.fillRect(o.x, o.y + 2, o.w, o.h - 6);
      ctx.fillStyle = "#2a4a47"; ctx.fillRect(o.x, o.y + 2, o.w, 3);
      ctx.fillStyle = "rgba(200,225,250,.6)";
      var cab = o.dir > 0 ? o.x + o.w - 12 : o.x + 4;
      ctx.fillRect(cab, o.y + 5, 8, o.h - 12);
      ctx.fillStyle = "#15121c";
      ctx.fillRect(o.x + 5, o.y + o.h - 6, 6, 4); ctx.fillRect(o.x + o.w - 11, o.y + o.h - 6, 6, 4);
      ctx.fillStyle = (o.dir > 0) ? "#e8b04b" : "#e25549";
      ctx.fillRect(o.dir > 0 ? o.x + o.w - 3 : o.x, o.y + o.h/2 - 2, 3, 4);
    } else {
      // red tape: a clipboard or form with a clip and ruled lines
      ctx.fillStyle = "#e2dccb"; ctx.fillRect(o.x, o.y + 2, o.w, o.h - 6);
      ctx.fillStyle = "#a3504f"; ctx.fillRect(o.x, o.y + 2, o.w, 3);
      ctx.fillStyle = "#8a8472"; ctx.fillRect(o.x + o.w/2 - 4, o.y, 8, 4);
      ctx.fillStyle = "rgba(80,80,90,.5)";
      for (var rl = o.y + 8; rl < o.y + o.h - 8; rl += 4){ ctx.fillRect(o.x + 4, rl, o.w - 8, 1); }
      ctx.fillStyle = "#3fb8af"; ctx.fillRect(o.x + o.w - 9, o.y + o.h - 9, 5, 4);
    }
  }

  // the bill: a cream scroll with a wax seal ribbon, flashing when knocked
  var flash = B.flash > 0 && Math.floor(B.flash / 90) % 2 === 0;
  ctx.fillStyle = flash ? "#e25549" : "#f2e8d5";
  ctx.fillRect(B.x, B.y, B.w, B.h);
  ctx.fillStyle = "rgba(120,100,70,.5)";
  ctx.fillRect(B.x + 3, B.y + 4, B.w - 6, 1); ctx.fillRect(B.x + 3, B.y + 7, B.w - 6, 1); ctx.fillRect(B.x + 3, B.y + 10, B.w - 8, 1);
  ctx.fillStyle = "#a3504f"; ctx.fillRect(B.x + B.w/2 - 3, B.y + B.h - 4, 6, 5);
  // sprint readiness pip
  ctx.fillStyle = B.cooldown <= 0 ? "#3fb8af" : "rgba(63,184,175,.25)";
  ctx.fillRect(B.x + B.w/2 - 2, B.y - 6, 4, 4);

  // floating feedback
  ctx.textAlign = "center"; ctx.font = "8px 'Press Start 2P', monospace";
  for (var f = 0; f < A.fx.length; f++){
    var fxi = A.fx[f];
    ctx.fillStyle = fxi.bad ? "#e25549" : "#7fe5b0";
    ctx.globalAlpha = Math.min(1, fxi.t / 500);
    ctx.fillText(fxi.text, fxi.x, fxi.y);
    ctx.globalAlpha = 1;
  }
  // HUD
  ctx.textAlign = "left"; ctx.fillStyle = "#e8d8bc";
  ctx.fillText("BILLS " + A.hits, 14, 20);
  ctx.fillText("STREAK x" + A.combo, 14, 36);
  ctx.textAlign = "right";
  ctx.fillText("SESSION " + (A.wave + 1) + "/" + A.cfg.waves.length, W - 14, 20);
  ctx.fillText(Math.floor(A.elapsed / 1000) + "s", W - 14, 36);
}

function renderArcade(){
  if (arcade && arcade.kind === "stack"){ renderStack(); return; }
  if (arcade && arcade.kind === "catch"){ renderCatchNet(); return; }
  if (arcade && arcade.kind === "crosser"){ renderCrosser(); return; }
  if (arcade && arcade.cfg.skin === "dispatch") renderArcadeDispatch();
  else renderArcadeTerminal();
}

function drawStar(cx, cy, r){
  ctx.beginPath();
  for (var i=0;i<10;i++){
    var ang = -Math.PI/2 + i*Math.PI/5;
    var rad = (i%2===0)? r : r*0.45;
    ctx.lineTo(cx+Math.cos(ang)*rad, cy+Math.sin(ang)*rad);
  }
  ctx.closePath(); ctx.fill();
}

}

/* every freeplay collapse borrows its chapter's desk theming */
CH1_FREEPLAY.collapseTitle = CH1_DESK.collapseTitle;
CH1_FREEPLAY.collapseLines = CH1_DESK.collapseLines;

selectChapter("ch1");

/* ---------- Main loop ---------- */
var last = 0;
function frame(ts){
  if (!last) last = ts;
  var dt = Math.min(50, ts-last);
  last = ts;
  update(dt);
  render();
  window.requestAnimationFrame(frame);
}
if (window.requestAnimationFrame) window.requestAnimationFrame(frame);

refreshHUD();
refreshTitle();
