/* =====================================================
   THE ARCADE. Milestone 4.
   BUY THE DIP: bears are falling on the market and the
   bull answers every one with a buy order. Damage,
   streaks, a clean sheet, and speed all pay, and every
   point banks straight to the lifetime total. Distinct
   arcade presentation per Section 10. The wave table is
   the difficulty baseline Chapter 2 will dial up.
   ===================================================== */

var CH1_ARCADE = {
  title: "BUY THE DIP",
  skin: "terminal",
  startLabel: "RING THE BELL",
  endTitle: "CLOSING BELL",
  hitVerb: "HIT A BEAR",
  intro: "The bears are falling on the market and every one of them lands on somebody. Steer the bull, answer each bear with a buy order, and do not let them reach the floor. Buying when everyone else panics is the oldest trade in the book. It only pays if you can stomach the claws.",
  cleanLine: "Every dip bought, nothing bought you. The floor is yours.",
  hitLine: "The market got its licks in, and you bought the dip anyway. That is the job.",
  lines: { through: "THE BEAR GOT THROUGH", drop: "SELL ORDER LANDED" },
  par: 75,             // seconds. Finish under par and the clock pays
  speedCap: 25,        // ceiling on the speed bonus
  noHitBonus: 25,      // a clean sheet, in the no hit run tradition
  hitPts: 2,           // damage points per landed buy order
  comboEvery: 5,       // streak length that triggers the bonus
  comboBonus: 5,       // points per streak milestone
  bull: { w: 40, h: 26, speed: 270 },
  shot: { w: 8, h: 14, speed: 440, cooldown: 230 },
  drop: { w: 12, h: 14 },
  waves: [
    { count: 8,  hp: 1, fatEvery: 0, fatHp: 2, fall: 36, sway: 16, spawnGap: 1000, dropPerSec: 0.10, dropFall: 130 },
    { count: 10, hp: 1, fatEvery: 0, fatHp: 2, fall: 46, sway: 22, spawnGap: 850,  dropPerSec: 0.16, dropFall: 160 },
    { count: 12, hp: 1, fatEvery: 4, fatHp: 2, fall: 56, sway: 28, spawnGap: 720,  dropPerSec: 0.22, dropFall: 190 }
  ]
};

/* The engine: pure state and rules, no DOM, stepped by update(dt).
   Uses the seedable rng so tests stay deterministic. */
function ArcadeEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var floorY = H - 70;
  var E = {
    cfg: cfg, W: W, H: H, floorY: floorY,
    wave: 0, spawned: 0, spawnTimer: 700, bearSeq: 0,
    bears: [], shots: [], drops: [], fx: [],
    bull: { x: W/2 - cfg.bull.w/2, y: floorY + 10, w: cfg.bull.w, h: cfg.bull.h,
            cooldown: 0, invulnUntil: 0, flash: 0 },
    input: { left: false, right: false },
    elapsed: 0,
    hits: 0, damagePts: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }

  function spawnBear(){
    var wc = waveCfg();
    E.bearSeq++;
    var fat = wc.fatEvery > 0 && (E.bearSeq % wc.fatEvery === 0);
    var w = fat ? 42 : 28, h = fat ? 34 : 26;
    var baseX = 30 + rng() * (W - 60 - w);
    E.bears.push({
      x: baseX, y: -h, w: w, h: h, baseX: baseX,
      hp: fat ? wc.fatHp : wc.hp, fat: fat,
      fall: wc.fall * (0.85 + rng() * 0.3),
      sway: wc.sway, phase: rng() * 6.28
    });
    E.spawned++;
  }

  function addFx(text, x, y, bad){
    E.fx.push({ text: text, x: x, y: y, t: 950, bad: !!bad });
  }

  function takeHit(reason, x, y){
    E.playerHits++;
    E.combo = 0;
    E.bull.invulnUntil = E.elapsed + 900;
    E.bull.flash = 900;
    addFx(reason, x, y, true);
  }

  E.fire = function(){
    if (E.over) return false;
    if (E.bull.cooldown > 0) return false;
    E.bull.cooldown = cfg.shot.cooldown;
    E.shots.push({ x: E.bull.x + E.bull.w/2 - cfg.shot.w/2,
                   y: E.bull.y - cfg.shot.h, w: cfg.shot.w, h: cfg.shot.h });
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();

    // the bull moves and reloads
    if (E.input.left)  E.bull.x -= cfg.bull.speed * s;
    if (E.input.right) E.bull.x += cfg.bull.speed * s;
    E.bull.x = Math.max(8, Math.min(E.bull.x, W - 8 - E.bull.w));
    if (E.bull.cooldown > 0) E.bull.cooldown -= dt;
    if (E.bull.flash > 0) E.bull.flash -= dt;

    // the market keeps sending bears
    if (E.spawned < wc.count){
      E.spawnTimer -= dt;
      if (E.spawnTimer <= 0){ spawnBear(); E.spawnTimer = wc.spawnGap; }
    }

    // bears fall, sway, and fling sell orders
    for (var i = E.bears.length - 1; i >= 0; i--){
      var b = E.bears[i];
      b.y += b.fall * s;
      b.x = b.baseX + Math.sin(E.elapsed / 700 + b.phase) * b.sway;
      if (rng() < wc.dropPerSec * s){
        E.drops.push({ x: b.x + b.w/2 - cfg.drop.w/2, y: b.y + b.h,
                       w: cfg.drop.w, h: cfg.drop.h, fall: wc.dropFall });
      }
      if (b.y + b.h >= floorY){
        E.bears.splice(i, 1);
        takeHit((cfg.lines && cfg.lines.through) || "THE BEAR GOT THROUGH", b.x + b.w/2, floorY - 18);
      }
    }

    // buy orders rise and land
    for (var j = E.shots.length - 1; j >= 0; j--){
      var sh = E.shots[j];
      sh.y -= cfg.shot.speed * s;
      if (sh.y + sh.h < 0){ E.shots.splice(j, 1); continue; }
      for (var k = E.bears.length - 1; k >= 0; k--){
        var bb = E.bears[k];
        if (rectsOverlap(sh.x, sh.y, sh.w, sh.h, bb.x, bb.y, bb.w, bb.h)){
          E.shots.splice(j, 1);
          bb.hp--;
          E.hits++;
          E.damagePts += cfg.hitPts;
          E.combo++;
          if (E.combo > E.bestCombo) E.bestCombo = E.combo;
          var line = "+" + cfg.hitPts;
          if (E.combo % cfg.comboEvery === 0){
            E.comboPts += cfg.comboBonus;
            line = "STREAK x" + E.combo + " +" + cfg.comboBonus;
          }
          addFx(line, bb.x + bb.w/2, bb.y, false);
          if (bb.hp <= 0) E.bears.splice(k, 1);
          break;
        }
      }
    }

    // sell orders fall on the bull
    for (var m = E.drops.length - 1; m >= 0; m--){
      var d = E.drops[m];
      d.y += d.fall * s;
      if (d.y > H){ E.drops.splice(m, 1); continue; }
      if (rectsOverlap(d.x, d.y, d.w, d.h, E.bull.x, E.bull.y, E.bull.w, E.bull.h)){
        E.drops.splice(m, 1);
        if (E.elapsed >= E.bull.invulnUntil)
          takeHit((cfg.lines && cfg.lines.drop) || "SELL ORDER LANDED", E.bull.x + E.bull.w/2, E.bull.y - 16);
      }
    }

    // floating feedback decays
    for (var f = E.fx.length - 1; f >= 0; f--){
      E.fx[f].t -= dt; E.fx[f].y -= 20 * s;
      if (E.fx[f].t <= 0) E.fx.splice(f, 1);
    }

    // wave and game progression
    if (E.spawned >= wc.count && E.bears.length === 0 && E.drops.length === 0){
      if (E.wave < cfg.waves.length - 1){
        E.wave++; E.spawned = 0; E.spawnTimer = 900; E.bearSeq = 0;
        addFx("WAVE " + (E.wave + 1), W/2, H/2 - 40, false);
      } else {
        E.over = true;
      }
    }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0) ? cfg.noHitBonus : 0;
    var speed = E.over
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts,
      comboPts: E.comboPts,
      bestCombo: E.bestCombo,
      noHit: noHit,
      speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* =====================================================
   THE SAFETY NET. Milestone 11. The Chapter 2 cabinet.
   A lane catcher in the classic catch game tradition:
   needs fall from the courtyard windows, the player
   slides the collective net to catch them, urgent cases
   pay triage, and grievance forms must not be caught.
   Pure state, no DOM, seeded rng, stepped by update(dt).
   Public API mirrors ArcadeEngine: input, fire, update,
   score, over, banked, hits, playerHits, elapsed.
   ===================================================== */
function CatchEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var floorY = H - 70;
  var E = {
    kind: "catch",
    cfg: cfg, W: W, H: H, floorY: floorY,
    wave: 0, spawned: 0, spawnTimer: 800, itemSeq: 0,
    items: [], fx: [],
    net: { x: W/2 - cfg.net.w/2, y: floorY - 4, w: cfg.net.w, h: cfg.net.h,
           boostUntil: 0, cooldown: 0, invulnUntil: 0, flash: 0 },
    input: { left: false, right: false },
    elapsed: 0,
    hits: 0, damagePts: 0, urgentCaught: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }

  function spawnItem(){
    var wc = waveCfg();
    E.itemSeq++;
    var grievance = rng() < wc.griefShare;
    var urgent = !grievance && wc.urgentEvery > 0 && (E.itemSeq % wc.urgentEvery === 0);
    var kinds = ["bread", "med", "parcel"];
    var type = grievance ? "grievance" : (urgent ? "urgent" : kinds[Math.floor(rng() * kinds.length)]);
    var w = grievance ? 18 : 20, h = grievance ? 22 : 18;
    var baseX = 26 + rng() * (W - 52 - w);
    E.items.push({
      x: baseX, y: -h, w: w, h: h, baseX: baseX, type: type,
      fall: wc.fall * (urgent ? 1.45 : 0.85 + rng() * 0.3),
      sway: type === "grievance" ? wc.sway * 1.8 : wc.sway * 0.5,
      phase: rng() * 6.28
    });
    E.spawned++;
  }

  function addFx(text, x, y, bad){
    E.fx.push({ text: text, x: x, y: y, t: 950, bad: !!bad });
  }

  function takeHit(reason, x, y){
    E.playerHits++;
    E.combo = 0;
    E.net.invulnUntil = E.elapsed + 700;
    E.net.flash = 700;
    addFx(reason, x, y, true);
  }

  // FIRE is the hustle: a short burst of net speed on a cooldown
  E.fire = function(){
    if (E.over) return false;
    if (E.net.cooldown > 0) return false;
    E.net.cooldown = cfg.hustle.cooldown;
    E.net.boostUntil = E.elapsed + cfg.hustle.duration;
    addFx("HUSTLE", E.net.x + E.net.w/2, E.net.y - 26, false);
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();

    // the net slides, faster on a hustle
    var sp = cfg.net.speed * (E.elapsed < E.net.boostUntil ? cfg.hustle.mult : 1);
    if (E.input.left)  E.net.x -= sp * s;
    if (E.input.right) E.net.x += sp * s;
    E.net.x = Math.max(8, Math.min(E.net.x, W - 8 - E.net.w));
    if (E.net.cooldown > 0) E.net.cooldown -= dt;
    if (E.net.flash > 0) E.net.flash -= dt;

    // the windows keep sending needs
    if (E.spawned < wc.count){
      E.spawnTimer -= dt;
      if (E.spawnTimer <= 0){ spawnItem(); E.spawnTimer = wc.spawnGap; }
    }

    // items fall and drift; the net catches, the cobbles judge
    for (var i = E.items.length - 1; i >= 0; i--){
      var it = E.items[i];
      it.y += it.fall * s;
      it.x = it.baseX + Math.sin(E.elapsed / 600 + it.phase) * it.sway;

      if (rectsOverlap(it.x, it.y, it.w, it.h, E.net.x, E.net.y - 8, E.net.w, E.net.h + 8)){
        E.items.splice(i, 1);
        if (it.type === "grievance"){
          if (E.elapsed >= E.net.invulnUntil)
            takeHit((cfg.lines && cfg.lines.drop) || "A GRIEVANCE STUCK TO THE NET",
              it.x + it.w/2, E.net.y - 20);
          continue;
        }
        var pts = cfg.hitPts * (it.type === "urgent" ? 2 : 1);
        if (it.type === "urgent") E.urgentCaught++;
        E.hits++;
        E.damagePts += pts;
        E.combo++;
        if (E.combo > E.bestCombo) E.bestCombo = E.combo;
        var line = (it.type === "urgent" ? "URGENT +" : "+") + pts;
        if (E.combo % cfg.comboEvery === 0){
          E.comboPts += cfg.comboBonus;
          line = "STREAK x" + E.combo + " +" + cfg.comboBonus;
        }
        addFx(line, it.x + it.w/2, E.net.y - 22, false);
        continue;
      }

      if (it.y + it.h >= floorY + 18){
        E.items.splice(i, 1);
        if (it.type === "grievance"){
          addFx("FILED", it.x + it.w/2, floorY - 8, false);
        } else {
          takeHit((cfg.lines && cfg.lines.through) || "A NEED HIT THE COBBLES",
            it.x + it.w/2, floorY - 18);
        }
      }
    }

    // floating feedback decays
    for (var f = E.fx.length - 1; f >= 0; f--){
      E.fx[f].t -= dt; E.fx[f].y -= 20 * s;
      if (E.fx[f].t <= 0) E.fx.splice(f, 1);
    }

    // wave and game progression
    if (E.spawned >= wc.count && E.items.length === 0){
      if (E.wave < cfg.waves.length - 1){
        E.wave++; E.spawned = 0; E.spawnTimer = 900; E.itemSeq = 0;
        addFx("SHIFT " + (E.wave + 1), W/2, H/2 - 40, false);
      } else {
        E.over = true;
      }
    }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0) ? cfg.noHitBonus : 0;
    var speed = E.over
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts,
      comboPts: E.comboPts,
      bestCombo: E.bestCombo,
      noHit: noHit,
      speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* One dispatcher: each chapter names its engine in its arcade config,
   per the roadmap. Unknown or missing engines fall back to the shooter. */

/* QUOTA! the Chapter 3 arcade, the third distinct engine.
   A falling block stacker in the Tetris tradition: ration crates
   descend onto a loading floor, the verb is FULFILL, and a row
   packed across every column ships as a met quota and clears.
   A column stacked to the ceiling is a jam, the shortage made
   physical. Pure state, seedable rng, time stepped, so it runs
   headless in jsdom exactly like the shooter and the net. The
   engine API mirrors the others so makeArcade and the flow code
   never learn which engine they are holding. */
function StackEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var cols = cfg.cols || 8, rows = cfg.rows || 12;
  var cell = Math.floor(Math.min((W - 120) / cols, (H - 140) / rows));
  var fieldW = cell * cols, fieldH = cell * rows;
  var originX = Math.floor((W - fieldW) / 2);
  var originY = 96;

  function emptyGrid(){
    var g = [];
    for (var r = 0; r < rows; r++){ g.push([]); for (var c = 0; c < cols; c++) g[r].push(null); }
    return g;
  }

  var E = {
    kind: "stack",
    cfg: cfg, W: W, H: H,
    cols: cols, rows: rows, cell: cell,
    originX: originX, originY: originY, fieldW: fieldW, fieldH: fieldH,
    grid: emptyGrid(),
    active: null,
    wave: 0, spawned: 0, spawnTimer: 600, pieceSeq: 0,
    moveTimer: 0,
    fx: [],
    input: { left: false, right: false },
    elapsed: 0,
    hits: 0, damagePts: 0, rushShipped: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }

  function addFx(text, col, row, bad){
    E.fx.push({ text: text, x: originX + col * cell + cell / 2, y: originY + row * cell, t: 900, bad: !!bad });
  }

  var GOODS = ["steel", "grain", "fuel"];

  function spawnPiece(){
    var wc = waveCfg();
    E.pieceSeq++;
    var rush = wc.rushEvery > 0 && (E.pieceSeq % wc.rushEvery === 0);
    var type = rush ? "rush" : GOODS[Math.floor(rng() * GOODS.length)];
    E.active = {
      col: Math.floor(cols / 2),
      y: originY - cell,
      type: type,
      rush: rush,
      fall: wc.fall * (rush ? 1.6 : 1)
    };
    E.spawned++;
  }

  function landingRow(col){
    for (var r = rows - 1; r >= 0; r--){ if (!E.grid[r][col]) return r; }
    return -1; // column full
  }

  function clearRows(lockCol, lockRow){
    var cleared = 0;
    for (var r = rows - 1; r >= 0; r--){
      var full = true;
      for (var c = 0; c < cols; c++){ if (!E.grid[r][c]){ full = false; break; } }
      if (full){
        E.grid.splice(r, 1);
        var nr = []; for (var c2 = 0; c2 < cols; c2++) nr.push(null);
        E.grid.unshift(nr);
        cleared++;
        r++; // recheck the row that shifted down into this slot
      }
    }
    if (cleared > 0){
      for (var k = 0; k < cleared; k++){
        E.hits++;
        E.damagePts += cfg.hitPts;
        E.combo++;
        if (E.combo > E.bestCombo) E.bestCombo = E.combo;
        if (E.combo % cfg.comboEvery === 0){ E.comboPts += cfg.comboBonus; }
      }
      var label = cleared > 1 ? ("QUOTA x" + cleared + " +" + (cfg.hitPts * cleared)) : ("SHIPPED +" + cfg.hitPts);
      addFx(label, lockCol, lockRow, false);
    }
  }

  function jam(col){
    E.playerHits++;
    E.combo = 0;
    // spill: clear the top occupied cells of the offending column so play continues
    for (var r = 0; r < rows; r++){ if (E.grid[r][col]){ E.grid[r][col] = null; break; } }
    addFx((cfg.lines && cfg.lines.jam) || "JAMMED", col, 0, true);
  }

  function lockActive(){
    var a = E.active; if (!a) return;
    var lr = landingRow(a.col);
    if (lr < 0){ jam(a.col); E.active = null; return; }
    E.grid[lr][a.col] = { type: a.type };
    if (a.rush){ E.rushShipped++; E.damagePts += cfg.rushBonus || 0; addFx("RUSH +" + (cfg.rushBonus || 0), a.col, lr, false); }
    var lockCol = a.col;
    E.active = null;
    clearRows(lockCol, lr);
    // a stack that reaches the ceiling row anywhere is a jam too
    for (var c = 0; c < cols; c++){ if (E.grid[0][c]){ jam(c); } }
  }

  // FIRE is the hard drop: slam the crate home now
  E.fire = function(){
    if (E.over || !E.active) return false;
    lockActive();
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();

    // steering: repeat move on a short cooldown while held
    if (E.moveTimer > 0) E.moveTimer -= dt;
    if (E.active && E.moveTimer <= 0){
      if (E.input.left && !E.input.right){ E.active.col = Math.max(0, E.active.col - 1); E.moveTimer = 110; }
      else if (E.input.right && !E.input.left){ E.active.col = Math.min(cols - 1, E.active.col + 1); E.moveTimer = 110; }
    }

    // bring the next crate down
    if (!E.active){
      if (E.spawned < wc.count){
        E.spawnTimer -= dt;
        if (E.spawnTimer <= 0){ spawnPiece(); E.spawnTimer = wc.spawnGap; }
      }
    } else {
      var a = E.active;
      a.y += a.fall * s;
      var lr = landingRow(a.col);
      var landY = lr < 0 ? originY - cell : originY + lr * cell;
      if (lr < 0){ // column already full: locking here jams
        if (a.y >= originY){ lockActive(); }
      } else if (a.y >= landY){
        a.y = landY; lockActive();
      }
    }

    // feedback decays
    for (var ff = E.fx.length - 1; ff >= 0; ff--){
      E.fx[ff].t -= dt; E.fx[ff].y -= 18 * s;
      if (E.fx[ff].t <= 0) E.fx.splice(ff, 1);
    }

    // wave / run progression: wave ends when its crates are spent and none is falling
    if (E.spawned >= wc.count && !E.active){
      if (E.wave < cfg.waves.length - 1){
        E.wave++; E.spawned = 0; E.spawnTimer = 700; E.pieceSeq = 0;
        addFx("PLAN YEAR " + (E.wave + 1), Math.floor(cols / 2), Math.floor(rows / 2), false);
      } else {
        E.over = true;
      }
    }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0) ? cfg.noHitBonus : 0;
    var speed = E.over
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts,
      comboPts: E.comboPts,
      bestCombo: E.bestCombo,
      noHit: noHit,
      speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* =====================================================
   THE JOUST. The Chapter 1 (Feudalism) arcade, and the
   fifth distinct cabinet: a new timing and charge engine.
   The player rides the lists against a line of opponents.
   Each tilt is a single pass. A CHARGE builds as the two
   knights close, a STRIKE WINDOW opens near the moment of
   impact, and the lance must be aimed to the opponent's
   exposed mark. Commit inside the window with the right
   aim and you unhorse him. Commit early and the blow only
   glances. Lean in too long, or fail to commit at all, and
   his lance takes you. The player verb is PROVE.

   Pure state, seedable rng, time stepped, so it runs
   headless in jsdom exactly like the shooter, the net, the
   stacker, and the crosser. The engine API mirrors the
   others so makeArcade and the flow code never learn which
   cabinet they are holding.
   ===================================================== */
function JoustEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var lanes = cfg.lanes || 3;
  var E = {
    kind: "joust",
    cfg: cfg, W: W, H: H, lanes: lanes,
    round: 0,                       // which opponent, 0 based
    phase: "ready",                 // ready -> approach -> resolve -> next or over
    phaseT: 0,                      // ms in the current phase
    passT: 0,                       // ms into the approach
    charge: 0,                      // 0..1, the gallop charge
    aimLane: Math.floor(lanes / 2), // the player's lance height
    targetLane: 0,                  // the opponent's exposed mark this pass
    shifted: false,                 // has the mark moved this pass
    fired: false,                   // has the player committed this pass
    lastOutcome: null,              // clean | solid | early | wrong | late | counter
    input: { left: false, right: false, up: false, down: false },
    _pu: false, _pd: false,         // previous up and down, for edge detection
    elapsed: 0,
    hits: 0, damagePts: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    fx: [],
    over: false, banked: false, won: false
  };

  function roundCfg(){ return cfg.rounds[E.round]; }

  function addFx(text, big, bad){ E.fx.push({ text: text, t: 1100, big: !!big, bad: !!bad }); }

  function beginPass(){
    var rc = roundCfg();
    E.phase = "approach";
    E.phaseT = 0; E.passT = 0; E.charge = 0;
    E.fired = false; E.shifted = false; E.lastOutcome = null;
    E.targetLane = Math.floor(rng() * lanes);
    addFx(rc.name, true, false);
  }

  function resolvePass(outcome, pts){
    E.lastOutcome = outcome;
    E.phase = "resolve"; E.phaseT = 0;
    if (outcome === "clean" || outcome === "solid"){
      E.hits++; E.damagePts += pts; E.combo++;
      if (E.combo > E.bestCombo) E.bestCombo = E.combo;
      var line = (outcome === "clean" ? "UNHORSED  +" : "STRUCK  +") + pts;
      if (E.combo % cfg.comboEvery === 0){ E.comboPts += cfg.comboBonus; line = "TILT STREAK x" + E.combo + "  +" + cfg.comboBonus; }
      addFx(line, outcome === "clean", false);
    } else if (outcome === "early"){
      E.combo = 0; addFx("TOO EARLY, THE LANCE GLANCED", false, true);
    } else if (outcome === "wrong"){
      E.combo = 0; addFx("WRONG MARK, OFF THE ARMOR", false, true);
    } else if (outcome === "late"){
      E.combo = 0; E.playerHits++; addFx("HE CAUGHT YOU LEANING", false, true);
    } else { // counter, no commit in time
      E.combo = 0; E.playerHits++; addFx("TOO CAUTIOUS, HE STRUCK FIRST", false, true);
    }
  }

  E.fire = function(){
    if (E.over) return false;
    if (E.phase !== "approach" || E.fired) return false;
    E.fired = true;
    var rc = roundCfg();
    var f = E.passT / rc.approachMs;          // fraction through the approach
    var aimOk = (E.aimLane === E.targetLane);
    if (f < rc.winStart){ resolvePass("early", 0); return true; }
    if (f > rc.winEnd){ resolvePass("late", 0); return true; }
    if (!aimOk){ resolvePass("wrong", 0); return true; }
    // striking deeper in the window carries more of the charge
    var chargeMult = 0.7 + 0.3 * Math.min(1, f / rc.winEnd);
    var center = (rc.winStart + rc.winEnd) / 2;
    if (Math.abs(f - center) <= rc.cleanBand) resolvePass("clean", Math.round(cfg.cleanPts * chargeMult));
    else resolvePass("solid", Math.round(cfg.solidPts * chargeMult));
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    E.phaseT += dt;

    // lance aim: discrete steps on the rising edge of up and down
    if (E.input.up && !E._pu) E.aimLane = Math.max(0, E.aimLane - 1);
    if (E.input.down && !E._pd) E.aimLane = Math.min(lanes - 1, E.aimLane + 1);
    E._pu = E.input.up; E._pd = E.input.down;

    // floating feedback decays
    for (var i = E.fx.length - 1; i >= 0; i--){ E.fx[i].t -= dt; if (E.fx[i].t <= 0) E.fx.splice(i, 1); }

    if (E.phase === "ready"){
      if (E.phaseT >= (cfg.readyMs || 600)) beginPass();
      return;
    }

    if (E.phase === "approach"){
      var rc = roundCfg();
      E.passT += dt;
      E.charge = Math.min(1, E.passT / rc.approachMs);
      // on the harder rounds the exposed mark shifts once, partway through
      if (rc.shift && !E.shifted && E.passT >= rc.approachMs * 0.5){
        E.shifted = true;
        var nl = Math.floor(rng() * lanes);
        if (nl === E.targetLane) nl = (nl + 1) % lanes;
        E.targetLane = nl;
      }
      // the moment of impact: failed to commit in time
      if (!E.fired && E.passT >= rc.approachMs) resolvePass("counter", 0);
      return;
    }

    if (E.phase === "resolve"){
      if (E.phaseT < (cfg.resolveMs || 850)) return;
      if (E.playerHits >= cfg.unhorseAt){ E.over = true; E.won = false; return; }
      if (E.round >= cfg.rounds.length - 1){ E.over = true; E.won = true; return; }
      E.round++; E.phase = "ready"; E.phaseT = 0;
      return;
    }
  };

  E.score = function(){
    var noHit = (E.playerHits === 0 && E.won) ? cfg.noHitBonus : 0;
    var speed = (E.over && E.won)
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts,
      comboPts: E.comboPts,
      bestCombo: E.bestCombo,
      noHit: noHit,
      speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* ---------- THE JOUST renderer: the tourney field ---------- */
var JOUST_LANE_NAMES = ["THE HELM", "THE SHIELD", "THE SADDLE"];
function renderJoust(){
  var E = arcade;
  var rc = E.cfg.rounds[E.round];

  // the field: turf below a dusk sky, heraldic and earthy
  var sky = ctx.createLinearGradient(0, 0, 0, VIEW_H);
  sky.addColorStop(0, "#23303f"); sky.addColorStop(0.55, "#2f2336"); sky.addColorStop(1, "#3a2a1c");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  var turfY = VIEW_H - 150;
  ctx.fillStyle = "#3f5a31"; ctx.fillRect(0, turfY, VIEW_W, VIEW_H - turfY);
  ctx.fillStyle = "#395229";
  for (var tg = 0; tg < VIEW_W; tg += 26) ctx.fillRect(tg, turfY, 13, VIEW_H - turfY);

  // banners along the top
  for (var bn = 20; bn < VIEW_W - 20; bn += 70){
    var hue = (Math.floor(bn / 70) % 2 === 0) ? "#9a2f2a" : "#c9a23a";
    ctx.fillStyle = "#2a2018"; ctx.fillRect(bn, 8, 3, 30);
    ctx.fillStyle = hue; ctx.beginPath();
    ctx.moveTo(bn + 3, 12); ctx.lineTo(bn + 24, 12); ctx.lineTo(bn + 24, 30); ctx.lineTo(bn + 13, 24); ctx.lineTo(bn + 3, 30);
    ctx.closePath(); ctx.fill();
  }

  // the tilt barrier down the centre of the lists
  var railY = turfY + 44;
  ctx.fillStyle = "#6e5430"; ctx.fillRect(0, railY, VIEW_W, 12);
  ctx.fillStyle = "#4f3c22";
  for (var rp = 16; rp < VIEW_W; rp += 80) ctx.fillRect(rp, railY - 18, 8, 30);

  // the two riders close as the charge builds
  var prog = (E.phase === "approach") ? E.charge : (E.phase === "resolve" ? 1 : 0);
  var px = 60 + prog * (VIEW_W / 2 - 120);
  var ox = VIEW_W - 60 - prog * (VIEW_W / 2 - 120);
  var riderY = railY - 16;

  // opponent (right), facing left, the exposed mark lit
  drawJoustRider(ox, riderY, -1, "#3a2f3a", "#6a5a6a", E.targetLane);
  // player (left), facing right, the mounted knight in red and gold
  drawJoustRider(px, riderY, 1, "#9a2f2a", "#c9a23a", -1);
  // the player's couched lance points at the chosen lane
  drawAimLance(px, riderY, E.aimLane, E.lanes);

  // the timing strip along the bottom: the window band and the closing marker
  var stripX = 70, stripW = VIEW_W - 140, stripY = VIEW_H - 30;
  ctx.fillStyle = "#1c1410"; ctx.fillRect(stripX, stripY, stripW, 12);
  ctx.fillStyle = "rgba(201,162,58,.35)";
  ctx.fillRect(stripX + rc.winStart * stripW, stripY, (rc.winEnd - rc.winStart) * stripW, 12);
  var cF = (rc.winStart + rc.winEnd) / 2;
  ctx.fillStyle = "rgba(232,176,75,.85)";
  ctx.fillRect(stripX + (cF - rc.cleanBand) * stripW, stripY, rc.cleanBand * 2 * stripW, 12);
  if (E.phase === "approach"){
    var mF = Math.min(1, E.passT / rc.approachMs);
    ctx.fillStyle = "#f2e8d5"; ctx.fillRect(stripX + mF * stripW - 1, stripY - 4, 3, 20);
  }
  ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign = "center"; ctx.fillStyle = "#a89a86";
  ctx.fillText("TIME THE STRIKE", VIEW_W / 2, stripY - 8);

  // the aim ladder on the right: opponent mark lit, player caret
  var ladderX = VIEW_W - 30, top = 70, gap = 30;
  for (var L = 0; L < E.lanes; L++){
    var ly = top + L * gap;
    ctx.fillStyle = (L === E.targetLane && E.phase === "approach") ? "#e2554d" : "#4a3f37";
    ctx.fillRect(ladderX - 8, ly, 16, 16);
    if (L === E.aimLane){ ctx.fillStyle = "#c9a23a"; ctx.fillText("<", ladderX - 16, ly + 12); }
  }
  ctx.textAlign = "right"; ctx.font = "6px 'Press Start 2P', monospace"; ctx.fillStyle = "#9a8f78";
  if (E.lanes === 3) for (var Ln = 0; Ln < 3; Ln++) ctx.fillText(JOUST_LANE_NAMES[Ln], ladderX - 22, top + Ln * gap + 11);

  // live HUD: score, streak, the opponent, lances left
  var live = E.damagePts + E.comboPts;
  ctx.textAlign = "left"; ctx.font = "8px 'Press Start 2P', monospace";
  ctx.fillStyle = "#e6d8b8"; ctx.fillText("SCORE " + live, 12, 18);
  ctx.fillStyle = (E.combo >= E.cfg.comboEvery) ? "#e8b04b" : "#c9a23a";
  ctx.fillText("STREAK x" + E.combo, 12, 34);
  ctx.textAlign = "center"; ctx.fillStyle = "#e6d8b8";
  ctx.fillText("TILT " + (E.round + 1) + " OF " + E.cfg.rounds.length, VIEW_W / 2, 18);
  ctx.fillStyle = "#cdbfa6"; ctx.fillText(rc.name, VIEW_W / 2, 34);
  // lances remaining before you are unhorsed
  var left = Math.max(0, E.cfg.unhorseAt - E.playerHits);
  ctx.textAlign = "right";
  for (var hl = 0; hl < E.cfg.unhorseAt; hl++){
    ctx.fillStyle = hl < left ? "#e2554d" : "#3a2f2a";
    ctx.fillRect(VIEW_W - 14 - hl * 12, 12, 8, 8);
  }

  // the charge meter
  ctx.fillStyle = "#1c1410"; ctx.fillRect(12, VIEW_H - 30, 44, 12);
  ctx.fillStyle = "#c9a23a"; ctx.fillRect(12, VIEW_H - 30, 44 * E.charge, 12);
  ctx.fillStyle = "#a89a86"; ctx.font = "6px 'Press Start 2P', monospace"; ctx.textAlign = "left";
  ctx.fillText("CHARGE", 12, VIEW_H - 34);

  // floating feedback
  ctx.textAlign = "center";
  for (var f = 0; f < E.fx.length; f++){
    var fx = E.fx[f];
    ctx.globalAlpha = Math.max(0, Math.min(1, fx.t / 1100));
    ctx.font = (fx.big ? "12px" : "9px") + " 'Press Start 2P', monospace";
    ctx.fillStyle = fx.bad ? "#e2554d" : (fx.big ? "#e8b04b" : "#e6d8b8");
    ctx.fillText(fx.text, VIEW_W / 2, VIEW_H / 2 - 30);
  }
  ctx.globalAlpha = 1;

  // the closing word when the tourney ends
  if (E.over){
    ctx.fillStyle = "rgba(0,0,0,.55)"; ctx.fillRect(0, VIEW_H / 2 - 24, VIEW_W, 48);
    ctx.textAlign = "center"; ctx.font = "12px 'Press Start 2P', monospace";
    ctx.fillStyle = E.won ? "#e8b04b" : "#e2554d";
    ctx.fillText(E.won ? "CHAMPION OF THE LISTS" : "UNHORSED", VIEW_W / 2, VIEW_H / 2 + 4);
  }
}

function drawJoustRider(x, y, dir, body, trim, mark){
  // horse
  ctx.fillStyle = "#3a2a1c"; ctx.fillRect(x - 18, y + 6, 36, 16);
  ctx.fillRect(x + dir * 16, y + 2, 8, 10);            // head
  ctx.fillStyle = "#2a1d12";
  ctx.fillRect(x - 14, y + 20, 4, 12); ctx.fillRect(x + 8, y + 20, 4, 12); // legs
  // caparison in the rider's colors
  ctx.fillStyle = body; ctx.fillRect(x - 16, y + 10, 32, 10);
  // rider
  ctx.fillStyle = body; ctx.fillRect(x - 6, y - 12, 12, 16);
  ctx.fillStyle = trim; ctx.fillRect(x - 6, y - 4, 12, 3);
  ctx.fillStyle = "#cabf9f"; ctx.fillRect(x - 4, y - 18, 8, 8);  // helm
  ctx.fillStyle = trim; ctx.fillRect(x - 4, y - 20, 8, 2);       // crest
  if (mark >= 0){
    // a faint glow on the exposed mark height
    ctx.fillStyle = "rgba(226,85,73,.5)";
    var my = (mark === 0) ? y - 16 : (mark === 1 ? y - 4 : y + 12);
    ctx.fillRect(x - 9, my, 18, 4);
  }
}

function drawAimLance(x, y, lane, lanes){
  var ly = (lane === 0) ? y - 16 : (lane === 1 ? y - 4 : y + 10);
  ctx.strokeStyle = "#d9c7a8"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + 6, y - 2); ctx.lineTo(x + 54, ly); ctx.stroke();
  ctx.fillStyle = "#9a2f2a"; ctx.fillRect(x + 50, ly - 2, 6, 4);
  ctx.lineWidth = 1;
}


function makeArcade(cfg){
  if (cfg.engine === "catch") return CatchEngine(cfg);
  if (cfg.engine === "stack") return StackEngine(cfg);
  if (cfg.engine === "joust") return JoustEngine(cfg);
  if (cfg.engine === "sea") return SeaEngine(cfg);
  if (cfg.engine === "lander") return LanderEngine(cfg);
  return ArcadeEngine(cfg);
}

var arcadeInner = document.getElementById("arcade-inner");
var elHud = document.getElementById("hud");
var arcade = null;

function arcadeUnlocked(){
  // the charter path sets both. The collapse path sets chapterDone alone.
  return G.chapterDone && G.deskPassed;
}

function openArcade(){
  if (!arcadeUnlocked()) return;
  panelComplete.classList.remove("open");
  panelArcade.classList.add("open");
  G.scene = "ARCADE_MENU";
  renderArcadeIntro();
}

function renderArcadeIntro(){
  arcadeInner.innerHTML = "";
  var room = el("div", "arcade-room");
  room.appendChild(el("div", "place", ARCADE_CFG.title));
  room.appendChild(el("div", "beatno", CUR.name.split(":")[0] + " ARCADE \u2022 THE BONUS ROUND"));
  room.appendChild(el("div", "speech", ARCADE_CFG.intro));
  room.appendChild(el("div", "rules", ARCADE_CFG.rulesHtml ||
    ("<b>" + ARCADE_CFG.hitVerb + "</b> +" + ARCADE_CFG.hitPts + " per blow<br>"
    + "<b>STREAK OF " + ARCADE_CFG.comboEvery + "</b> +" + ARCADE_CFG.comboBonus + " each time, dodge everything to keep it alive<br>"
    + "<b>CLEAN SHEET</b> +" + ARCADE_CFG.noHitBonus + " if nothing touches you and nothing gets through<br>"
    + "<b>THE CLOCK</b> up to +" + ARCADE_CFG.speedCap + " for finishing fast<br>"
    + "MOVE: LEFT and RIGHT \u2022 FIRE: SPACE or A")));
  var go = el("button", "btn tick", ARCADE_CFG.startLabel);
  go.addEventListener("click", startArcade);
  room.appendChild(go);
  var back = el("button", "btn ghost", "BACK TO THE CHARTER");
  back.addEventListener("click", function(){
    panelArcade.classList.remove("open");

    G.scene = "COMPLETE";
  });

}

function startArcade(){
  briefingButtonVisible(false);
  arcade = makeArcade(ARCADE_CFG);
  panelArcade.classList.remove("open");
  arcadeInner.innerHTML = "";
  if (elHud) elHud.style.display = "none";
  G.keys = {};
  G.scene = "ARCADE";
}

function arcadeUpdate(dt){
  if (!arcade) return;
  arcade.input.left = !!G.keys.left;
  arcade.input.right = !!G.keys.right;
  arcade.input.up = !!G.keys.up;
  arcade.input.down = !!G.keys.down;
  arcade.update(dt);
  if (arcade.over && !arcade.banked){
    arcade.banked = true;
    var s = arcade.score();
    G.lifetime += s.total;
    Store.set("mf_lifetime", G.lifetime);
    recordArcadeBest(s.total);
    if (elHud) elHud.style.display = "";
    refreshHUD();
    renderArcadeSummary(s);
  }
}

function renderArcadeSummary(s){
  G.scene = "ARCADE_MENU";
  panelArcade.classList.add("open");
  arcadeInner.innerHTML = "";
  var room = el("div", "arcade-room");
  room.appendChild(el("div", "place", ARCADE_CFG.endTitle));

    var tr = el("tr", cls || "");
    tr.appendChild(el("td", "", label));
    tr.appendChild(el("td", "", String(val)));
    tbl.appendChild(tr);
  }
  row(ARCADE_CFG.sumLabel || "Damage dealt", arcade.hits + " " + (ARCADE_CFG.sumUnit || "hits") + "  (+" + s.damage + ")");
  row("Best streak", "x" + s.bestCombo + "  (+" + s.comboPts + ")");
  row("Clean sheet", s.noHit ? "+" + s.noHit : "spoiled (" + arcade.playerHits + " " + (ARCADE_CFG.spoilUnit || "taken") + ")");
  row("Speed bonus", "+" + s.speed + "  (" + Math.round(arcade.elapsed/1000) + "s, par " + ARCADE_CFG.par + ")");
  row("ARCADE TOTAL", "+" + s.total, "total");
  room.appendChild(tbl);

    "BANKED TO LIFETIME: " + G.lifetime + (Store.usingMemory() ? "<br>(saved for this session)" : "<br>(saved on this device)")));

  room.appendChild(again);

    onward.addEventListener("click", goNextChapter);

    closeArcade();
    resetRun();
  });

  var all = el("button", "btn ghost", "ALL CHAPTERS");
  all.addEventListener("click", backToChapterSelect);
  room.appendChild(all);
  arcadeInner.appendChild(room);
}

}

/* =====================================================
   FREE PLAY v1. Milestone 5.
   The interactive playing tool per Section 3: the same
   Decision Desk variables run as a continuous tick based
   loop with the policy levers exposed and no win condition.
   Deliberately a thin layer over DeskEngine, never a second
   simulation: every tick is fed through a synthetic one
   option beat so the engine's own clamps and collapse
   checks do all the work. Free Play banks nothing in v1,
   per the parking lot, and says so on screen.
   ===================================================== */

var CH1_FREEPLAY = {
  chapter: "CHAPTER 1: CAPITALISM",
  tickMs: 1600,

  banksNote: "FREE PLAY BANKS NOTHING. THE SANDBOX IS THE REWARD.",
  drift: { prosperity: 1, equality: -1, stability: -1 },
  shockEvery: { min: 7, max: 13 },
  levers: [
    { id: "rate", name: "INTEREST RATE", start: 1, positions: [
      { t: "CHEAP MONEY", fx: { prosperity: 2, stability: -2, equality: -1 } },
      { t: "NEUTRAL",     fx: {} },
      { t: "TIGHT MONEY", fx: { prosperity: -2, stability: 2 } }

function FreePlayEngine(cfg){
  // the inner DeskEngine owns the needles, the clamps, and the collapse check
  var inner = DeskEngine({
    beats: [ { id: "tick", options: [ { fx: {}, fit: 0, why: "" } ] } ],
    collapseLines: cfg.collapseLines
  });
  var F = {
    cfg: cfg,
    inner: inner,
    needles: inner.needles,
    levers: cfg.levers.map(function(l){ return l.start; }),
    quarter: 0,
    acc: 0,
    paused: false,
    over: false,
    collapsed: null,
    lastDeltas: null,
    lastShock: null,
    shockCount: 0,
    nextShockIn: 0
  };
  function rollShockGap(){
    var span = cfg.shockEvery.max - cfg.shockEvery.min + 1;
    F.nextShockIn = cfg.shockEvery.min + Math.floor(rng() * span);
  }
  rollShockGap();

  F.setLever = function(li, pos){
    if (F.over) return false;
    if (!cfg.levers[li] || !cfg.levers[li].positions[pos]) return false;
    F.levers[li] = pos;
    return true;
  };

  F.tickFx = function(){
    var fx = {};
    NEEDLE_DEFS.forEach(function(n){ fx[n.id] = cfg.drift[n.id] || 0; });
    cfg.levers.forEach(function(l, i){
      var p = l.positions[F.levers[i]].fx;
      NEEDLE_DEFS.forEach(function(n){ fx[n.id] += p[n.id] || 0; });
    });
    return fx;
  };

  F.step = function(){
    if (F.over) return null;
    var fx = F.tickFx();
    var shock = null;
    F.nextShockIn--;
    if (F.nextShockIn <= 0){
      shock = cfg.shocks[Math.floor(rng() * cfg.shocks.length)];
      NEEDLE_DEFS.forEach(function(n){ fx[n.id] = (fx[n.id] || 0) + (shock.fx[n.id] || 0); });
      F.shockCount++;
      rollShockGap();
    }
    inner.cfg.beats[0].options[0].fx = fx;
    var res = inner.choose(0);
    inner.beat = 0;                       // stay on the synthetic beat forever
    if (!inner.collapsed) inner.done = false;
    F.quarter++;
    F.lastDeltas = res.deltas;
    F.lastShock = shock;
    if (inner.collapsed){ F.over = true; F.collapsed = inner.collapsed; }
    return res;
  };

  F.update = function(dt){
    if (F.paused || F.over) return false;
    F.acc += dt;
    var stepped = false;
    while (F.acc >= cfg.tickMs && !F.over){
      F.acc -= cfg.tickMs;
      F.step();
      stepped = true;
    }
    return stepped;
  };

  return F;
}

var panelFree = document.getElementById("panel-free");
var freeInner = document.getElementById("free-inner");
var free = null;
var freeFrom = "TITLE";   // the scene to return to on exit
var freeEls = null;       // live element refs for cheap per tick updates

function openFreePlay(chId){
  if (typeof chId !== "string" || !CHAPTERS[chId]) chId = CHAPTER_ID;
  if (!freeUnlocked(chId)) return;
  if (!CHAPTERS[chId].freeplay) return;
  freeFrom = (G.scene === "COMPLETE" || G.scene === "ARCADE_MENU") ? G.scene : "TITLE";
  panelTitle.classList.remove("open");
  panelComplete.classList.remove("open");
  panelArcade.classList.remove("open");
  free = FreePlayEngine(CHAPTERS[chId].freeplay);
  G.scene = "FREEPLAY";
  panelFree.classList.add("open");
  renderFreeRoom(true);
}

function closeFreePlay(){
  panelFree.classList.remove("open");
  freeInner.innerHTML = "";
  free = null;
  freeEls = null;
  if (freeFrom === "COMPLETE"){ panelComplete.classList.add("open"); G.scene = "COMPLETE"; }
  else if (freeFrom === "ARCADE_MENU"){ panelArcade.classList.add("open"); G.scene = "ARCADE_MENU"; }
  else { panelTitle.classList.add("open"); G.scene = "TITLE"; refreshTitle(); }
}

function renderFreeRoom(showIntro){
  freeInner.innerHTML = "";
  freeEls = { gauges: {}, deltas: {} };
  var room = el("div", "free-room");
  room.appendChild(el("div", "place", "FREE PLAY: THE OPEN CHAIR"));
  freeEls.quarter = el("div", "beatno", "QUARTER 0");
  room.appendChild(freeEls.quarter);

  // live gauges, updated in place each tick
  var wrap = el("div", "gauges");
  NEEDLE_DEFS.forEach(function(n){
    var g = el("div", "gauge");
    g.appendChild(el("div", "g-name", needleLabel(n)));
    var bar = el("div", "g-bar");
    var fill = el("div", "g-fill");
    fill.style.width = free.needles[n.id] + "%";
    fill.style.background = n.color;
    bar.appendChild(fill);
    g.appendChild(bar);
    var val = el("div", "g-val", String(free.needles[n.id]));
    val.style.color = n.color;
    g.appendChild(val);
    var chip = el("div", "g-delta", "");
    g.appendChild(chip);
    wrap.appendChild(g);
    freeEls.gauges[n.id] = { g: g, fill: fill, val: val, chip: chip };
  });
  room.appendChild(wrap);

  if (showIntro) room.appendChild(el("div", "speech", free.cfg.intro));
  freeEls.event = el("div", "free-event", "The board is live. The first quarter is already ticking.");
  room.appendChild(freeEls.event);

  // levers
  free.cfg.levers.forEach(function(l, li){
    var lev = el("div", "lever");
    lev.appendChild(el("div", "l-name", l.name));
    var row = el("div", "l-row");
    l.positions.forEach(function(p, pi){
      var b = el("button", "l-btn" + (free.levers[li] === pi ? " on" : ""), p.t);
      b.addEventListener("click", function(){
        if (free.setLever(li, pi)){
          row.querySelectorAll(".l-btn").forEach(function(x){ x.classList.remove("on"); });
          b.classList.add("on");
        }
      });
      row.appendChild(b);
    });
    lev.appendChild(row);
    room.appendChild(lev);
  });

  room.appendChild(el("div", "free-note", free.cfg.banksNote));

  var bar = el("div", "free-bar");
  freeEls.pause = el("button", "btn ghost", "PAUSE");
  freeEls.pause.addEventListener("click", function(){
    free.paused = !free.paused;
    freeEls.pause.textContent = free.paused ? "RESUME" : "PAUSE";
  });
  bar.appendChild(freeEls.pause);
  var exit = el("button", "btn ghost", "LEAVE THE CHAIR");
  exit.addEventListener("click", closeFreePlay);
  bar.appendChild(exit);
  room.appendChild(bar);

  freeInner.appendChild(room);
}

function refreshFreeRoom(){
  if (!free || !freeEls) return;
  freeEls.quarter.textContent = "QUARTER " + free.quarter
    + (free.shockCount ? "  \u2022  SHOCKS SURVIVED: " + free.shockCount : "");
  NEEDLE_DEFS.forEach(function(n){
    var v = free.needles[n.id];
    var e = freeEls.gauges[n.id];
    e.fill.style.width = v + "%";
    e.val.textContent = String(v);
    e.g.classList.toggle("low", v <= 15);
    var d = free.lastDeltas ? (free.lastDeltas[n.id] || 0) : 0;
    e.chip.textContent = d > 0 ? "\u25B2" + d : d < 0 ? "\u25BC" + (-d) : "";
    e.chip.className = "g-delta" + (d > 0 ? " up" : d < 0 ? " down" : "");
  });
  if (free.lastShock){
    freeEls.event.textContent = free.lastShock.line;
    freeEls.event.className = "free-event shock";
  } else if (free.quarter > 0){
    freeEls.event.textContent = "Quarter " + free.quarter + " closes. The levers hold until you move them.";
    freeEls.event.className = "free-event";
  }
}

function renderFreeCollapse(){
  freeInner.innerHTML = "";
  freeEls = null;
  var room = el("div", "free-room collapsed");
  room.appendChild(el("div", "place", free.cfg.collapseTitle));
  room.appendChild(el("div", "beatno", "THE " + free.collapsed.toUpperCase() + " NEEDLE HIT ZERO  \u2022  QUARTER " + free.quarter));
  room.appendChild(buildGauges(null, free.needles));
  room.appendChild(el("div", "collapse-line", free.cfg.collapseLines[free.collapsed]));
  room.appendChild(el("div", "speech",
    "The town held for " + free.quarter + " quarters and rode out " + free.shockCount
    + (free.shockCount === 1 ? " shock" : " shocks")
    + ". No points change hands in the sandbox. The chair is open again whenever you want it."));
  var again = el("button", "btn tick", "TAKE IT AGAIN");
  again.addEventListener("click", function(){
    free = FreePlayEngine(free.cfg);
    renderFreeRoom(false);
  });
  room.appendChild(again);
  var exit = el("button", "btn ghost", "LEAVE THE CHAIR");
  exit.addEventListener("click", closeFreePlay);
  room.appendChild(exit);
  freeInner.appendChild(room);
}

function freeUpdate(dt){
  if (!free) return;
  if (free.over) return;
  var stepped = free.update(dt);
  if (free.over){ renderFreeCollapse(); return; }
  if (stepped) refreshFreeRoom();
}

function ensureTitleAbout(){
  var inner = panelTitle.querySelector(".panel-inner");
  if (!inner || inner.querySelector(".title-about")) return;
  var about = el("div", "title-about",
    "Walk seven economic worlds, study the thinkers who argued for and against each one, then run it yourself at the Decision Desk while four needles answer back. The game takes no side.");
  var btn = el("button", "btn ghost", "ABOUT THE GAME");
  btn.addEventListener("click", function(){
    playGameIntro({ onDone: function(){ panelTitle.classList.add("open"); G.scene = "TITLE"; refreshTitle(); } });
  });
  var anchor = inner.querySelector("#title-progress");
  if (anchor){
    inner.insertBefore(about, anchor.nextSibling);
    inner.insertBefore(btn, about.nextSibling);
  } else {
    inner.appendChild(about); inner.appendChild(btn);
  }

function refreshTitle(){
  var prog = document.getElementById("title-progress");
  var list = document.getElementById("chapter-list");
  if (!prog || !list) return;
  ensureTitleAbout();
  if (G.lifetime > 0){
    prog.style.display = "";
    prog.innerHTML = "LIFETIME: " + G.lifetime;
  } else {
    prog.style.display = "none";
  }
  list.innerHTML = "";
  CHAPTER_ORDER.forEach(function(id){
    var ch = CHAPTERS[id];
    if (!ch) return;
    var p = Progress[id];
    var open = chapterUnlocked(id);
    var card = el("div", "ch-card" + (open ? "" : " locked"));
    card.appendChild(el("div", "ch-name", ch.name));
    card.appendChild(el("div", "ch-sub", ch.titleSub));
    var status = "";
    if (!open){
      status = "LOCKED. CLEAR " + CHAPTERS[ch.unlock].name.split(":")[0] + " TO OPEN.";
    } else if (p.cleared){
      status = '<span class="clr">CLEARED' + (p.clears > 1 ? " x" + p.clears : "") + "</span>"
        + "  \u2022  BEST DESK +" + p.bestDesk
        + (p.bestArcade ? "  \u2022  BEST ARCADE +" + p.bestArcade : "");
    } else {
      status = "OPEN. THE WALK IS WAITING.";
    }
    card.appendChild(el("div", "ch-status", status));
    var row = el("div", "ch-row");
    if (open){
      var go = el("button", "btn", "START THE WALK");
      go.addEventListener("click", function(){ startChapter(id); });

    if (p.cleared && ch.freeplay){
      var fp = el("button", "btn ghost", "FREE PLAY");
      fp.addEventListener("click", function(){ openFreePlay(id); });
      row.appendChild(fp);
    }
    card.appendChild(row);
    list.appendChild(card);
  });

};

function briefingTheme(key){ return BRIEFING_THEMES[key] || BRIEFING_THEMES.intro; }

function buildAmbient(motif, count){
  var rise = (motif === "ember" || motif === "mote");
  var fall = (motif === "snow" || motif === "ticker");
  var html = "";
  for (var i=0;i<count;i++){
    var x = (Math.random()*100).toFixed(2);
    var y = rise ? (40 + Math.random()*60).toFixed(2)
          : fall ? (Math.random()*70).toFixed(2)
          : (Math.random()*100).toFixed(2);
    var delay = (Math.random()*5).toFixed(2);
    var dur = rise ? (4 + Math.random()*4).toFixed(2)
            : (motif === "ticker") ? (2.4 + Math.random()*2.6).toFixed(2)
            : fall ? (6 + Math.random()*4).toFixed(2)
            : (2.4 + Math.random()*1.6).toFixed(2);
    html += "<span class='bf-p bf-" + motif + "' style='left:" + x + "%;top:" + y
         + "%;animation-delay:" + delay + "s;animation-duration:" + dur + "s'></span>";
  }
  return html;
}

function buildCrawlBody(cfg){
  return ""
    + "<h4>THE THEORY</h4><p>" + cfg.theory + "</p>"
    + "<h4>WHERE IT RAN</h4><p>" + cfg.place + "</p>"
    + "<h4>WHO ARGUED IT</h4>"
    + "<p><span class='for'>FOR.</span> " + cfg.forWho + "</p>"
    + "<p><span class='against'>AGAINST.</span> " + cfg.againstWho + "</p>"
    + "<h4>THE PROMISE</h4><p>" + cfg.pro + "</p>"
    + "<h4>THE PRICE</h4><p>" + cfg.con + "</p>"
    + "<p class='bf-close'>" + cfg.close + "</p>";
}

/* ---------- The briefing engine ---------- */
var panelBriefing = document.getElementById("panel-briefing");
var briefing = null;          // { mode, chId, onDone }
var briefingCrawlEl = null;

function briefingButtonVisible(show){
  var b = document.getElementById("briefing-btn");
  if (b) b.style.display = show ? "block" : "none";
}

function renderBriefing(eyebrow, title, body, themeKey){
  var inner = panelBriefing.querySelector(".panel-inner");
  inner.innerHTML = "";

  var th = briefingTheme(themeKey);
  panelBriefing.style.setProperty("--bf-accent", th.accent);
  panelBriefing.style.setProperty("--bf-title", th.title);
  panelBriefing.style.setProperty("--bf-bg1", th.bg1);
  panelBriefing.style.setProperty("--bf-bg2", th.bg2);

  var sky = el("div", "bf-sky");
  sky.innerHTML = buildAmbient(th.motif, th.count);
  inner.appendChild(sky);

  inner.appendChild(el("div", "bf-fade top"));

  var stage = el("div", "bf-stage");
  var tilt = el("div", "bf-tilt");
  var crawl = el("div", "bf-crawl");
  crawl.innerHTML =
      "<div class='bf-eyebrow'>" + eyebrow + "</div>"
    + "<div class='bf-title'>" + title + "</div>"
    + "<div class='bf-body'>" + body + "</div>";
  tilt.appendChild(crawl);
  stage.appendChild(tilt);
  inner.appendChild(stage);
  briefingCrawlEl = crawl;

  inner.appendChild(el("div", "bf-hint", "SPACE or A to continue"));

  var controls = el("div", "bf-controls");
  var label = (briefing && briefing.mode === "review") ? "CLOSE" : "ENTER THE WALK";
  var go = el("button", "btn ghost", label);
  go.addEventListener("click", endBriefing);
  controls.appendChild(go);
  inner.appendChild(controls);

  // (re)start the scroll
  crawl.classList.remove("bf-scroll");
  void crawl.offsetWidth;       // reflow so the animation replays
  crawl.classList.add("bf-scroll");
  crawl.addEventListener("animationend", onCrawlEnd, { once: true });
}

function onCrawlEnd(){ endBriefing(); }

function playGameIntro(opts){
  opts = opts || {};
  briefing = { mode: "intro", chId: null, onDone: opts.onDone || function(){} };
  panelTitle.classList.remove("open");
  panelBriefing.classList.add("open");
  G.scene = "BRIEFING";
  briefingButtonVisible(false);
  renderBriefing(GAME_INTRO.eyebrow, GAME_INTRO.title, GAME_INTRO.body, "intro");
}

function playBriefing(chId, opts){
  opts = opts || {};
  var cr = CRAWLS[chId];
  if (!cr){ if (opts.onDone) opts.onDone(); return false; }
  var ch = CHAPTERS[chId];
  briefing = { mode: opts.review ? "review" : "chapter", chId: chId, onDone: opts.onDone || function(){} };
  panelTitle.classList.remove("open");
  panelBriefing.classList.add("open");
  G.scene = "BRIEFING";
  briefingButtonVisible(false);
  var eyebrow = cr.ep + "  \u2022  " + (ch ? ch.name : cr.title);
  renderBriefing(eyebrow, cr.title, buildCrawlBody(cr), chId);
  return true;
}

function endBriefing(){
  if (!briefing) return;
  var done = briefing.onDone;
  panelBriefing.classList.remove("open");
  var inner = panelBriefing.querySelector(".panel-inner");
  if (inner) inner.innerHTML = "";
  briefing = null;
  briefingCrawlEl = null;
  if (typeof done === "function") done();
}

function reviewBriefing(){
  var id = CHAPTER_ID;
  if (!CRAWLS[id]) return;
  var back = G.scene;
  playBriefing(id, { review: true, onDone: function(){
    G.scene = (back === "WALK") ? "WALK" : back;
    briefingButtonVisible(G.scene === "WALK");
    refreshHUD();
  }});
}


function startChapter(id){
  if (!CHAPTERS[id] || !chapterUnlocked(id)) return;
  selectChapter(id);
  // The briefing rolls first, then the walk begins.
  playBriefing(id, { onDone: function(){ beginWalk(id); } });
}

function beginWalk(id){
  sceneFlash();
  sceneHide();
  spawnCritters(id);
  resetRun();
  panelTitle.classList.remove("open");
  refreshHUD();
  toast(CUR.walkToast, 4200);
  briefingButtonVisible(true);
}

function startGame(){
  // SPACE on the title: the furthest open, uncleared chapter, else Chapter 1
  var pick = null;
  CHAPTER_ORDER.forEach(function(id){
    if (!pick && CHAPTERS[id] && chapterUnlocked(id) && !Progress[id].cleared) pick = id;
  });
  startChapter(pick || "ch1");
}

/* ---------- Update ---------- */
function tryMove(dx, dy){
  var p = G.player;
  var nx = p.x + dx, ny = p.y + dy;
  // AABB corners against solid tiles, with a small inset
  var pad = 4;
  var corners = [
    [nx+pad, ny+pad],[nx+p.w-pad, ny+pad],
    [nx+pad, ny+p.h-pad],[nx+p.w-pad, ny+p.h-pad]
  ];
  for (var i=0;i<corners.length;i++){
    var tx = Math.floor(corners[i][0]/TILE), ty = Math.floor(corners[i][1]/TILE);
    if (isSolid(tx,ty)) return false;
  }
  p.x = nx; p.y = ny;
  return true;
}

function update(dt){
  G.time += dt;
  if (G.scene==="ARCADE"){ arcadeUpdate(dt); return; }
  if (G.scene==="FREEPLAY"){ freeUpdate(dt); return; }
  if (G.scene!=="WALK") return;
  var p = G.player;
  var speed = p.speed * (G.time < G.slowUntil ? 0.5 : 1);
  var step = speed * dt/1000;
  var moved = false;
  if (G.keys.up)    { p.dir="up";    moved = tryMove(0,-step) || moved; }
  if (G.keys.down)  { p.dir="down";  moved = tryMove(0, step) || moved; }
  if (G.keys.left)  { p.dir="left";  moved = tryMove(-step,0) || moved; }
  if (G.keys.right) { p.dir="right"; moved = tryMove(step,0)  || moved; }
  if (moved) p.anim += dt; else p.anim = 0;

  updateHazards(dt);
  updateCritters(dt);
  if (CUR.theme === "feudal") updateSheaves();

  // door proximity: standing on the tile directly below a doorway
  G.nearDoor = null;
  var cx = Math.floor((p.x+p.w/2)/TILE), cy = Math.floor((p.y+p.h/2)/TILE);
  for (var i=0;i<BUILDINGS.length;i++){
    var b = BUILDINGS[i];
    if (cx===b.door.x && cy===b.door.y+1){ G.nearDoor = b; break; }
  }

  // NPC proximity: within ~1.5 tiles
  G.nearNPC = null;
  for (var j=0;j<NPCS.length;j++){
    var n = NPCS[j];
    var ddx = (n.tx*TILE+TILE/2) - (p.x+p.w/2);
    var ddy = (n.ty*TILE+TILE/2) - (p.y+p.h/2);
    if (ddx*ddx + ddy*ddy < (TILE*1.5)*(TILE*1.5)){ G.nearNPC = n; break; }
  }

  // gate proximity: within 2 tiles of the fountain when the desk or the charter is open
  G.nearGate = false;
  if (gateOpen() || deskOpen()){
    var gdx = GATE.tx*TILE - (p.x+p.w/2);
    var gdy = GATE.ty*TILE - (p.y+p.h/2);
    if (gdx*gdx + gdy*gdy < (TILE*2.5)*(TILE*2.5)) G.nearGate = true;
  }
  refreshHUD();
}

/* ---------- Render ---------- */
function camera(){
  var p = G.player;
  var cx = Math.round(p.x + p.w/2 - VIEW_W/2);
  var cy = Math.round(p.y + p.h/2 - VIEW_H/2);
  cx = Math.max(0, Math.min(cx, MAP_W*TILE - VIEW_W));
  cy = Math.max(0, Math.min(cy, MAP_H*TILE - VIEW_H));
  return {x:cx, y:cy};
}

function render(){
  if (!ctx) return; // headless safe
  if (arcade && (G.scene==="ARCADE" || G.scene==="ARCADE_MENU")){ renderArcade(); return; }
  if (G.scene === "INTERIOR" && currentRoom){ drawRoomCanvas(currentRoom); return; }
  var cam = camera();
  ctx.fillStyle = CUR.palette.bg;
  ctx.fillRect(0,0,VIEW_W,VIEW_H);

  var x0 = Math.floor(cam.x/TILE), y0 = Math.floor(cam.y/TILE);
  var x1 = Math.min(MAP_W-1, Math.ceil((cam.x+VIEW_W)/TILE));
  var y1 = Math.min(MAP_H-1, Math.ceil((cam.y+VIEW_H)/TILE));

  // ground, themed per chapter. Milestone 8.
  for (var y=y0;y<=y1;y++){
    for (var x=x0;x<=x1;x++){
      var sx = x*TILE-cam.x, sy = y*TILE-cam.y;
      drawGroundTile(MAP_ROWS[y][x], x, y, sx, sy);
    }
  }

  // street decor, drawn under the buildings
  (CH_DECOR[CHAPTER_ID] || []).forEach(function(d){
    var sx = d.tx*TILE-cam.x, sy = d.ty*TILE-cam.y;
    if (sx<-100||sy<-100||sx>VIEW_W+100||sy>VIEW_H+100) return;
    drawDecorItem(d, sx, sy);
  });

  // buildings
  BUILDINGS.forEach(function(b){
    var bx = b.x*TILE-cam.x, by = b.y*TILE-cam.y;
    var bw = b.w*TILE, bh = b.h*TILE;
    if (bx>VIEW_W||by>VIEW_H||bx+bw<0||by+bh<0) return;
    // facade, per archetype
    drawBuildingArt(b, bx, by, bw, bh);
    // door
    var dx = b.door.x*TILE-cam.x, dy = b.door.y*TILE-cam.y;
    ctx.fillStyle = "#241a12"; ctx.fillRect(dx+4, dy+2, TILE-8, TILE-2);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(dx+TILE-12, dy+TILE/2, 3, 3);
    // sign
    ctx.fillStyle = "#15121c"; ctx.fillRect(bx+bw/2-34, by+12, 68, 13);
    var locked = (b.kind==="institute" && insightCount() < LESSON_IDS.length);
    ctx.fillStyle = locked ? "#5a526e" : (b.kind==="lesson") ? "#e8b04b" : (b.kind==="institute") ? "#7fe5b0" : "#3fb8af";
    ctx.font = "8px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText(b.sign, bx+bw/2, by+22);
    if (locked){
      ctx.fillStyle = "#5a526e";
      ctx.fillRect(bx+bw/2-5, by+30, 10, 8);
      ctx.fillRect(bx+bw/2-3, by+26, 6, 5);
    }
    // star marker over required lesson buildings
    if (b.kind==="lesson" && !G.insights[b.id]){
      var bob = Math.sin(G.time/300)*3;
      ctx.fillStyle = "#e8b04b";
      drawStar(bx+bw/2, by-10+bob, 8);
    }
    // star over the Institute once it unlocks, until it is passed
    if (b.kind==="institute" && !locked && !G.institutePassed){
      var bob2 = Math.sin(G.time/300)*3;
      ctx.fillStyle = "#7fe5b0";
      drawStar(bx+bw/2, by-10+bob2, 8);
    }
  });

  // hazards
  HAZARDS.forEach(function(h){
    var hx = Math.round(h.x-cam.x), hy = Math.round(h.y-cam.y);
    if (hx<-40||hy<-40||hx>VIEW_W+40||hy>VIEW_H+40) return;
    if (h.skin==="taxi"){
      // the yellow cab: checker band, glass, a roof light that ticks
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+2, hy+h.h-3, h.w-4, 5);
      ctx.fillStyle = "#d8a420"; ctx.fillRect(hx, hy+4, h.w, h.h-8);
      ctx.fillStyle = "#b8880e"; ctx.fillRect(hx, hy+h.h-8, h.w, 4);
      ctx.fillStyle = "#1c2734";
      ctx.fillRect(hx+5, hy+6, 8, 6); ctx.fillRect(hx+h.w-13, hy+6, 8, 6);
      ctx.fillStyle = "#15121c";
      for (var ck = 0; ck < Math.floor(h.w/6); ck++){
        if (ck % 2 === 0) ctx.fillRect(hx+ck*6, hy+13, 4, 3);
      }
      ctx.fillStyle = "#241a12";
      ctx.beginPath(); ctx.arc(hx+7, hy+h.h-3, 4, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+h.w-7, hy+h.h-3, 4, 0, 7); ctx.fill();
      var lit = Math.floor(G.time/500) % 2 === 0;
      ctx.fillStyle = lit ? "#ffe9b0" : "#8a7a40"; ctx.fillRect(hx+h.w/2-4, hy, 8, 4);
    } else if (h.skin==="suit"){
      // the debt collector in a sharp suit, briefcase swinging
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+3, hy+h.h-3, h.w-6, 5);
      ctx.fillStyle = "#1e2530"; ctx.fillRect(hx+2, hy+8, h.w-4, h.h-10);
      ctx.fillStyle = "#efe6d2"; ctx.fillRect(hx+h.w/2-3, hy+9, 6, 8);
      ctx.fillStyle = "#a32a2a"; ctx.fillRect(hx+h.w/2-1, hy+9, 2, 8);
      ctx.fillStyle = "#e8c39e"; ctx.fillRect(hx+5, hy+2, h.w-10, 9);
      ctx.fillStyle = "#2a2a30"; ctx.fillRect(hx+4, hy, h.w-8, 3);
      var swg = Math.round(Math.sin(G.time/240) * 2);
