    } else if (h.skin==="directive"){
      // a fresh directive on the wind, a stamped sheet
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(hx+5, hy+h.h-2, h.w-10, 4);
      ctx.fillStyle = "#f2e8d5"; ctx.fillRect(hx+3, hy+3, h.w-6, h.h-6);
      ctx.fillStyle = "#cfc8b8"; ctx.fillRect(hx+6, hy+7, h.w-12, 2); ctx.fillRect(hx+6, hy+12, h.w-12, 2);
      ctx.fillStyle = "#9a2f2a"; ctx.fillRect(hx+h.w-13, hy+h.h-11, 9, 9);
      ctx.fillStyle = "#7a231f"; ctx.font="6px 'Press Start 2P', monospace"; ctx.textAlign="center";
      ctx.fillText("ORDER", hx+h.w/2, hy+6);
    } else if (h.skin==="predator"){
      // a prowling beast: low body, ears, a pale watchful eye
      var pface = (h.dir !== undefined && h.dir < 0) ? -1 : 1;
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+2, hy+h.h-3, h.w-4, 5);
      ctx.fillStyle = "#7a5a36"; ctx.fillRect(hx+2, hy+6, h.w-4, h.h-10);
      ctx.fillStyle = "#6a4c2c"; ctx.fillRect(hx+2, hy+h.h-8, h.w-4, 4);
      ctx.fillStyle = "#8a6a40"; ctx.fillRect(pface>0?hx+h.w-12:hx, hy+3, 12, 12);
      ctx.fillStyle = "#5c4326";
      ctx.fillRect(pface>0?hx+h.w-11:hx+2, hy, 3, 4); ctx.fillRect(pface>0?hx+h.w-5:hx+6, hy, 3, 4);
      ctx.fillStyle = "#f2e8b0"; ctx.fillRect(pface>0?hx+h.w-6:hx+3, hy+6, 3, 3);
      ctx.fillStyle = "#5c4326";
      ctx.fillRect(hx+4, hy+h.h-4, 3, 4); ctx.fillRect(hx+h.w-7, hy+h.h-4, 3, 4);
    } else if (h.skin==="navysloop"){
      // a crown patrol sloop: dark hull, white sail, a red ensign
      ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(hx+3, hy+h.h-3, h.w-6, 5);
      ctx.fillStyle = "#2a3744"; ctx.fillRect(hx+2, hy+10, h.w-4, h.h-12);
      ctx.fillStyle = "#3c4c5a"; ctx.fillRect(hx+4, hy+10, h.w-8, 3);
      ctx.fillStyle = "#1c2530"; ctx.fillRect(hx+6, hy+16, h.w-12, 4);
      ctx.fillStyle = "#3a2412"; ctx.fillRect(hx+h.w/2-1, hy-4, 2, 16);   // mast
      var bil = Math.round(Math.sin(G.time/200)*2);
      ctx.fillStyle = "#efe6d2"; ctx.fillRect(hx+h.w/2-9+bil, hy-2, 18, 12);
      ctx.fillStyle = "#d8cdb4"; ctx.fillRect(hx+h.w/2-9+bil, hy-2, 18, 2);
      var ef = Math.floor(G.time/240)%2===0?0:1;
      ctx.fillStyle = "#c23a2a"; ctx.fillRect(hx+h.w/2+1, hy-8, 7-ef, 4);
      ctx.fillStyle = "rgba(214,238,245,.4)"; ctx.fillRect(hx+2, hy+h.h-2, h.w-4, 2);
    } else if (h.skin==="stormcell"){
      // a drifting squall: a dark cloud with rain streaks and a flash
      var pr = h.w/2;
      ctx.fillStyle = "rgba(20,40,54,.5)";
      ctx.beginPath(); ctx.arc(hx+pr, hy+pr-4, pr, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(40,64,80,.55)";
      ctx.beginPath(); ctx.arc(hx+pr-8, hy+pr-2, pr*0.7, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+pr+8, hy+pr-2, pr*0.7, 0, 7); ctx.fill();
      var ro = (G.time/40)%10;
      ctx.fillStyle = "rgba(150,205,224,.6)";
      for (var rdx=0; rdx<h.w; rdx+=7){ ctx.fillRect(hx+rdx, hy+pr+2+((ro+rdx)%10), 1, 6); }
      if (Math.floor(G.time/700)%5===0){ ctx.fillStyle="rgba(255,250,210,.85)"; ctx.fillRect(hx+pr-1, hy+pr-2, 3, h.h-pr); }
    } else if (h.skin==="frigate"){
      // a navy frigate hunter: bigger hull, three gun ports, a chasing prow
      ctx.fillStyle = "rgba(0,0,0,.32)"; ctx.fillRect(hx+3, hy+h.h-3, h.w-6, 5);
      ctx.fillStyle = "#23303c"; ctx.fillRect(hx+2, hy+12, h.w-4, h.h-14);
      ctx.fillStyle = "#34424f"; ctx.fillRect(hx+2, hy+12, h.w-4, 3);
      ctx.fillStyle = "#e8b04b";
      for (var gp=hx+6; gp<hx+h.w-6; gp+=9){ ctx.fillRect(gp, hy+19, 4, 4); }
      ctx.fillStyle = "#3a2412"; ctx.fillRect(hx+h.w/2-1, hy-6, 3, 20);
      var bil2 = Math.round(Math.sin(G.time/180)*2);
      ctx.fillStyle = "#efe6d2"; ctx.fillRect(hx+h.w/2-11+bil2, hy-4, 22, 14);
      ctx.fillStyle = "#9a2f2a"; ctx.fillRect(hx+h.w/2+2, hy-12, 8, 5);
      ctx.fillStyle = "rgba(214,238,245,.45)"; ctx.fillRect(hx+2, hy+h.h-2, h.w-4, 3);
    } else if (h.skin==="freightsled"){
      // an automated freight sled: a low chassis with a glowing cargo block
      ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(hx+3, hy+h.h-3, h.w-6, 5);
      ctx.fillStyle = "#3a5260"; ctx.fillRect(hx+2, hy+8, h.w-4, h.h-10);
      ctx.fillStyle = "#4a6a7a"; ctx.fillRect(hx+4, hy+8, h.w-8, 3);
      ctx.fillStyle = "rgba(120,225,224,.5)"; ctx.fillRect(hx+6, hy+12, h.w-12, 6);
      var fdir = (h.dir !== undefined && h.dir < 0) ? -1 : 1;
      var lit = Math.floor(G.time/300)%2===0;
      ctx.fillStyle = lit ? "#78e9e0" : "#2a6a64";
      ctx.fillRect(fdir>0 ? hx+h.w-4 : hx, hy+11, 4, 5);
      ctx.fillStyle = "rgba(120,225,224,.25)"; ctx.fillRect(hx+2, hy+h.h-2, h.w-4, 2);
    } else if (h.skin==="diagfield"){
      // a drifting diagnostic field: a soft scanning bubble with a cross
      var dr = h.w/2;
      ctx.fillStyle = "rgba(120,225,224,.18)";
      ctx.beginPath(); ctx.arc(hx+dr, hy+dr, dr, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(190,235,240,.7)";
      ctx.beginPath(); ctx.arc(hx+dr, hy+dr, dr-1, 0, 7); ctx.stroke();
      var sc = (G.time/30) % (h.h);
      ctx.fillStyle = "rgba(190,255,235,.5)"; ctx.fillRect(hx+4, hy+sc, h.w-8, 1);
      ctx.fillStyle = "rgba(120,225,224,.8)";
      ctx.fillRect(hx+dr-1, hy+dr-6, 2, 12); ctx.fillRect(hx+dr-6, hy+dr-1, 12, 2);
    } else if (h.skin==="tidyswarm"){
      // a tidy swarm: a cluster of tiny bots orbiting a soft core
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(hx+4, hy+h.h-3, h.w-8, 4);
      ctx.fillStyle = "rgba(150,200,235,.25)";
      ctx.beginPath(); ctx.arc(hx+h.w/2, hy+h.h/2, h.w/2, 0, 7); ctx.fill();
      var oa = G.time/200;
      for (var sb=0; sb<5; sb++){
        var a = oa + sb*1.256;
        var ox = hx+h.w/2 + Math.cos(a)*(h.w/2-4);
        var oy = hy+h.h/2 + Math.sin(a)*(h.h/2-4);
        ctx.fillStyle = sb%2===0 ? "#cfd8e0" : "#78e9e0";
        ctx.fillRect(ox-2, oy-2, 4, 4);
      }
      ctx.fillStyle = "#bfe9ea"; ctx.beginPath(); ctx.arc(hx+h.w/2, hy+h.h/2, 4, 0, 7); ctx.fill();
    } else if (h.type==="cart"){
      ctx.fillStyle = "#a3713c"; ctx.fillRect(hx+3, hy, h.w-6, 8);
      ctx.fillStyle = "#241a12";
      ctx.beginPath(); ctx.arc(hx+7, hy+h.h-2, 5, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(hx+h.w-7, hy+h.h-2, 5, 0, 7); ctx.fill();
    } else if (h.type==="collector"){
      ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(hx+3, hy+h.h-3, h.w-6, 5);
      ctx.fillStyle = "#2b2b33"; ctx.fillRect(hx+2, hy+8, h.w-4, h.h-10);
      ctx.fillStyle = "#e8c39e"; ctx.fillRect(hx+5, hy+2, h.w-10, 9);
      ctx.fillStyle = "#15121c"; ctx.fillRect(hx+3, hy, h.w-6, 4);
      ctx.fillStyle = "#e25549"; ctx.fillRect(hx+h.w/2-5, hy+13, 10, 6);
      ctx.fillStyle = "#e8b04b"; ctx.font="8px 'Press Start 2P', monospace"; ctx.textAlign="center";
      ctx.fillText("$", hx+h.w/2, hy+19);
    } else if (h.type==="bubble"){
      var rr = h.w/2;
      ctx.fillStyle = "rgba(99,200,255,.28)";
      ctx.beginPath(); ctx.arc(hx+rr, hy+rr, rr, 0, 7); ctx.fill();
      ctx.strokeStyle = "rgba(160,225,255,.8)";
      ctx.beginPath(); ctx.arc(hx+rr, hy+rr, rr-1, 0, 7); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,.7)";
      ctx.beginPath(); ctx.arc(hx+rr-4, hy+rr-5, 3, 0, 7); ctx.fill();
      ctx.fillStyle = "#9fdcff"; ctx.font="8px 'Press Start 2P', monospace"; ctx.textAlign="center";
      ctx.fillText("HYPE", hx+rr, hy+rr+3);
    }
  });

  // critters, pure atmosphere
  critters.forEach(function(c){
    var sx = Math.round(c.x-cam.x), sy = Math.round(c.y-cam.y);
    if (sx<-30||sy<-30||sx>VIEW_W+30||sy>VIEW_H+30) return;
    drawCritter(c, sx, sy);
  });

  // grain sheaves on the fields, feudal only
  if (CUR.theme === "feudal") drawSheaves(cam);

  // NPCs
  NPCS.forEach(function(n){
    var nx = n.tx*TILE-cam.x, ny = n.ty*TILE-cam.y;
    if (nx<-TILE||ny<-TILE||nx>VIEW_W||ny>VIEW_H) return;
    var bobn = Math.round(Math.sin((G.time + n.tx*137)/420)*2);
    ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(nx+8, ny+24, 16, 5);
    ctx.fillStyle = n.hue; ctx.fillRect(nx+6, ny+8+bobn, 20, 18);
    ctx.fillStyle = "#e8c39e"; ctx.fillRect(nx+9, ny+bobn, 14, 11);
    ctx.fillStyle = "#15121c"; ctx.fillRect(nx+12, ny+4+bobn, 2,2); ctx.fillRect(nx+18, ny+4+bobn, 2,2);
    if (!n.met){
      ctx.fillStyle = "#3fb8af"; ctx.font = "10px 'Press Start 2P', monospace"; ctx.textAlign="center";
      ctx.fillText("!", nx+16, ny-8+bobn);
    }
  });

  // the open gate: a beacon over the fountain. The Desk comes first, the Charter after.
  if (gateOpen() || deskOpen()){
    var deskPhase = deskOpen();
    var beaconColor = deskPhase ? "#7fb2e5" : "#e8b04b";
    var beaconGlow = deskPhase ? "rgba(127,178,229,.18)" : "rgba(232,176,75,.18)";
    var beaconLabel = deskPhase ? "DECISION DESK" : CUR.charterName;
    var beaconPrompt = deskPhase ? "A: TAKE THE DESK" : "A: SIGN IT";
    var gx = GATE.tx*TILE-cam.x, gy = GATE.ty*TILE-cam.y;
    var pulse = 10 + Math.sin(G.time/250)*3;
    ctx.fillStyle = beaconGlow;
    ctx.beginPath(); ctx.arc(gx, gy, 40 + Math.sin(G.time/250)*5, 0, 7); ctx.fill();
    ctx.fillStyle = beaconColor;
    drawStar(gx, gy-44 + Math.sin(G.time/300)*4, pulse);
    ctx.fillStyle = beaconColor; ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText(beaconLabel, gx, gy-62);
    if (G.nearGate && G.scene==="WALK"){
      ctx.fillStyle = "rgba(21,18,28,.9)";
      ctx.fillRect(gx-62, gy+38, 124, 18);
      ctx.strokeStyle = beaconColor; ctx.strokeRect(gx-62.5, gy+38.5, 125, 18);
      ctx.fillStyle = beaconColor;
      ctx.fillText(beaconPrompt, gx, gy+50);
    }
  }

  // doorway prompt
  if (G.nearDoor && G.scene==="WALK"){
    var b = G.nearDoor;
    var dx = b.door.x*TILE-cam.x+TILE/2, dy = (b.door.y+1)*TILE-cam.y-44;
    ctx.fillStyle = "rgba(21,18,28,.9)";
    ctx.fillRect(dx-58, dy, 116, 18);
    ctx.strokeStyle = "#3fb8af"; ctx.strokeRect(dx-58.5, dy+.5, 117, 18);
    ctx.fillStyle = "#3fb8af"; ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText("A: ENTER", dx, dy+12);
  } else if (G.nearNPC && G.scene==="WALK"){
    var n2 = G.nearNPC;
    var tx2 = n2.tx*TILE-cam.x+TILE/2, ty2 = n2.ty*TILE-cam.y-26;
    ctx.fillStyle = "rgba(21,18,28,.9)";
    ctx.fillRect(tx2-50, ty2, 100, 18);
    ctx.strokeStyle = "#3fb8af"; ctx.strokeRect(tx2-50.5, ty2+.5, 101, 18);
    ctx.fillStyle = "#3fb8af"; ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign="center";
    ctx.fillText("A: TALK", tx2, ty2+12);
  }

  // player
  var p = G.player;
  var px = Math.round(p.x-cam.x), py = Math.round(p.y-cam.y);
  var bobp = (p.anim>0) ? Math.round(Math.sin(p.anim/90)*2) : 0;
  var flashing = (G.time < G.invulnUntil) && (Math.floor(G.time/120)%2===0);
  if (G.time < G.careUntil){
    ctx.strokeStyle = "rgba(63,184,175,.7)";
    ctx.beginPath(); ctx.arc(px+p.w/2, py+p.h/2, 20 + Math.sin(G.time/200)*2, 0, 7); ctx.stroke();
  }
  ctx.fillStyle = "rgba(0,0,0,.35)"; ctx.fillRect(px+2, py+p.h-4, p.w-4, 5);
  if (!flashing){
  if (CUR.theme === "feudal"){
    drawFeudalPlayer(px, py, bobp);
  } else if (CUR.theme === "pirate"){
    drawShipPlayer(px, py, bobp);
  } else if (CUR.theme === "future"){
    drawVenusPlayer(px, py, bobp);
  } else {
  ctx.fillStyle = "#2c4f7c"; ctx.fillRect(px, py+8+bobp, p.w, p.h-8);     // coat
  ctx.fillStyle = "#e8c39e"; ctx.fillRect(px+4, py+bobp, p.w-8, 12);      // face
  ctx.fillStyle = "#5a3a23"; ctx.fillRect(px+3, py-3+bobp, p.w-6, 6);     // hair
  ctx.fillStyle = "#15121c";
  if (p.dir!=="up"){ ctx.fillRect(px+7, py+4+bobp, 2,2); ctx.fillRect(px+p.w-9, py+4+bobp, 2,2); }
  ctx.fillStyle = "#e8b04b"; ctx.fillRect(px+p.w/2-2, py+12+bobp, 4, 4);  // brass button
  }
  }
}

/* ---------- The arcade renderer: a trading floor terminal ---------- */
var TICKER_TAPE = "GRAIN \u25BC12   RAIL \u25B24   DYE \u25BC7   PINS \u25B29   BREAD \u25BC3   COAL \u25B26   HYPE \u25BC22   ";

function renderArcadeTerminal(){
  var E = arcade;
  // the terminal: near black, faint green grid, scanlines
  ctx.fillStyle = "#04100a";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.strokeStyle = "rgba(67,209,124,.07)";
  ctx.lineWidth = 1;
  for (var gx = 0; gx <= VIEW_W; gx += 32){
    ctx.beginPath(); ctx.moveTo(gx+.5, 0); ctx.lineTo(gx+.5, VIEW_H); ctx.stroke();
  }
  for (var gy = 0; gy <= VIEW_H; gy += 32){
    ctx.beginPath(); ctx.moveTo(0, gy+.5); ctx.lineTo(VIEW_W, gy+.5); ctx.stroke();
  }
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (var sl = 0; sl < VIEW_H; sl += 4) ctx.fillRect(0, sl, VIEW_W, 2);

  // the tape scrolls along the top
  ctx.fillStyle = "#02120a";
  ctx.fillRect(0, 0, VIEW_W, 22);
  ctx.strokeStyle = "rgba(67,209,124,.4)";
  ctx.beginPath(); ctx.moveTo(0, 22.5); ctx.lineTo(VIEW_W, 22.5); ctx.stroke();
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#2f8a56";
  var tapeW = ctx.measureText(TICKER_TAPE).width || 600;
  var off = (E.elapsed / 18) % tapeW;
  ctx.fillText(TICKER_TAPE + TICKER_TAPE, -off, 15);

  // the floor line the bears must not cross
  ctx.strokeStyle = "rgba(226,85,73,.55)";
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(0, E.floorY+.5); ctx.lineTo(VIEW_W, E.floorY+.5); ctx.stroke();
  ctx.setLineDash([]);

  // live HUD: score, streak, wave, clock
  var liveScore = E.damagePts + E.comboPts;
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.fillStyle = "#43d17c";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + liveScore, 12, 42);
  ctx.fillStyle = E.combo >= E.cfg.comboEvery ? "#e8b04b" : "#9fe0b8";
  ctx.fillText("STREAK x" + E.combo, 12, 58);
  ctx.textAlign = "right";
  ctx.fillStyle = "#43d17c";
  ctx.fillText("WAVE " + (E.wave+1) + " OF " + E.cfg.waves.length, VIEW_W-12, 42);
  ctx.fillStyle = "#9fe0b8";
  ctx.fillText(Math.floor(E.elapsed/1000) + "s  PAR " + E.cfg.par, VIEW_W-12, 58);

  // sell orders: red down arrows
  E.drops.forEach(function(d){
    var dxc = d.x + d.w/2;
    ctx.fillStyle = "#e25549";
    ctx.beginPath();
    ctx.moveTo(d.x, d.y);
    ctx.lineTo(d.x + d.w, d.y);
    ctx.lineTo(d.x + d.w, d.y + d.h*0.55);
    ctx.lineTo(dxc, d.y + d.h);
    ctx.lineTo(d.x, d.y + d.h*0.55);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)";
    ctx.fillRect(dxc-1, d.y+2, 2, d.h*0.4);
  });

  // bears descend
  E.bears.forEach(function(b){
    var bx = Math.round(b.x), by = Math.round(b.y);
    var body = b.fat ? "#7d4a2a" : "#6e4a24";
    var dark = b.fat ? "#54301a" : "#4a3018";
    // body
    ctx.fillStyle = body;
    ctx.fillRect(bx, by+8, b.w, b.h-8);
    // head and ears
    ctx.fillStyle = dark;
    ctx.fillRect(bx + b.w/2 - 9, by, 18, 12);
    ctx.fillRect(bx + b.w/2 - 11, by-3, 5, 5);
    ctx.fillRect(bx + b.w/2 + 6,  by-3, 5, 5);
    // eyes
    ctx.fillStyle = "#e25549";
    ctx.fillRect(bx + b.w/2 - 6, by+4, 3, 3);
    ctx.fillRect(bx + b.w/2 + 3, by+4, 3, 3);
    // claws
    ctx.fillStyle = "#f2e8d5";
    ctx.fillRect(bx+2, by+b.h-4, 4, 4);
    ctx.fillRect(bx+b.w-6, by+b.h-4, 4, 4);
    // a second wind for fat bears
    if (b.fat && b.hp > 1){
      ctx.fillStyle = "#e8b04b";
      ctx.fillRect(bx + b.w/2 - 8, by + b.h + 3, 16, 3);
    }
  });

  // buy orders rise: brass coins
  E.shots.forEach(function(sh){
    var cx2 = sh.x + sh.w/2, cy2 = sh.y + sh.h/2;
    ctx.fillStyle = "#e8b04b";
    ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "#8a6422";
    ctx.font = "7px 'Press Start 2P', monospace"; ctx.textAlign = "center";
    ctx.fillText("$", cx2, cy2+3);
  });

  // the bull
  var bl = E.bull;
  var blink = (bl.flash > 0) && (Math.floor(E.elapsed/110) % 2 === 0);
  if (!blink){
    var px = Math.round(bl.x), py = Math.round(bl.y);
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.fillRect(px+4, py+bl.h-2, bl.w-8, 5);
    // body
    ctx.fillStyle = "#b08334";
    ctx.fillRect(px, py+8, bl.w, bl.h-10);
    // head
    ctx.fillStyle = "#8a6422";
    ctx.fillRect(px + bl.w/2 - 10, py, 20, 14);
    // horns
    ctx.fillStyle = "#f2e8d5";
    ctx.fillRect(px + bl.w/2 - 16, py-4, 6, 7);
    ctx.fillRect(px + bl.w/2 + 10, py-4, 6, 7);
    // eyes and snout
    ctx.fillStyle = "#15121c";
    ctx.fillRect(px + bl.w/2 - 6, py+4, 3, 3);
    ctx.fillRect(px + bl.w/2 + 3, py+4, 3, 3);
    ctx.fillStyle = "#43d17c";
    ctx.fillRect(px + bl.w/2 - 4, py+10, 8, 3);
    // hooves
    ctx.fillStyle = "#54301a";
    ctx.fillRect(px+3, py+bl.h-4, 6, 4);
    ctx.fillRect(px+bl.w-9, py+bl.h-4, 6, 4);
  }

  // floating feedback
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "center";
  E.fx.forEach(function(f){
    ctx.globalAlpha = Math.max(0, Math.min(1, f.t/600));
    ctx.fillStyle = f.bad ? "#e25549" : "#43d17c";
    ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
  });
  ctx.globalAlpha = 1;

  // last frame holds under the closing bell
  if (E.over){
    ctx.fillStyle = "rgba(2,10,6,.45)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* The dispatch board: the Chapter 2 skin. Warm rose and cream,
   needs descending as bowls, parcels rising, grievance forms falling. */
var DISPATCH_TAPE = "BREAD QUEUE 12 MIN   TRAM ON TIME   CLINIC WAIT 40 MIN   BOOTS RESTOCKED   MEETING RUNS LONG   HARVEST FAIR   QUOTA 96 PCT   ";

function renderArcadeDispatch(){
  var E = arcade;
  // the board: deep plum, faint rose grid, soft scanlines
  ctx.fillStyle = "#16090f";
  ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  ctx.strokeStyle = "rgba(214,126,140,.07)";
  ctx.lineWidth = 1;
  for (var gx = 0; gx <= VIEW_W; gx += 32){
    ctx.beginPath(); ctx.moveTo(gx+.5, 0); ctx.lineTo(gx+.5, VIEW_H); ctx.stroke();
  }
  for (var gy = 0; gy <= VIEW_H; gy += 32){
    ctx.beginPath(); ctx.moveTo(0, gy+.5); ctx.lineTo(VIEW_W, gy+.5); ctx.stroke();
  }
  ctx.fillStyle = "rgba(0,0,0,.18)";
  for (var sl = 0; sl < VIEW_H; sl += 4) ctx.fillRect(0, sl, VIEW_W, 2);

  // the dispatch tape along the top
  ctx.fillStyle = "#1d0b12";
  ctx.fillRect(0, 0, VIEW_W, 22);
  ctx.strokeStyle = "rgba(214,126,140,.4)";
  ctx.beginPath(); ctx.moveTo(0, 22.5); ctx.lineTo(VIEW_W, 22.5); ctx.stroke();
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "left";
  ctx.fillStyle = "#a06a76";
  var tapeW = ctx.measureText(DISPATCH_TAPE).width || 600;
  var off = (E.elapsed / 18) % tapeW;
  ctx.fillText(DISPATCH_TAPE + DISPATCH_TAPE, -off, 15);

  // the waiting line the needs must not reach
  ctx.strokeStyle = "rgba(226,85,73,.55)";
  ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(0, E.floorY+.5); ctx.lineTo(VIEW_W, E.floorY+.5); ctx.stroke();
  ctx.setLineDash([]);
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "right";
  ctx.fillStyle = "rgba(226,85,73,.5)";
  ctx.fillText("THE WAITING LINE", VIEW_W-10, E.floorY-6);

  // live HUD
  var liveScore = E.damagePts + E.comboPts;
  ctx.fillStyle = "#e6b8c0";
  ctx.textAlign = "left";
  ctx.fillText("SCORE " + liveScore, 12, 42);
  ctx.fillStyle = E.combo >= E.cfg.comboEvery ? "#e8b04b" : "#d6a0ac";
  ctx.fillText("STREAK x" + E.combo, 12, 58);
  ctx.textAlign = "right";
  ctx.fillStyle = "#e6b8c0";
  ctx.fillText("WAVE " + (E.wave+1) + " OF " + E.cfg.waves.length, VIEW_W-12, 42);
  ctx.fillStyle = "#d6a0ac";
  ctx.fillText(Math.floor(E.elapsed/1000) + "s  PAR " + E.cfg.par, VIEW_W-12, 58);

  // grievance forms drift down: cream paper with rule lines
  E.drops.forEach(function(d){
    ctx.fillStyle = "#efe6d2";
    ctx.fillRect(d.x, d.y, d.w, d.h);
    ctx.fillStyle = "#b8a98c";
    ctx.fillRect(d.x+2, d.y+3, d.w-4, 1);
    ctx.fillRect(d.x+2, d.y+6, d.w-4, 1);
    ctx.fillRect(d.x+2, d.y+9, d.w-4, 1);
    ctx.fillStyle = "#e25549";
    ctx.fillRect(d.x+2, d.y+d.h-3, 4, 2);
  });

  // needs descend: soup bowls, crates when fat
  E.bears.forEach(function(b){
    var bx = Math.round(b.x), by = Math.round(b.y);
    if (b.fat){
      // a heavy crate of needs
      ctx.fillStyle = "#8a5a3c";
      ctx.fillRect(bx, by+4, b.w, b.h-4);
      ctx.fillStyle = "#5c3a25";
      ctx.fillRect(bx, by+4, b.w, 4);
      ctx.fillRect(bx + b.w/2 - 2, by+4, 4, b.h-4);
      ctx.fillStyle = "#efe6d2";
      ctx.fillRect(bx+4, by+b.h/2, b.w-8, 5);
      if (b.hp > 1){
        ctx.fillStyle = "#e8b04b";
        ctx.fillRect(bx + b.w/2 - 8, by + b.h + 3, 16, 3);
      }
    } else {
      // a bowl with steam
      ctx.fillStyle = "#d6a0ac";
      ctx.beginPath();
      ctx.moveTo(bx, by+10);
      ctx.lineTo(bx + b.w, by+10);
      ctx.lineTo(bx + b.w - 6, by + b.h);
      ctx.lineTo(bx + 6, by + b.h);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#9e6f7a";
      ctx.fillRect(bx, by+10, b.w, 3);
      ctx.fillStyle = "rgba(239,230,210,.7)";
      var wob = Math.floor(E.elapsed/240) % 2 === 0 ? 0 : 2;
      ctx.fillRect(bx + 8 + wob, by, 2, 7);
      ctx.fillRect(bx + b.w - 12 - wob, by+1, 2, 7);
    }
  });

  // parcels rise: brown paper with a cross of twine
  E.shots.forEach(function(sh){
    ctx.fillStyle = "#b08334";
    ctx.fillRect(sh.x-2, sh.y, sh.w+4, sh.h);
    ctx.fillStyle = "#efe6d2";
    ctx.fillRect(sh.x-2, sh.y + sh.h/2 - 1, sh.w+4, 2);
    ctx.fillRect(sh.x + sh.w/2 - 1, sh.y, 2, sh.h);
  });

  // the courier and the cart
  var bl = E.bull;
  var blink = (bl.flash > 0) && (Math.floor(E.elapsed/110) % 2 === 0);
  if (!blink){
    var px = Math.round(bl.x), py = Math.round(bl.y);
    ctx.fillStyle = "rgba(0,0,0,.4)";
    ctx.fillRect(px+4, py+bl.h-2, bl.w-8, 5);
    // the cart bed, stacked with parcels
    ctx.fillStyle = "#7a4a2e";
    ctx.fillRect(px, py+10, bl.w, bl.h-12);
    ctx.fillStyle = "#b08334";
    ctx.fillRect(px+4, py+3, 10, 9);
    ctx.fillRect(px+17, py+5, 9, 7);
    ctx.fillStyle = "#efe6d2";
    ctx.fillRect(px+4, py+7, 10, 1);
    ctx.fillRect(px+17, py+8, 9, 1);
    // the courier at the handle, teal cap
    ctx.fillStyle = "#e0b88a";
    ctx.fillRect(px + bl.w - 9, py+2, 7, 7);
    ctx.fillStyle = "#3fae9e";
    ctx.fillRect(px + bl.w - 10, py, 9, 3);
    ctx.fillStyle = "#3a5a6e";
    ctx.fillRect(px + bl.w - 9, py+9, 7, 9);
    // wheels
    ctx.fillStyle = "#2a1c12";
    ctx.fillRect(px+5, py+bl.h-5, 7, 5);
    ctx.fillRect(px+bl.w-13, py+bl.h-5, 7, 5);
  }

  // floating feedback
  ctx.font = "8px 'Press Start 2P', monospace";
  ctx.textAlign = "center";
  E.fx.forEach(function(f){
    ctx.globalAlpha = Math.max(0, Math.min(1, f.t/600));
    ctx.fillStyle = f.bad ? "#e25549" : "#e6b8c0";
    ctx.fillText(f.text, Math.round(f.x), Math.round(f.y));
  });
  ctx.globalAlpha = 1;

  // last frame holds under the end of shift
  if (E.over){
    ctx.fillStyle = "rgba(20,6,12,.45)";
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
}

/* The courtyard at dusk: the SAFETY NET frame. Warm brick, lit windows
   the needs fall from, a laundry line, the waiting folk, and the net. */
function renderCatchNet(){
  if (!ctx || !arcade) return;
  var A = arcade, W = A.W, H = A.H;
  // dusk air
  ctx.fillStyle = "#241b14"; ctx.fillRect(0, 0, W, H);
  // the courtyard wall and its window rows
  ctx.fillStyle = "#3a241c"; ctx.fillRect(0, 0, W, 130);
  ctx.fillStyle = "#6e3231"; ctx.fillRect(0, 126, W, 6);
  for (var wx = 24; wx < W - 30; wx += 56){
    for (var wy = 18; wy < 110; wy += 46){
      var lit = tileHash(wx, wy) % 4 !== 0;
      ctx.fillStyle = lit ? "rgba(255,225,170,.55)" : "rgba(20,14,10,.8)";
      ctx.fillRect(wx, wy, 22, 28);
      ctx.fillStyle = "rgba(20,14,10,.5)";
      ctx.fillRect(wx + 10, wy, 2, 28); ctx.fillRect(wx, wy + 13, 22, 2);
      ctx.fillStyle = "#241a12"; ctx.fillRect(wx - 3, wy + 28, 28, 4);
    }
  }
  // the laundry line, still working the night shift
  ctx.strokeStyle = "rgba(220,215,200,.35)";
  ctx.beginPath(); ctx.moveTo(0, 148); ctx.lineTo(W, 142); ctx.stroke();
  var swy = Math.round(Math.sin(G.time / 420) * 2);
  var lcols = ["#efe6d2", "#3fb8af", "#e8b04b", "#a3504f"];
  for (var lc = 0; lc < 8; lc++){
    ctx.fillStyle = lcols[lc % 4];
    ctx.fillRect(40 + lc * (W - 90) / 8 + (lc % 2 === 0 ? swy : -swy), 144, 14, 16);
  }
  // the cobbled floor and the waiting folk the net protects
  ctx.fillStyle = "#2c211a"; ctx.fillRect(0, A.floorY + 18, W, H - A.floorY - 18);
  ctx.fillStyle = "rgba(255,255,255,.05)";
  for (var cb = 0; cb < W; cb += 26){ ctx.fillRect(cb, A.floorY + 26, 13, 2); }
  for (var p = 0; p < 9; p++){
    var px = 30 + p * (W - 60) / 9, ph = tileHash(p, 7) % 5;
    ctx.fillStyle = ["#8a6a4c","#5b7f9e","#a3504f","#7a9e5b","#cfc8b8"][p % 5];
    ctx.fillRect(px, A.floorY + 34 - ph, 14, 22 + ph);
    ctx.fillStyle = "#e8c39e"; ctx.fillRect(px + 3, A.floorY + 26 - ph, 8, 8);
  }
  // falling items
  for (var i = 0; i < A.items.length; i++){
    var it = A.items[i];
    if (it.type === "grievance"){
      var flut = Math.sin(A.elapsed / 160 + it.phase) * 3;
      ctx.fillStyle = "#cfc8c0"; ctx.fillRect(it.x + flut, it.y, it.w, it.h);
      ctx.fillStyle = "rgba(60,60,70,.6)";
      ctx.fillRect(it.x + flut + 3, it.y + 4, it.w - 6, 2);
      ctx.fillRect(it.x + flut + 3, it.y + 9, it.w - 6, 2);
      ctx.fillRect(it.x + flut + 3, it.y + 14, it.w - 9, 2);
      ctx.fillStyle = "#a3504f"; ctx.fillRect(it.x + flut + it.w - 7, it.y + it.h - 6, 5, 4);
    } else if (it.type === "urgent"){
      var pulse = Math.floor(A.elapsed / 180) % 2 === 0;
      ctx.fillStyle = pulse ? "#e25549" : "#a83a32";
      ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.fillStyle = "#efe6d2";
      ctx.fillRect(it.x + it.w/2 - 2, it.y + 3, 4, it.h - 6);
      ctx.fillRect(it.x + 3, it.y + it.h/2 - 2, it.w - 6, 4);
    } else if (it.type === "bread"){
      ctx.fillStyle = "#caa06a"; ctx.fillRect(it.x, it.y + 4, it.w, it.h - 6);
      ctx.fillStyle = "#e8b04b"; ctx.fillRect(it.x + 2, it.y + 2, it.w - 4, 6);
      ctx.fillStyle = "rgba(0,0,0,.15)";
      ctx.fillRect(it.x + 4, it.y + 6, 2, it.h - 10); ctx.fillRect(it.x + it.w - 7, it.y + 6, 2, it.h - 10);
    } else if (it.type === "med"){
      ctx.fillStyle = "#efe6d2"; ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.fillStyle = "#3fb8af";
      ctx.fillRect(it.x + it.w/2 - 2, it.y + 3, 4, it.h - 6);
      ctx.fillRect(it.x + 3, it.y + it.h/2 - 2, it.w - 6, 4);
    } else {
      ctx.fillStyle = "#8a5a3c"; ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.fillStyle = "#5c3a25"; ctx.fillRect(it.x, it.y + it.h/2 - 2, it.w, 4);
      ctx.fillStyle = "#e8d8bc"; ctx.fillRect(it.x + it.w/2 - 2, it.y, 4, it.h);
    }
  }
  // the net: two poles and the woven mesh between
  var N = A.net;
  var flash = N.flash > 0 && Math.floor(N.flash / 90) % 2 === 0;
  ctx.fillStyle = flash ? "#e25549" : "#5c4632";
  ctx.fillRect(N.x - 4, N.y - 14, 4, 28); ctx.fillRect(N.x + N.w, N.y - 14, 4, 28);
  ctx.strokeStyle = flash ? "rgba(226,85,73,.9)" : "rgba(232,216,188,.85)";
  ctx.beginPath(); ctx.moveTo(N.x, N.y - 10);
  ctx.quadraticCurveTo(N.x + N.w/2, N.y + N.h + 6, N.x + N.w, N.y - 10); ctx.stroke();
  for (var mx = 1; mx < 5; mx++){
    ctx.beginPath();
    ctx.moveTo(N.x + (N.w/5) * mx, N.y - 10);
    ctx.lineTo(N.x + N.w/2 + (mx - 2.5) * 8, N.y + N.h + 2);
    ctx.stroke();
  }
  // hustle readiness pip on the left pole
  ctx.fillStyle = N.cooldown <= 0 ? "#3fb8af" : "rgba(63,184,175,.25)";
  ctx.fillRect(N.x - 4, N.y - 20, 4, 4);
  // floating feedback
  ctx.textAlign = "center"; ctx.font = "8px 'Press Start 2P', monospace";
  for (var f = 0; f < A.fx.length; f++){
    var x = A.fx[f];
    ctx.fillStyle = x.bad ? "#e25549" : "#7fe5b0";
    ctx.globalAlpha = Math.min(1, x.t / 500);
    ctx.fillText(x.text, x.x, x.y);
    ctx.globalAlpha = 1;
  }
  // the shift HUD
  ctx.textAlign = "left"; ctx.fillStyle = "#e8d8bc";
  ctx.fillText("NEEDS " + A.hits, 14, 18);
  ctx.fillText("STREAK x" + A.combo, 14, 34);
  ctx.textAlign = "right";
  ctx.fillText("SHIFT " + (A.wave + 1) + "/" + A.cfg.waves.length, W - 14, 18);
  ctx.fillText(Math.floor(A.elapsed / 1000) + "s", W - 14, 34);
}


function renderStack(){
  if (!ctx || !arcade) return;
  var A = arcade, W = A.W, H = A.H, cell = A.cell;
  var ox = A.originX, oy = A.originY;
  // depot concrete
  ctx.fillStyle = "#1b1f23"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#23282d"; ctx.fillRect(0, 0, W, 84);
  ctx.fillStyle = "#7a3b2e"; ctx.fillRect(0, 80, W, 4);
  // faint slab grid on the back wall
  ctx.strokeStyle = "rgba(255,255,255,.03)";
  for (var gx = 0; gx < W; gx += 32){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, 84); ctx.stroke(); }
  // the loading floor frame, oxide red
  ctx.strokeStyle = "#7a3b2e"; ctx.lineWidth = 4;
  ctx.strokeRect(ox - 4, oy - 4, A.fieldW + 8, A.fieldH + 8);
  ctx.lineWidth = 1;
  // cell guide lines
  ctx.strokeStyle = "rgba(255,255,255,.05)";
  for (var c = 0; c <= A.cols; c++){ ctx.beginPath(); ctx.moveTo(ox + c * cell, oy); ctx.lineTo(ox + c * cell, oy + A.fieldH); ctx.stroke(); }
  for (var r = 0; r <= A.rows; r++){ ctx.beginPath(); ctx.moveTo(ox, oy + r * cell); ctx.lineTo(ox + A.fieldW, oy + r * cell); ctx.stroke(); }

  function crate(px, py, type){
    var face = type === "steel" ? "#8a9099" : type === "grain" ? "#caa14b" : type === "fuel" ? "#3f8f8a" : "#d2603a";
    var dark = type === "steel" ? "#5d636b" : type === "grain" ? "#8f6f2e" : type === "fuel" ? "#266360" : "#9c3f23";
    ctx.fillStyle = dark; ctx.fillRect(px + 1, py + 1, cell - 2, cell - 2);
    ctx.fillStyle = face; ctx.fillRect(px + 3, py + 3, cell - 6, cell - 6);
    ctx.strokeStyle = "rgba(0,0,0,.35)";
    ctx.beginPath(); ctx.moveTo(px + 3, py + 3); ctx.lineTo(px + cell - 3, py + cell - 3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px + cell - 3, py + 3); ctx.lineTo(px + 3, py + cell - 3); ctx.stroke();
  }

  // settled crates
  for (var rr = 0; rr < A.rows; rr++){
    for (var cc = 0; cc < A.cols; cc++){
      var g = A.grid[rr][cc];
      if (g) crate(ox + cc * cell, oy + rr * cell, g.type);
    }
  }
  // landing ghost for the active column
  if (A.active){
    var lr = -1;
    for (var rg = A.rows - 1; rg >= 0; rg--){ if (!A.grid[rg][A.active.col]){ lr = rg; break; } }
    if (lr >= 0){
      ctx.fillStyle = "rgba(210,96,58,.16)";
      ctx.fillRect(ox + A.active.col * cell + 1, oy + lr * cell + 1, cell - 2, cell - 2);
    }
    // the falling crate
    crate(ox + A.active.col * cell, Math.round(A.active.y), A.active.type);
  }
  // loader rail
  ctx.fillStyle = "#3a2018"; ctx.fillRect(ox - 4, oy + A.fieldH + 6, A.fieldW + 8, 8);

  // floating feedback
  ctx.textAlign = "center"; ctx.font = "8px 'Press Start 2P', monospace";
  for (var ffi = 0; ffi < A.fx.length; ffi++){
    var x = A.fx[ffi];
    ctx.fillStyle = x.bad ? "#e25549" : "#7fe5b0";
    ctx.globalAlpha = Math.min(1, x.t / 500);
    ctx.fillText(x.text, x.x, x.y);
    ctx.globalAlpha = 1;
  }
  // HUD
  ctx.textAlign = "left"; ctx.fillStyle = "#e8d8bc";
  ctx.fillText("QUOTA " + A.hits, 14, 22);
  ctx.fillText("STREAK x" + A.combo, 14, 40);
  ctx.textAlign = "right";
  ctx.fillText("PLAN YR " + (A.wave + 1) + "/" + A.cfg.waves.length, W - 14, 22);
  ctx.fillText(Math.floor(A.elapsed / 1000) + "s", W - 14, 40);
}

function renderArcade(){
  if (arcade && arcade.kind === "stack"){ renderStack(); return; }
  if (arcade && arcade.kind === "joust"){ renderJoust(); return; }
  if (arcade && arcade.kind === "sea"){ renderSea(); return; }
  if (arcade && arcade.kind === "lander"){ renderLander(); return; }
  if (arcade && arcade.kind === "catch"){ if (arcade.cfg.skin === "gather") renderCatchGather(); else renderCatchNet(); return; }
  if (arcade && arcade.cfg.skin === "dispatch") renderArcadeDispatch();
  else renderArcadeTerminal();
}

function drawStar(cx, cy, r){
  ctx.beginPath();
  for (var i=0;i<10;i++){
    var ang = -Math.PI/2 + i*Math.PI/5;
    var rad = (i%2===0)? r : r*0.45;
    ctx.lineTo(cx+Math.cos(ang)*rad, cy+Math.sin(ang)*rad);
  }
  ctx.closePath(); ctx.fill();
}

/* ---------- Feudal ground tiles ---------- */
function drawFeudalGround(c, x, y, sx, sy){
  var h = tileHash(x, y);
  ctx.fillStyle = ((x + y) % 2 === 0) ? CUR.palette.g1 : CUR.palette.g2;
  ctx.fillRect(sx, sy, TILE, TILE);
  if (c === "T"){
    ctx.fillStyle = "#1c2e1a"; ctx.fillRect(sx + 3, sy + 7, TILE - 6, TILE - 9);
    ctx.fillStyle = "#2f4a26"; ctx.fillRect(sx + 6, sy + 2, TILE - 12, TILE - 12);
    ctx.fillStyle = "#3f6130"; ctx.fillRect(sx + 9, sy + 5, TILE - 18, TILE - 18);
    ctx.fillStyle = "#3a2a18"; ctx.fillRect(sx + TILE / 2 - 2, sy + TILE - 8, 4, 8);
  } else if (c === "F"){
    ctx.fillStyle = "#2f4a63"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#3f6486"; ctx.fillRect(sx + 2, sy + (h % 2 ? 4 : 8), TILE - 4, 4);
    ctx.fillStyle = "#5a86a8"; ctx.fillRect(sx + 4, sy + (h % 3 ? 14 : 18), TILE - 10, 3);
  } else if (c === "C"){
    ctx.fillStyle = "#5b5048"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#6e6258"; ctx.fillRect(sx + 2, sy + 2, TILE - 4, 12);
    ctx.fillStyle = "#4a423a"; ctx.fillRect(sx + 2, sy + 15, TILE - 4, 13);
    ctx.fillStyle = "#3a342e"; ctx.fillRect(sx, sy + 13, TILE, 2);
  } else if (c === "="){
    ctx.fillStyle = "#736253"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#85735f"; ctx.fillRect(sx + 1, sy + 1, TILE - 2, 13);
    ctx.fillStyle = "#5e5044"; ctx.fillRect(sx + 1, sy + 16, TILE - 2, 13);
  } else if (c === "f"){
    ctx.fillStyle = "#5a4326"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#6e5430";
    for (var fr = 2; fr < TILE; fr += 6){ ctx.fillRect(sx + 2, sy + fr, TILE - 4, 3); }
    if (h % 4 === 0){ ctx.fillStyle = "#caa23f"; ctx.fillRect(sx + TILE / 2 - 1, sy + 6, 2, TILE - 10); }
  } else if (c === ","){
    ctx.fillStyle = "#3f5a2c"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#4d6b34"; ctx.fillRect(sx + (h % 3) * 4, sy + 4, 3, 5); ctx.fillRect(sx + 12 + (h % 2) * 5, sy + 14, 3, 5);
    ctx.fillStyle = "#5f8040"; ctx.fillRect(sx + 20, sy + 8, 3, 5);
  } else if (c === "p"){
    ctx.fillStyle = "#6a5a40"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#7d6c4e";
    if (h % 2) ctx.fillRect(sx + 4, sy + 6, 6, 4);
    if (h % 3) ctx.fillRect(sx + 16, sy + 18, 7, 4);
    ctx.fillStyle = "#574a36"; ctx.fillRect(sx + 10, sy + 12, 4, 3);
  } else {
    ctx.fillStyle = "#384a2a"; ctx.fillRect(sx, sy, TILE, TILE);
    if (h % 2){ ctx.fillStyle = "#42562f"; ctx.fillRect(sx + 6, sy + 8, 5, 4); }
    if (h % 3 === 0){ ctx.fillStyle = "#33432a"; ctx.fillRect(sx + 18, sy + 16, 5, 4); }
  }
}

/* ---------- Feudal building facades ---------- */
BUILDING_ART.castleF = function(b, bx, by, bw, bh){
  ctx.fillStyle = "#8f8a82"; ctx.fillRect(bx, by + 12, bw, bh - 12);
  ctx.fillStyle = "#7c776f"; ctx.fillRect(bx, by + 12, bw, 4);
  // crenellations
  ctx.fillStyle = "#6f6a62";
  for (var cx = bx; cx < bx + bw; cx += 14){ ctx.fillRect(cx, by + 4, 8, 9); }
  // two flanking towers
  ctx.fillStyle = "#7c776f"; ctx.fillRect(bx - 4, by, 14, bh); ctx.fillRect(bx + bw - 10, by, 14, bh);
  ctx.fillStyle = "#6f6a62";
  ctx.fillRect(bx - 4, by - 4, 6, 6); ctx.fillRect(bx + 4, by - 4, 6, 6);
  ctx.fillRect(bx + bw - 10, by - 4, 6, 6); ctx.fillRect(bx + bw - 2, by - 4, 6, 6);
  // banners, heraldic red
  ctx.fillStyle = "#9a2f2a"; ctx.fillRect(bx + 6, by + 18, 6, 16); ctx.fillRect(bx + bw - 12, by + 18, 6, 16);
  ctx.fillStyle = "#e8b04b"; ctx.fillRect(bx + 8, by + 22, 2, 8); ctx.fillRect(bx + bw - 10, by + 22, 2, 8);
  // arrow slits
  ctx.fillStyle = "#2a2620";
  for (var wx = bx + 16; wx < bx + bw - 16; wx += 20){ ctx.fillRect(wx, by + 26, 4, 12); }
};
BUILDING_ART.abbeyF = function(b, bx, by, bw, bh){
  ctx.fillStyle = "#cabf9f"; ctx.fillRect(bx, by + 12, bw, bh - 12);
  ctx.fillStyle = "#8a7f5e"; ctx.fillRect(bx - 2, by + 6, bw + 4, 10);
  // a steep gable and a cross
  ctx.fillStyle = "#8a7f5e";
  ctx.beginPath(); ctx.moveTo(bx + bw / 2, by - 10); ctx.lineTo(bx + bw / 2 - 14, by + 8); ctx.lineTo(bx + bw / 2 + 14, by + 8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#e8d9a8"; ctx.fillRect(bx + bw / 2 - 1, by - 18, 2, 9); ctx.fillRect(bx + bw / 2 - 4, by - 15, 8, 2);
  // tall arched windows
  ctx.fillStyle = "#5b6a8e";
  for (var wx = bx + 12; wx < bx + bw - 12; wx += 18){ ctx.fillRect(wx, by + 22, 9, 16); }
  ctx.fillStyle = "#cabf9f";
  for (var w2 = bx + 12; w2 < bx + bw - 12; w2 += 18){ ctx.fillRect(w2 + 4, by + 22, 1, 16); }
};
BUILDING_ART.fieldsF = function(b, bx, by, bw, bh){
  // a timber tithe barn over the strips
  ctx.fillStyle = "#9a7b3c"; ctx.fillRect(bx, by + 12, bw, bh - 12);
  ctx.fillStyle = "#6e5424"; ctx.fillRect(bx - 3, by + 4, bw + 6, 12);
  ctx.fillStyle = "#4f3c1a";
  ctx.beginPath(); ctx.moveTo(bx - 3, by + 6); ctx.lineTo(bx + bw / 2, by - 8); ctx.lineTo(bx + bw + 3, by + 6); ctx.closePath(); ctx.fill();
  // timber cross bracing
  ctx.strokeStyle = "#5b4524"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(bx + 6, by + bh - 2); ctx.lineTo(bx + 18, by + 16);
  ctx.moveTo(bx + bw - 6, by + bh - 2); ctx.lineTo(bx + bw - 18, by + 16);
  ctx.stroke(); ctx.lineWidth = 1;
  // a big barn door
  ctx.fillStyle = "#3a2c14"; ctx.fillRect(bx + bw / 2 - 8, by + bh - 16, 16, 16);
};
BUILDING_ART.millF = function(b, bx, by, bw, bh){
  ctx.fillStyle = "#7a6448"; ctx.fillRect(bx, by + 12, bw, bh - 12);
  ctx.fillStyle = "#4f4030"; ctx.fillRect(bx - 2, by + 6, bw + 4, 10);
  // a turning water wheel on the stream side
  var spin = G.time / 600;
  var cxw = bx - 2, cyw = by + bh - 12, r = 11;
  ctx.fillStyle = "#5b4a32"; ctx.beginPath(); ctx.arc(cxw, cyw, r, 0, 7); ctx.fill();
  ctx.strokeStyle = "#3a2f20"; ctx.lineWidth = 2;
  for (var k = 0; k < 6; k++){
    var a = spin + k * 1.047;
    ctx.beginPath(); ctx.moveTo(cxw, cyw);
    ctx.lineTo(cxw + Math.cos(a) * r, cyw + Math.sin(a) * r); ctx.stroke();
  }
  ctx.lineWidth = 1;
  ctx.fillStyle = "#2a2018"; ctx.fillRect(bx + bw / 2 - 4, by + 22, 8, bh - 24);
};
BUILDING_ART.alchemistF = function(b, bx, by, bw, bh){
  // a narrow stone tower with a conical roof and a furnace glow
  ctx.fillStyle = "#5b4a6e"; ctx.fillRect(bx + 2, by + 8, bw - 4, bh - 8);
  ctx.fillStyle = "#3a2f4a";
  ctx.beginPath(); ctx.moveTo(bx + bw / 2, by - 14); ctx.lineTo(bx + 2, by + 10); ctx.lineTo(bx + bw - 2, by + 10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#e8b04b"; ctx.fillRect(bx + bw / 2 - 1, by - 18, 2, 5);
  // a glowing furnace window that flickers
  var glow = Math.floor(G.time / 350) % 2 === 0;
  ctx.fillStyle = glow ? "#e8843a" : "#a8521e"; ctx.fillRect(bx + bw / 2 - 4, by + bh - 14, 8, 8);
  ctx.fillStyle = "#2a2030";
  ctx.fillRect(bx + 6, by + 16, 5, 6); ctx.fillRect(bx + bw - 11, by + 16, 5, 6);
};
BUILDING_ART.scriptoriumF = function(b, bx, by, bw, bh){
  ctx.fillStyle = "#6e5a8e"; ctx.fillRect(bx, by + 12, bw, bh - 12);
  ctx.fillStyle = "#46395c"; ctx.fillRect(bx - 2, by + 6, bw + 4, 10);
  // a cloister arcade of arches
  ctx.fillStyle = "#2a2438";
  for (var wx = bx + 8; wx < bx + bw - 8; wx += 16){ ctx.fillRect(wx, by + 22, 10, 16); }
  ctx.fillStyle = "#9a86bf";
  for (var a2 = bx + 8; a2 < bx + bw - 8; a2 += 16){ ctx.fillRect(a2, by + 20, 10, 3); }
  // a quill weather vane
  ctx.fillStyle = "#e8d9a8"; ctx.fillRect(bx + bw / 2 - 1, by - 8, 2, 8);
  ctx.fillStyle = "#cfc0e6"; ctx.fillRect(bx + bw / 2 + 1, by - 10, 7, 3);
};

  ctx.fillStyle = "#6b4a2e"; ctx.fillRect(px + (face > 0 ? p.w - 2 : -6), py + 9 + bobp, 8, 7);

/* ---------- Sheaves: gather grain in kind ---------- */
function drawSheaves(cam){
  if (!G.sheaves) return;
  for (var i = 0; i < G.sheaves.length; i++){
    var s = G.sheaves[i];
    if (s.taken) continue;
    var sx = s.tx * TILE - cam.x, sy = s.ty * TILE - cam.y;
    if (sx < -TILE || sy < -TILE || sx > VIEW_W || sy > VIEW_H) continue;
    var bob = Math.sin((G.time + s.tx * 90) / 360) * 1.5;
    ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(sx + 8, sy + 24, 16, 4);
    ctx.fillStyle = "#d9a93f"; ctx.fillRect(sx + 10, sy + 8 + bob, 12, 16);
    ctx.fillStyle = "#c08f2e"; ctx.fillRect(sx + 10, sy + 15 + bob, 12, 3);
    ctx.fillStyle = "#e8c66a";
    ctx.fillRect(sx + 11, sy + 4 + bob, 3, 6); ctx.fillRect(sx + 15, sy + 2 + bob, 3, 8); ctx.fillRect(sx + 19, sy + 4 + bob, 3, 6);
  }
}
function updateSheaves(){
  if (!G.sheaves) return;
  var p = G.player;
  var cx = Math.floor((p.x + p.w / 2) / TILE), cy = Math.floor((p.y + p.h / 2) / TILE);
  for (var i = 0; i < G.sheaves.length; i++){
    var s = G.sheaves[i];
    if (!s.taken && cx === s.tx && cy === s.ty){
      s.taken = true;
      G.grain = (G.grain || 0) + 1;
      G.runPoints += GRAIN_PTS;
      if (!G.firstSheaf){
        G.firstSheaf = true;
        toast("You gather a sheaf in kind. GRAIN is the manor's coin.<br>Render a share up to the lord and a tithe to the abbey.", 4200);
      } else {
        toast("A sheaf gathered. GRAIN " + G.grain + ".");
      }
      refreshHUD();
    }
  }
}
function resetFeudal(){
  G.grain = 0;
  G.lordRendered = false;
  G.titheRendered = false;
  G.protected = false;
  G.plagueArrived = false;
  G.handMillRisk = 0;
  G.firstSheaf = false;
  G.alchemistFed = 0;
  G.sheaves = CHF_SHEAVES.map(function(s){ return { tx: s.tx, ty: s.ty, taken: false }; });
}

/* ---------- The feudal lesson room ----------
   The castle and the abbey fold a rendering of dues into the
   visit. The fields gather grain out on the map, so they have
   no render step. The question and insight reuse pickLesson. */
function buildFeudalLessonRoom(b){
  var L = LESSONS[b.id];
  var room = el("div", "room");
  room.appendChild(el("div", "place", b.name));
  room.appendChild(el("div", "host", L.host));
  room.appendChild(el("div", "speech", L.speech));

  // the render step at the keep and the abbey
  if (b.id === "castle" || b.id === "abbey"){
    var rendered = (b.id === "castle") ? G.lordRendered : G.titheRendered;
    var need = (b.id === "castle") ? 3 : 1;
    var rv = el("div", "verdict");
    if (rendered){
      rv.style.display = "block";
      rv.innerHTML = (b.id === "castle")
        ? "The lord's share is rendered. His protection covers the manor, and the bailiff and the forest grow quiet."
        : "The tithe is rendered to the abbey. A tenth given, and the alms door stays open.";
    }
    var rbtn = el("button", "choice", (b.id === "castle")
      ? "Render the lord's share  (give " + need + " grain, +" + RENDER_PTS + " favor, and gain his protection)"
      : "Render the tithe  (give " + need + " grain, +" + TITHE_PTS + " favor)");
    if (rendered){ rbtn.disabled = true; rbtn.style.opacity = .4; }
    rbtn.addEventListener("click", function(){
      if ((b.id === "castle" && G.lordRendered) || (b.id === "abbey" && G.titheRendered)) return;
      if ((G.grain || 0) < need){
        rv.style.display = "block"; rv.classList.add("bad");
        rv.innerHTML = "You owe the render, but you hold only " + (G.grain || 0) + " grain. Ride down to the fields and gather " + need + " sheaves first.";
        return;
      }
      G.grain -= need;
      rv.style.display = "block"; rv.classList.remove("bad");
      if (b.id === "castle"){
        G.lordRendered = true; G.protected = true; G.runPoints += RENDER_PTS;
        rv.innerHTML = "Rendered. Service up, protection down. The bailiff eases and the brigands keep their distance. +" + RENDER_PTS + " favor.";
      } else {
        G.titheRendered = true; G.runPoints += TITHE_PTS;
        rv.innerHTML = "A tenth given to the abbey, in kind. The alms door stays open through the winter. +" + TITHE_PTS + " favor.";
      }
      rbtn.disabled = true; rbtn.style.opacity = .4;
      refreshHUD();
    });
    room.appendChild(rbtn);
    room.appendChild(rv);
  }

  // the insight question, identical machinery to buildLessonRoom
  if (G.insights[b.id]){
    var card0 = el("div", "insight-card");
    card0.style.display = "block";
    card0.appendChild(el("div", "ic-title", L.insight.title));
    card0.appendChild(el("div", "ic-body", L.insight.body));
    room.appendChild(card0);
    var back0 = el("button", "btn ghost", "BACK TO THE REALM");
    back0.addEventListener("click", closeInterior);
    room.appendChild(back0);
    interiorInner.appendChild(room);
    return;
  }

  room.appendChild(el("div", "question", L.question));
  var verdict = el("div", "verdict");
  var card = el("div", "insight-card");
  card.appendChild(el("div", "ic-title", L.insight.title));
  card.appendChild(el("div", "ic-body", L.insight.body));
  var back = el("button", "btn ghost", "BACK TO THE REALM");
  back.addEventListener("click", closeInterior);
  back.style.display = "none";

  var btns = [];
  L.choices.forEach(function(c, i){
    var btn = el("button", "choice", String.fromCharCode(65 + i) + ".  " + c.t);
    btn.addEventListener("click", function(){ pickLesson(b.id, i); });
    btns.push(btn);
    room.appendChild(btn);
  });
  room.appendChild(verdict);
  room.appendChild(card);
  room.appendChild(back);
  interiorInner.appendChild(room);

  room._verdict = verdict; room._card = card; room._back = back; room._btns = btns;
  panelInterior._room = room;
}

/* ---------- The Lord's Mill: a recurring cut on every harvest ----------
   By custom the lord owns the mill, and milling there costs a share
   of the grain, the multure. A hidden hand mill keeps the grain, but
   the bailiff smashes any quern he finds. Evasion has a rising cost. */
function buildMillRoom(b){
  var room = el("div", "room temptation");
  room.appendChild(el("div", "place", b.name));
  room.appendChild(el("div", "host", "MILLER COB"));
  room.appendChild(el("div", "speech",
    "By the lord's right, all grain is ground here, and the stone takes its share. The multure, we call the cut. You can grind at home on a hand quern, but the bailiff breaks every one he finds."));
  var verdict = el("div", "verdict");

  var lawful = el("button", "choice", "Grind at the lord's mill  (give 1 grain as multure, +6 favor, lawful)");
  lawful.addEventListener("click", function(){
    if ((G.grain || 0) < 1){
      verdict.style.display = "block"; verdict.classList.add("bad");
      verdict.innerHTML = "No grain to grind. Ride down to the fields and gather a sheaf first.";
      return;
    }
    G.grain -= 1; G.runPoints += 6;
    verdict.style.display = "block"; verdict.classList.remove("bad");
    verdict.innerHTML = "Ground at the lord's stone. The multure is the price of his monopoly on the mill. +6 favor, and 1 grain to the cut.";
    refreshHUD();
  });

  var dodge = el("button", "choice", "Use the hidden hand mill  (keep your grain, +10 favor, but risk the bailiff)");
  dodge.addEventListener("click", function(){
    G.handMillRisk = (G.handMillRisk || 0) + 1;
    verdict.style.display = "block";
    if (G.handMillRisk >= 3){
      G.handMillRisk = 0;
      G.runPoints = Math.max(0, G.runPoints - 15);
      G.protected = false;
      verdict.classList.add("bad");
      verdict.innerHTML = "The bailiff found the quern and smashed it on the doorstep. Minus 15 favor, and the lord's protection is withdrawn. The lord's milling right is not a suggestion.";
    } else {
      G.runPoints += 10;
      verdict.classList.remove("bad");
      verdict.innerHTML = "Ground in secret, the cut kept for yourself. +10 favor. But word travels, and the bailiff is counting. Push your luck and the quern gets broken.";
    }
    refreshHUD();
  });

  var back = el("button", "btn ghost", "BACK TO THE REALM");
  back.addEventListener("click", closeInterior);
  room.appendChild(lawful); room.appendChild(dodge); room.appendChild(verdict); room.appendChild(back);
  interiorInner.appendChild(room);
}

/* ---------- The Alchemist Tower: a loss chasing sink ----------
   Feed grain to the furnace chasing gold that almost never comes.
   The eccentric host always promises the next batch is the one. */
var ALCHEMIST_LINES = [
  "Nothing yet, but the proportions were so close. The next batch, surely.",
  "Bah! The mercury was impure. Feed it again, the gold is nearly born.",
  "So near! I saw a glimmer in the crucible. One more and we are rich.",
  "The stars were wrong this hour. Again, again, fortune favors the persistent."
];
function buildAlchemistRoom(b){
  var room = el("div", "room temptation");
  room.appendChild(el("div", "place", b.name));
  room.appendChild(el("div", "host", "THE ALCHEMIST"));
  room.appendChild(el("div", "speech",
    "Gold from grain, knight! The great work is almost done. Each feeding of the furnace costs but a little, and the reward, oh, the reward is beyond counting. Will you feed it?"));
  var verdict = el("div", "verdict");

  var feed = el("button", "choice", "Feed the furnace  (10 favor in, chasing the gold)");
  feed.addEventListener("click", function(){
    if (G.runPoints < 10){
      verdict.style.display = "block"; verdict.classList.add("bad");
      verdict.innerHTML = "You have not the favor to feed it. The furnace eats before it ever gives.";
      return;
    }
    G.runPoints -= 10;
    G.alchemistFed = (G.alchemistFed || 0) + 1;
    verdict.style.display = "block";
    if (rng() < 0.12){
      G.runPoints += 25;
      verdict.classList.remove("bad");
      verdict.innerHTML = "A glint of true gold in the crucible! +25 favor. The alchemist weeps with joy and reaches for more grain. This is how the sink keeps you feeding it.";
    } else {
      verdict.classList.add("bad");
      var line = ALCHEMIST_LINES[(G.alchemistFed - 1) % ALCHEMIST_LINES.length];
      verdict.innerHTML = "Minus 10 favor, and only ash. " + line;
    }
    refreshHUD();
  });

  var back = el("button", "btn ghost", "BACK TO THE REALM");
  back.addEventListener("click", closeInterior);
  room.appendChild(feed); room.appendChild(verdict); room.appendChild(back);
  interiorInner.appendChild(room);
}

/* ---------- Feudal street decor renderer ---------- */
function drawFeudalDecor(d, sx, sy){
  if (d.kind === "marketcross"){
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(sx + 6, sy + 24, 20, 5);
    ctx.fillStyle = "#8a7f6a"; ctx.fillRect(sx + 12, sy - 18, 8, 44);
    ctx.fillStyle = "#9a8f78"; ctx.fillRect(sx + 4, sy - 22, 24, 7);
    ctx.fillStyle = "#73685a"; ctx.fillRect(sx + 4, sy + 22, 24, 6);
    ctx.fillStyle = "#e8d9a8"; ctx.fillRect(sx + 15, sy - 30, 2, 9); ctx.fillRect(sx + 11, sy - 27, 10, 2);
  } else if (d.kind === "well"){
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(sx + 4, sy + 18, 22, 5);
    ctx.fillStyle = "#5b5048"; ctx.fillRect(sx + 4, sy + 6, 22, 14);
    ctx.fillStyle = "#3a342e"; ctx.fillRect(sx + 8, sy + 9, 14, 8);
    ctx.fillStyle = "#6e5424"; ctx.fillRect(sx + 6, sy - 8, 3, 16); ctx.fillRect(sx + 21, sy - 8, 3, 16);
    ctx.fillStyle = "#4f4030"; ctx.fillRect(sx + 4, sy - 10, 22, 4);
  } else if (d.kind === "haystack"){
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(sx + 2, sy + 20, 24, 5);
    ctx.fillStyle = "#caa23f"; ctx.fillRect(sx + 4, sy + 8, 20, 14);
    ctx.fillStyle = "#b3892c";
    ctx.beginPath(); ctx.moveTo(sx + 2, sy + 9); ctx.lineTo(sx + 14, sy - 4); ctx.lineTo(sx + 26, sy + 9); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#9a7320"; ctx.fillRect(sx + 4, sy + 14, 20, 2);
  } else if (d.kind === "cross"){
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx + 8, sy + 20, 14, 4);
    ctx.fillStyle = "#cabf9f"; ctx.fillRect(sx + 13, sy - 12, 4, 34);
    ctx.fillStyle = "#cabf9f"; ctx.fillRect(sx + 7, sy - 4, 16, 4);
  } else if (d.kind === "torch"){
    ctx.fillStyle = "#3a2f20"; ctx.fillRect(sx + 13, sy - 6, 3, 20);
    var fl = Math.floor(G.time / 220) % 2 === 0;
    ctx.fillStyle = fl ? "#e8843a" : "#e8b04b";
    ctx.fillRect(sx + 11, sy - 12, 7, 7);
    ctx.fillStyle = "#f2d28a"; ctx.fillRect(sx + 13, sy - 10, 3, 3);
  } else if (d.kind === "furrow"){
    ctx.fillStyle = "#5a4326"; ctx.fillRect(sx, sy + 6, TILE, 16);
    ctx.fillStyle = "#6e5430";
    ctx.fillRect(sx + 2, sy + 8, TILE - 4, 2); ctx.fillRect(sx + 2, sy + 13, TILE - 4, 2); ctx.fillRect(sx + 2, sy + 18, TILE - 4, 2);
  } else if (d.kind === "cart"){
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(sx+2, sy+22, 26, 4);
    ctx.fillStyle = "#6e5430"; ctx.fillRect(sx+2, sy+8, 24, 10);
    ctx.fillStyle = "#5a4326"; ctx.fillRect(sx+2, sy+8, 24, 3);
    ctx.fillStyle = "#caa23f"; ctx.fillRect(sx+5, sy+4, 16, 5);
    ctx.fillStyle = "#4f3c22"; ctx.fillRect(sx+22, sy+12, 8, 3);
    ctx.fillStyle = "#3a2f20"; ctx.beginPath(); ctx.arc(sx+8, sy+20, 5, 0, 7); ctx.fill();
    ctx.fillStyle = "#5b4a32"; ctx.beginPath(); ctx.arc(sx+8, sy+20, 2, 0, 7); ctx.fill();
  } else if (d.kind === "woodpile"){
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(sx+2, sy+20, 24, 4);
    for (var wl = 0; wl < 3; wl++){
      var wy = sy + 16 - wl*6;
      ctx.fillStyle = wl % 2 ? "#6e5430" : "#7a6038"; ctx.fillRect(sx+3, wy, 22, 6);
      ctx.fillStyle = "#caa06a"; ctx.fillRect(sx+4, wy+1, 3, 4); ctx.fillRect(sx+12, wy+1, 3, 4); ctx.fillRect(sx+20, wy+1, 3, 4);
    }
  } else if (d.kind === "fence"){
    ctx.fillStyle = "#5a4326";
    for (var fp = 0; fp < 4; fp++){ ctx.fillRect(sx + 2 + fp*8, sy+6, 3, 16); }
    ctx.fillStyle = "#6e5430"; ctx.fillRect(sx+2, sy+10, TILE-4, 3); ctx.fillRect(sx+2, sy+16, TILE-4, 3);
  } else if (d.kind === "beehive"){
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx+6, sy+22, 16, 3);
    ctx.fillStyle = "#caa23f"; ctx.fillRect(sx+7, sy+14, 14, 8);
    ctx.fillStyle = "#b3892c"; ctx.fillRect(sx+9, sy+9, 10, 6);
    ctx.fillStyle = "#9a7320"; ctx.fillRect(sx+12, sy+5, 4, 5);
    ctx.fillStyle = "#2a2018"; ctx.fillRect(sx+12, sy+19, 4, 3);
    var bz = Math.floor(G.time/120) % 4;
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + 14 + Math.round(Math.cos(bz*1.6)*8), sy + 8 + Math.round(Math.sin(bz*1.6)*5), 2, 2);
  } else if (d.kind === "trough"){
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx+2, sy+20, 24, 4);
    ctx.fillStyle = "#5a4326"; ctx.fillRect(sx+2, sy+12, 24, 10);
    ctx.fillStyle = "#3f6486"; ctx.fillRect(sx+4, sy+14, 20, 4);
    var rp = Math.floor(G.time/400) % 2;
    ctx.fillStyle = "rgba(200,225,250,.6)"; ctx.fillRect(sx+6+rp*3, sy+15, 4, 2);
    ctx.fillStyle = "#4f3c22"; ctx.fillRect(sx+2, sy+12, 3, 10); ctx.fillRect(sx+23, sy+12, 3, 10);
  } else if (d.kind === "scarecrow"){
    var sw = Math.round(Math.sin(G.time/600) * 2);
    ctx.fillStyle = "#4f3c22"; ctx.fillRect(sx+13, sy-6, 3, 28);
    ctx.fillStyle = "#6e5430"; ctx.fillRect(sx+3+sw, sy+2, 22, 3);
    ctx.fillStyle = "#7a6f8e"; ctx.fillRect(sx+9+sw, sy+2, 10, 12);
    ctx.fillStyle = "#caa23f"; ctx.fillRect(sx+11+sw, sy-6, 6, 7);
    ctx.fillStyle = "#9a7320"; ctx.fillRect(sx+9+sw, sy-8, 10, 3);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx+12+sw, sy-3, 2, 2); ctx.fillRect(sx+15+sw, sy-3, 2, 2);
  } else if (d.kind === "plow"){
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx+2, sy+20, 22, 4);
    ctx.fillStyle = "#5a4326"; ctx.fillRect(sx+4, sy+6, 4, 16);
    ctx.fillStyle = "#6e5430"; ctx.fillRect(sx+4, sy+18, 18, 4);
    ctx.fillStyle = "#8a8e96"; ctx.beginPath(); ctx.moveTo(sx+20, sy+18); ctx.lineTo(sx+28, sy+22); ctx.lineTo(sx+20, sy+24); ctx.closePath(); ctx.fill();
  } else if (d.kind === "barrelpair"){
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(sx+2, sy+22, 24, 4);
    for (var bp = 0; bp < 2; bp++){
      var bxo = sx + 3 + bp*13;
      ctx.fillStyle = "#6e5430"; ctx.fillRect(bxo, sy+8, 11, 16);
      ctx.fillStyle = "#4f3c22"; ctx.fillRect(bxo, sy+11, 11, 2); ctx.fillRect(bxo, sy+19, 11, 2);
      ctx.fillStyle = "#7a6038"; ctx.fillRect(bxo+2, sy+8, 7, 16);
    }
  }
}

function drawStoneAgeGround(c, x, y, sx, sy){
  // forest floor: earthy duff with scattered undergrowth
  ctx.fillStyle = ((x + y) % 2 === 0) ? CUR.palette.g1 : CUR.palette.g2;
  ctx.fillRect(sx, sy, TILE, TILE);
  var h = (x * 7 + y * 13) % 5;
  if (c === "." && h === 0){
    ctx.fillStyle = "rgba(90,110,54,.35)";
    ctx.fillRect(sx + 6, sy + 20, 4, 6); ctx.fillRect(sx + 18, sy + 22, 4, 5);
  } else if (c === "." && h === 2){
    ctx.fillStyle = "rgba(120,90,60,.30)";
    ctx.fillRect(sx + 10, sy + 12, 3, 3); ctx.fillRect(sx + 20, sy + 24, 3, 3);
  }
  if (c === "~"){
    ctx.fillStyle = "#2f4f59"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#3a606c"; ctx.fillRect(sx, sy + 4, TILE, TILE - 8);
    var rp = Math.floor((G.time / 320) + x + y) % 3;
    ctx.fillStyle = "rgba(180,214,224,.30)";
    ctx.fillRect(sx + 2 + rp * 4, sy + 8, 10, 2);
    ctx.fillRect(sx + 14 - rp * 3, sy + 20, 9, 2);
    ctx.fillStyle = "rgba(13,10,18,.18)"; ctx.fillRect(sx, sy, TILE, 2);
  } else if (c === "T"){
    // a layered forest tree, gently swaying, with a touch of variety per tile
    var vary = (x * 5 + y * 3) % 3;
    var sway = Math.round(Math.sin(G.time / 900 + x * 0.6 + y * 0.4) * 1.5);
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(sx + 6, sy + TILE - 5, TILE - 12, 4);
    ctx.fillStyle = "#5c4326"; ctx.fillRect(sx + TILE / 2 - 2, sy + 16, 4, TILE - 16);
    var c1 = vary === 0 ? "#2f4a24" : vary === 1 ? "#36531f" : "#2a4420";
    var c2 = vary === 0 ? "#3f6a2e" : vary === 1 ? "#4a7328" : "#3a6428";
    var c3 = "#5a8a3c";
    ctx.fillStyle = c1; ctx.fillRect(sx + 3 + sway, sy + 8, TILE - 6, 14);
    ctx.fillStyle = c2; ctx.fillRect(sx + 5 + sway, sy + 3, TILE - 10, 12);
    ctx.fillStyle = c3; ctx.fillRect(sx + 8 + sway, sy + 1, TILE - 16, 8);
    ctx.fillStyle = "rgba(180,210,120,.18)"; ctx.fillRect(sx + 9 + sway, sy + 2, 5, 4);
  } else if (c === "F"){
    // a standing stone: the gate marker, a forest menhir
    ctx.fillStyle = "rgba(0,0,0,.24)"; ctx.fillRect(sx + 4, sy + TILE - 6, TILE - 8, 5);
    ctx.fillStyle = "#7d7264"; ctx.fillRect(sx + 7, sy + 1, TILE - 14, TILE - 4);
    ctx.fillStyle = "#938778"; ctx.fillRect(sx + 9, sy + 3, TILE - 20, TILE - 11);
    ctx.fillStyle = "#5f564b"; ctx.fillRect(sx + 12, sy + 8, 4, 11);
    ctx.fillStyle = "#6e8a4a"; ctx.fillRect(sx + 7, sy + 1, TILE - 14, 3);
  } else if (c === "C"){
    // a mossy boulder
    ctx.fillStyle = "#6a5f52"; ctx.fillRect(sx + 5, sy + 8, TILE - 10, TILE - 12);
    ctx.fillStyle = "#807565"; ctx.fillRect(sx + 8, sy + 6, TILE - 18, TILE - 16);
    ctx.fillStyle = "#4a6a30"; ctx.fillRect(sx + 6, sy + 8, 6, 4); ctx.fillRect(sx + TILE - 12, sy + 14, 5, 4);
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(sx + 6, sy + TILE - 7, TILE - 12, 3);
  }
}

      if (wing){ ctx.fillRect(bx - 3, by - 2, 3, 5); ctx.fillRect(bx + 2, by - 2, 3, 5); }
      else { ctx.fillRect(bx - 2, by - 1, 2, 3); ctx.fillRect(bx + 2, by - 1, 2, 3); }
      ctx.fillStyle = "#3a2a1a"; ctx.fillRect(bx, by - 2, 1, 5);
    }
  } else if (d.kind === "leaffall"){
    // a few leaves drifting down under the canopy
    for (var li = 0; li < 4; li++){
      var lt = (G.time / 2600 + li * 0.27) % 1;
      var lx = sx + 4 + li * 7 + Math.sin(lt * 6.28 + li) * 5;
      var ly = sy - 16 + lt * 44;
      ctx.fillStyle = ["#caa14b", "#b5662f", "#9a8a3c", "#c98a4a"][li % 4];
      ctx.fillRect(lx, ly, 3, 3);
    }
  } else if (d.kind === "birdtree"){
    // a little bird hopping on a branch, chirping flick now and then
    var hop = Math.floor(G.time / 500) % 2 === 0 ? 0 : 2;
    ctx.fillStyle = "#5c4326"; ctx.fillRect(sx, sy + 10, 26, 3);
    ctx.fillStyle = "#6a86a0"; ctx.fillRect(sx + 10, sy + 3 - hop, 7, 6);
    ctx.fillStyle = "#a8c0d4"; ctx.fillRect(sx + 11, sy + 4 - hop, 3, 2);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + 16, sy + 5 - hop, 3, 2);
    ctx.fillStyle = "#3a2a1a"; ctx.fillRect(sx + 12, sy + 9 - hop, 1, 2); ctx.fillRect(sx + 15, sy + 9 - hop, 1, 2);
  }
}

function drawStoneAgeCritter(c, sx, sy){
  var f = c.flip < 0 ? -1 : 1;          // facing
  var hb = Math.abs(Math.sin(G.time / 220 + (c.hx || 0)));   // a hop or bob phase
  if (c.kind === "rabbit"){
    var hop = Math.round(hb * 5);
    ctx.fillStyle = "rgba(0,0,0,.20)"; ctx.fillRect(sx, sy + 12, 12, 3);
    ctx.fillStyle = "#a89274"; ctx.fillRect(sx + 1, sy + 4 - hop, 10, 8);
    ctx.fillStyle = "#c4b196"; ctx.fillRect(sx + (f > 0 ? 8 : 1), sy + 2 - hop, 4, 6);
    ctx.fillStyle = "#8a7458"; ctx.fillRect(sx + (f > 0 ? 8 : 1), sy - 3 - hop, 2, 6); ctx.fillStyle = "#8a7458"; ctx.fillRect(sx + (f > 0 ? 11 : 4), sy - 3 - hop, 2, 6);
    ctx.fillStyle = "#f2e8d5"; ctx.fillRect(sx + (f > 0 ? 1 : 9), sy + 9 - hop, 3, 3);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? 9 : 2), sy + 4 - hop, 1, 1);
  } else if (c.kind === "fox"){
    var tr = Math.round(Math.sin(G.time / 160 + sx) * 1.5);
    ctx.fillStyle = "rgba(0,0,0,.20)"; ctx.fillRect(sx, sy + 13, 18, 3);
    ctx.fillStyle = "#c2622a"; ctx.fillRect(sx + 2, sy + 5, 13, 8);
    ctx.fillStyle = "#c2622a"; ctx.fillRect(sx + (f > 0 ? 12 : 0), sy + 3, 6, 7);
    ctx.fillStyle = "#7a3a18"; ctx.fillRect(sx + (f > 0 ? 13 : 1), sy, 2, 4); ctx.fillRect(sx + (f > 0 ? 16 : 3), sy, 2, 4);
    ctx.fillStyle = "#f2e8d5"; ctx.fillRect(sx + (f > 0 ? 16 : -2), sy + 6, 3, 4);
    ctx.fillStyle = "#e8d2b0"; ctx.fillRect(sx + (f > 0 ? -3 : 15), sy + 6, 6, 4);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? 14 : 2), sy + 5, 1, 1);
    ctx.fillStyle = "#3a2218"; ctx.fillRect(sx + 4, sy + 12 + tr, 2, 3); ctx.fillRect(sx + 10, sy + 12 - tr, 2, 3);
  } else if (c.kind === "squirrel"){
    var dart = Math.round(hb * 3);
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(sx + 2, sy + 12, 9, 2);
    ctx.fillStyle = "#8a6a44"; ctx.fillRect(sx + 3, sy + 5 - dart, 7, 7);
    ctx.fillStyle = "#a3835a"; ctx.fillRect(sx + (f > 0 ? 8 : 2), sy + 3 - dart, 4, 4);
    // the big bushy tail
    ctx.fillStyle = "#6e5436"; ctx.fillRect(sx + (f > 0 ? -3 : 9), sy - 2 - dart, 5, 12);
    ctx.fillStyle = "#8a6a44"; ctx.fillRect(sx + (f > 0 ? -2 : 10), sy - 1 - dart, 3, 9);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? 10 : 4), sy + 4 - dart, 1, 1);
  } else if (c.kind === "deer" || c.kind === "fawn"){
    var big = c.kind === "deer";
    var bw = big ? 18 : 13, bh = big ? 11 : 8, lg = big ? 8 : 6;
    var graze = Math.floor(G.time / 800 + sx) % 4 === 0 ? 4 : 0;
    ctx.fillStyle = "rgba(0,0,0,.20)"; ctx.fillRect(sx, sy + 13 + lg, bw, 3);
    ctx.fillStyle = big ? "#9a7048" : "#b58a5c"; ctx.fillRect(sx + 2, sy + 6, bw, bh);
    // legs
    ctx.fillStyle = "#6e4e30";
    ctx.fillRect(sx + 4, sy + 6 + bh, 2, lg); ctx.fillRect(sx + bw - 2, sy + 6 + bh, 2, lg);
    // neck and head, dipping to graze
    ctx.fillStyle = big ? "#9a7048" : "#b58a5c";
    ctx.fillRect(sx + (f > 0 ? bw - 2 : 0), sy + 2 + graze, 5, 8);
    ctx.fillRect(sx + (f > 0 ? bw + 1 : -3), sy + 4 + graze, 5, 5);
    if (!big){ ctx.fillStyle = "#f2e8d5"; ctx.fillRect(sx + 5, sy + 8, 2, 2); ctx.fillRect(sx + 10, sy + 9, 2, 2); }
    if (big){ ctx.fillStyle = "#6e4e30"; ctx.fillRect(sx + (f > 0 ? bw + 2 : -4), sy - 2 + graze, 1, 6); ctx.fillRect(sx + (f > 0 ? bw + 5 : -1), sy - 2 + graze, 1, 6); }
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? bw + 2 : -2), sy + 5 + graze, 1, 1);
  } else if (c.kind === "hedgehog"){
    var wad = Math.floor(G.time / 300) % 2;
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(sx + 1, sy + 11, 12, 2);
    ctx.fillStyle = "#4a3826"; ctx.fillRect(sx + 1, sy + 4 + wad, 11, 7);
    ctx.fillStyle = "#6e5436";
    for (var s = 0; s < 6; s++){ ctx.fillRect(sx + 1 + s * 2, sy + 2 + wad, 2, 4); }
    ctx.fillStyle = "#caa07a"; ctx.fillRect(sx + (f > 0 ? 10 : 0), sy + 6 + wad, 4, 4);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? 12 : 1), sy + 7 + wad, 1, 1);
  } else if (c.kind === "boar"){
    var sn = Math.floor(G.time / 260) % 2;
    ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(sx, sy + 13, 18, 3);
    ctx.fillStyle = "#544334"; ctx.fillRect(sx + 2, sy + 5, 14, 9);
    ctx.fillStyle = "#3f3127"; ctx.fillRect(sx + 4, sy + 3, 9, 4);
    ctx.fillStyle = "#544334"; ctx.fillRect(sx + (f > 0 ? 14 : -2), sy + 7 + sn, 5, 6);
    ctx.fillStyle = "#2a2018"; ctx.fillRect(sx + (f > 0 ? 18 : -3), sy + 9 + sn, 2, 3);
    ctx.fillStyle = "#e8e0d0"; ctx.fillRect(sx + (f > 0 ? 17 : 0), sy + 12 + sn, 2, 2);
    ctx.fillStyle = "#3f3127";
    ctx.fillRect(sx + 4, sy + 13, 2, 3); ctx.fillRect(sx + 12, sy + 13, 2, 3);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? 13 : 3), sy + 6, 1, 1);
  } else {
    // a small ground bird, as a gentle fallback
    var pk = Math.floor(G.time / 420) % 3 === 0 ? 2 : 0;
    ctx.fillStyle = "#7a8474"; ctx.fillRect(sx, sy + 4, 10, 7);
    ctx.fillStyle = "#9aa68a"; ctx.fillRect(sx + (f > 0 ? 8 : -2), sy + pk, 5, 5);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + (f > 0 ? 13 : -4), sy + 2 + pk, 3, 2);
  }
}

function renderCatchGather(){
  if (!ctx || !arcade) return;
  var A = arcade, W = A.W, H = A.H;
  ctx.fillStyle = "#4a3a3e"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#6a523c"; ctx.fillRect(0, 60, W, 44);
  ctx.fillStyle = "#566a36"; ctx.fillRect(0, 100, W, A.floorY - 100);
  ctx.fillStyle = "#4c5f30";
  for (var g = 0; g < W; g += 26){ ctx.fillRect(g, 100, 13, A.floorY - 100); }
  ctx.fillStyle = "#6e6258";
  ctx.fillRect(60, 150, 26, 18); ctx.fillRect(W - 120, 208, 30, 20); ctx.fillRect(W / 2 - 14, 128, 22, 16);
  ctx.fillStyle = "#36505f"; ctx.fillRect(0, A.floorY, W, H - A.floorY);
  ctx.fillStyle = "#456678";
  var rp = Math.floor(A.elapsed / 280) % 5;
  for (var rx = -rp * 8; rx < W; rx += 44){ ctx.fillRect(rx, A.floorY + 12, 24, 4); ctx.fillRect(rx + 16, A.floorY + 30, 18, 4); }
  ctx.strokeStyle = "rgba(226,85,73,.45)"; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(0, A.floorY + 0.5); ctx.lineTo(W, A.floorY + 0.5); ctx.stroke(); ctx.setLineDash([]);
  ctx.textAlign = "right"; ctx.font = "8px 'Press Start 2P', monospace";
  ctx.fillStyle = "rgba(226,85,73,.55)"; ctx.fillText("THE RIVER", W - 10, A.floorY - 6);
  ctx.textAlign = "left"; ctx.fillStyle = "#f2e0c4";
  ctx.fillText("FINDS " + A.hits, 14, 20);
  ctx.fillStyle = A.combo >= A.cfg.comboEvery ? "#e8b04b" : "#d8c19a";
  ctx.fillText("STREAK x" + A.combo, 14, 36);
  ctx.textAlign = "right"; ctx.fillStyle = "#f2e0c4";
  ctx.fillText("GATHER " + (A.wave + 1) + "/" + A.cfg.waves.length, W - 14, 20);
  ctx.fillText(Math.floor(A.elapsed / 1000) + "s", W - 14, 36);
  for (var i = 0; i < A.items.length; i++){
    var it = A.items[i];
    if (it.type === "grievance"){
      ctx.fillStyle = "#5a4326"; ctx.fillRect(it.x + it.w / 2 - 2, it.y, 4, it.h);
      ctx.fillStyle = "#3f5128";
      ctx.fillRect(it.x, it.y + 4, it.w, 3); ctx.fillRect(it.x + 2, it.y + it.h - 6, it.w - 4, 3);
      ctx.fillStyle = "#2e3a1f";
      ctx.fillRect(it.x - 2, it.y + 2, 4, 2); ctx.fillRect(it.x + it.w - 2, it.y + 8, 4, 2);
    } else if (it.type === "urgent"){
      var sp = Math.floor(A.elapsed / 160) % 2 === 0;
      ctx.fillStyle = "#8a8f7c";
      ctx.beginPath(); ctx.moveTo(it.x + it.w / 2, it.y); ctx.lineTo(it.x + it.w, it.y + it.h);
      ctx.lineTo(it.x, it.y + it.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#b8bcae"; ctx.fillRect(it.x + it.w / 2 - 1, it.y + 3, 3, it.h - 6);
      if (sp){ ctx.fillStyle = "#f2e8d5"; ctx.fillRect(it.x + it.w / 2 + 2, it.y + 4, 2, 2); }
    } else if (it.type === "bread"){
      ctx.fillStyle = "#a3324a"; ctx.fillRect(it.x + 2, it.y + 4, 6, 6); ctx.fillRect(it.x + 10, it.y + 6, 6, 6);
      ctx.fillStyle = "#c14b63"; ctx.fillRect(it.x + 4, it.y + 6, 3, 3); ctx.fillRect(it.x + 12, it.y + 8, 3, 3);
      ctx.fillStyle = "#3f5128"; ctx.fillRect(it.x + 7, it.y, 4, 5);
    } else if (it.type === "med"){
      ctx.fillStyle = "#5b7f9e"; ctx.fillRect(it.x, it.y + 5, it.w - 4, it.h - 8);
      ctx.fillRect(it.x + it.w - 5, it.y + 3, 5, it.h - 4);
      ctx.fillStyle = "#cfe2ef"; ctx.fillRect(it.x + 3, it.y + 7, 3, 3);
      ctx.fillStyle = "#3a5a6e"; ctx.fillRect(it.x + 2, it.y + 8, 2, 2);
    } else {
      ctx.fillStyle = "#a3683a"; ctx.fillRect(it.x + 2, it.y + 3, it.w - 4, it.h - 4);
      ctx.fillStyle = "#c98a4a"; ctx.fillRect(it.x + 4, it.y + 5, 4, 4);
      ctx.fillStyle = "#5a6e3a"; ctx.fillRect(it.x + it.w / 2 - 1, it.y, 3, 4);
    }
  }
  var N = A.net;
  var flash = N.flash > 0 && Math.floor(N.flash / 90) % 2 === 0;
  var nx = N.x, ny = N.y;
  ctx.fillStyle = flash ? "#e25549" : "#7a5a32";
  ctx.fillRect(nx, ny - 4, N.w, N.h + 6);
  ctx.fillStyle = flash ? "#e25549" : "#9a7a44";
  for (var wv = nx + 3; wv < nx + N.w - 2; wv += 8){ ctx.fillRect(wv, ny - 4, 3, N.h + 6); }
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(nx, ny - 4, N.w, 3);
  ctx.fillStyle = "#7a4a2e"; ctx.fillRect(nx + N.w / 2 - 7, ny - 22, 14, 18);
  ctx.fillStyle = "#c08f5a"; ctx.fillRect(nx + N.w / 2 - 5, ny - 30, 10, 9);
  ctx.fillStyle = "#3a2a1a"; ctx.fillRect(nx + N.w / 2 - 5, ny - 32, 10, 4);
  ctx.fillStyle = N.cooldown <= 0 ? "#e8b04b" : "rgba(232,176,75,.25)";
  ctx.fillRect(nx + N.w / 2 - 2, ny - 36, 4, 4);
  ctx.textAlign = "center"; ctx.font = "8px 'Press Start 2P', monospace";
  for (var f = 0; f < A.fx.length; f++){
    var fxi = A.fx[f];
    ctx.fillStyle = fxi.bad ? "#e25549" : "#e8d28a";
    ctx.globalAlpha = Math.min(1, fxi.t / 500);
    ctx.fillText(fxi.text, fxi.x, fxi.y);
    ctx.globalAlpha = 1;
  }
}

function buildCacheRoom(b){
  var room = el("div", "room temptation");
  room.appendChild(el("div", "place", b.name));
  room.appendChild(el("div", "host", "OUT OF SIGHT OF THE FIRE"));
  room.appendChild(el("div", "speech",
    "Away from the hearth you could stash a little of your catch, only for yourself. It feels like a gain. But out here there is no granary and no bank. The sharing circle is the only savings there is, and a lone hoard answers to no one when the lean season comes."));
  var verdict = el("div", "verdict");

  var share = el("button", "choice", "Add your surplus to the hearth share  (plus 8, builds the circle)");
  share.addEventListener("click", function(){
    if (room._done) return;
    room._done = true;
    G.runPoints += 8;
    verdict.style.display = "block"; verdict.classList.remove("bad");
    verdict.innerHTML = "Into the common share it goes. The circle is your savings account, and you just paid in. The day your own hunt fails, it pays you back. Plus 8.";
    refreshHUD();
  });

  var hoard = el("button", "choice", "Stash a private cache  (a gamble: it may hold, it may not)");
  hoard.addEventListener("click", function(){
    if (room._done) return;
    if (G.runPoints < 6){
      verdict.style.display = "block"; verdict.classList.add("bad");
      verdict.innerHTML = "You have too little put by to set any aside. The cache stays empty.";
      return;
    }
    room._done = true;
    var holds = rng() < 0.5;
    verdict.style.display = "block";
    if (holds){
      G.runPoints += 12;
      verdict.classList.remove("bad");
      verdict.innerHTML = "The cache held this time. Plus 12. But a lone stash has no one behind it, and luck is not a savings plan. The circle would have been the surer bet.";
    } else {
      G.runPoints = Math.max(0, G.runPoints - 6);
      verdict.classList.add("bad");
      verdict.innerHTML = "Damp, mice, or a neighbor's quiet hand, and the stash is gone. Minus 6. Outside the sharing circle there is nothing to fall back on. Where there is no bank, sharing is the bank.";
    }
    refreshHUD();
  });

  var back = el("button", "btn ghost", "BACK TO THE VALLEY");
  back.addEventListener("click", closeInterior);
  room.appendChild(share); room.appendChild(hoard); room.appendChild(verdict); room.appendChild(back);
  interiorInner.appendChild(room);
}

BUILDING_ART.farbank0 = function(b, bx, by, bw, bh){
  // a large tree house across the water: thick trunk, a platform hut, a ladder
  ctx.fillStyle = "rgba(0,0,0,.28)"; ctx.fillRect(bx + bw / 2 - 12, by + bh - 5, 24, 5);
  // canopy behind
  ctx.fillStyle = "#2f4a24"; ctx.fillRect(bx - 2, by - 22, bw + 4, 22);
  ctx.fillStyle = "#3f6a2e"; ctx.fillRect(bx + 4, by - 28, bw - 8, 16);
  // trunk
  ctx.fillStyle = "#5c4326"; ctx.fillRect(bx + bw / 2 - 7, by + 6, 14, bh - 6);
  ctx.fillStyle = "#4a3420"; ctx.fillRect(bx + bw / 2 - 7, by + 6, 4, bh - 6);
  // the platform
  ctx.fillStyle = "#6e5436"; ctx.fillRect(bx + 4, by + 2, bw - 8, 6);
  ctx.fillStyle = "#5c4326"; for (var pl = bx + 6; pl < bx + bw - 6; pl += 7){ ctx.fillRect(pl, by + 2, 1, 6); }
  // the hide hut on the platform
  ctx.fillStyle = "#a8784e"; ctx.fillRect(bx + 12, by - 14, bw - 24, 16);
  ctx.fillStyle = "#8a6038";
  ctx.beginPath(); ctx.moveTo(bx + 8, by - 12); ctx.lineTo(bx + bw / 2, by - 24);
  ctx.lineTo(bx + bw - 8, by - 12); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#3a2418"; ctx.fillRect(bx + bw / 2 - 4, by - 8, 8, 10);
  // a little pennant that sways
  var pf = Math.round(Math.sin(G.time / 300) * 2);
  ctx.fillStyle = "#b5402f"; ctx.fillRect(bx + bw / 2 + 1, by - 30, 6 + pf, 4);
  ctx.fillStyle = "#6e5436"; ctx.fillRect(bx + bw / 2, by - 30, 1, 8);
  // the rope ladder
  ctx.strokeStyle = "#8a6a44"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(bx + bw / 2 - 3, by + 8); ctx.lineTo(bx + bw / 2 - 3, by + bh); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(bx + bw / 2 + 3, by + 8); ctx.lineTo(bx + bw / 2 + 3, by + bh); ctx.stroke();
  for (var rg = by + 12; rg < by + bh; rg += 6){ ctx.beginPath(); ctx.moveTo(bx + bw / 2 - 3, rg); ctx.lineTo(bx + bw / 2 + 3, rg); ctx.stroke(); }
};

/* ---------- The living sea: ground ---------- */
function drawPirateGround(c, x, y, sx, sy){
  if (c === "."){
    // open water: layered swell with a slow current and a wandering glint
    var base = ((x + y) % 2 === 0) ? "#15506a" : "#13495f";
    ctx.fillStyle = base; ctx.fillRect(sx, sy, TILE, TILE);
    var sw = Math.sin((x * 0.7 + y * 0.5) + G.time / 900);
    ctx.fillStyle = sw > 0.2 ? "rgba(90,170,196,.16)" : "rgba(10,40,56,.18)";
    ctx.fillRect(sx, sy + 8 + Math.round(sw * 3), TILE, 8);
    // drifting crest streaks, scrolling with the current
    var roll = (G.time / 36 + x * 11 + y * 7) % 64;
    ctx.fillStyle = "rgba(150,205,224,.18)";
    ctx.fillRect(sx + ((roll) % TILE), sy + 5, 9, 2);
    ctx.fillRect(sx + ((roll + 18) % TILE), sy + 22, 7, 2);
    // an occasional sun glint that twinkles per tile
    if ((x * 5 + y * 3) % 7 === 0){
      var tw = Math.floor(G.time / 240 + x + y) % 4;
      if (tw === 0){ ctx.fillStyle = "rgba(232,210,150,.30)"; ctx.fillRect(sx + 12, sy + 12, 4, 3); }
    }
  } else if (c === "T"){
    // a reef rock with white surf breaking around its base
    ctx.fillStyle = "#11465c"; ctx.fillRect(sx, sy, TILE, TILE);
    var surf = Math.floor(G.time / 300 + x + y) % 3;
    ctx.fillStyle = "rgba(214,238,245,.55)";
    ctx.fillRect(sx + 2 - surf, sy + TILE - 9, TILE - 4 + surf, 4);
    ctx.fillRect(sx + 4, sy + 4, 4 + surf, 3);
    ctx.fillStyle = "#3a4750"; ctx.fillRect(sx + 5, sy + 7, TILE - 12, TILE - 14);
    ctx.fillStyle = "#54626b"; ctx.fillRect(sx + 8, sy + 5, TILE - 18, TILE - 16);
    ctx.fillStyle = "#2b353c"; ctx.fillRect(sx + 11, sy + 12, 5, 6);
    ctx.fillStyle = "rgba(120,160,90,.5)"; ctx.fillRect(sx + 9, sy + 7, 5, 3);
  } else if (c === "C"){
    // a sandbar shoal: pale turquoise shallows over sand
    ctx.fillStyle = "#15506a"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#2f8a96"; ctx.fillRect(sx + 2, sy + 4, TILE - 4, TILE - 8);
    ctx.fillStyle = "#caa66a"; ctx.fillRect(sx + 6, sy + 9, TILE - 12, TILE - 16);
    ctx.fillStyle = "#dcc089"; ctx.fillRect(sx + 9, sy + 11, TILE - 18, 5);
    var rp = Math.floor(G.time / 360 + x) % 2;
    ctx.fillStyle = "rgba(214,238,245,.4)"; ctx.fillRect(sx + 3 + rp * 3, sy + 5, 8, 2);
  } else {
    // any other glyph: plain deep water
    ctx.fillStyle = "#123f54"; ctx.fillRect(sx, sy, TILE, TILE);
  }
}

/* ---------- Sea decor: ambient candy on the water ---------- */
function drawPirateDecor(d, sx, sy){
  if (d.kind === "buoy"){
    var bob = Math.round(Math.sin(G.time / 520 + sx) * 3);
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(sx + 8, sy + 22, 14, 4);
    ctx.fillStyle = "#c23a2a"; ctx.fillRect(sx + 10, sy + 6 + bob, 10, 14);
    ctx.fillStyle = "#e8e0d0"; ctx.fillRect(sx + 10, sy + 11 + bob, 10, 4);
    ctx.fillStyle = "#2a2a30"; ctx.fillRect(sx + 13, sy + 1 + bob, 4, 6);
    var lit = Math.floor(G.time / 600) % 2 === 0;
    ctx.fillStyle = lit ? "#ffe9b0" : "#7a6a40"; ctx.fillRect(sx + 13, sy - 1 + bob, 4, 3);
    ctx.fillStyle = "rgba(214,238,245,.4)"; ctx.fillRect(sx + 6, sy + 20, 20, 2);
  } else if (d.kind === "flotsam"){
    var fb = Math.round(Math.sin(G.time / 600 + sy) * 2);
    ctx.fillStyle = "rgba(214,238,245,.28)"; ctx.fillRect(sx + 4, sy + 18 + fb, 26, 2);
    ctx.fillStyle = "#6e5436"; ctx.fillRect(sx + 6, sy + 12 + fb, 18, 6);
    ctx.fillStyle = "#5c4326"; ctx.fillRect(sx + 6, sy + 12 + fb, 18, 2);
    ctx.fillStyle = "#8a6a44"; ctx.fillRect(sx + 20, sy + 9 + fb, 8, 4);
  } else if (d.kind === "longboat"){
    var lb = Math.round(Math.sin(G.time / 700) * 2);
    ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fillRect(sx, sy + 20 + lb, 40, 4);
    ctx.fillStyle = "#5c4326"; ctx.fillRect(sx + 2, sy + 10 + lb, 36, 9);
    ctx.fillStyle = "#7a5a36"; ctx.fillRect(sx + 4, sy + 10 + lb, 32, 3);
    ctx.fillStyle = "#3a2c18"; ctx.fillRect(sx + 8, sy + 13 + lb, 4, 4); ctx.fillRect(sx + 28, sy + 13 + lb, 4, 4);
    // a slow oar dip
    var oar = Math.round(Math.sin(G.time / 400) * 3);
    ctx.fillStyle = "#8a6a44"; ctx.fillRect(sx + 14, sy + 6 + lb, 3, 8 + oar);
  } else if (d.kind === "whirlpool"){
    var spin = G.time / 320;
    ctx.fillStyle = "rgba(10,40,56,.4)"; ctx.beginPath(); ctx.arc(sx + 16, sy + 14, 14, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(150,205,224,.5)"; ctx.lineWidth = 2;
    for (var a = 0; a < 3; a++){
      ctx.beginPath();
      var r0 = 4 + a * 4;
      ctx.arc(sx + 16, sy + 14, r0, spin + a * 2, spin + a * 2 + 4.4);
      ctx.stroke();
    }
    ctx.lineWidth = 1;
    ctx.fillStyle = "rgba(10,40,56,.6)"; ctx.beginPath(); ctx.arc(sx + 16, sy + 14, 3, 0, 7); ctx.fill();
  } else if (d.kind === "kelp"){
    var ks = Math.round(Math.sin(G.time / 600 + sx) * 3);
    ctx.fillStyle = "#1f5a3a";
    ctx.fillRect(sx + 8 + ks, sy + 4, 3, 22); ctx.fillRect(sx + 16 - ks, sy + 2, 3, 24); ctx.fillRect(sx + 22 + ks, sy + 6, 3, 20);
    ctx.fillStyle = "#2f7a4a";
    ctx.fillRect(sx + 6 + ks, sy + 8, 6, 3); ctx.fillRect(sx + 18 - ks, sy + 6, 6, 3); ctx.fillRect(sx + 21 + ks, sy + 12, 6, 3);
  } else if (d.kind === "breakers"){
    // a rolling line of whitewater
    var roll = (G.time / 90) % 40;
    ctx.fillStyle = "rgba(214,238,245,.5)";
    ctx.fillRect(sx + (roll % 36), sy + 10, 12, 3);
    ctx.fillRect(sx + ((roll + 14) % 36), sy + 18, 9, 3);
    ctx.fillStyle = "rgba(214,238,245,.25)";
    ctx.fillRect(sx + ((roll + 6) % 36), sy + 14, 7, 2);
  } else if (d.kind === "seafoam"){
    for (var fi = 0; fi < 5; fi++){
      var ft = (G.time / 1800 + fi * 0.2) % 1;
      var fx = sx + 4 + fi * 6 + Math.sin(ft * 6.28 + fi) * 4;
      var fy = sy + 6 + ft * 18;
      ctx.fillStyle = "rgba(214,238,245," + (0.5 - ft * 0.4).toFixed(2) + ")";
      ctx.fillRect(fx, fy, 3, 3);
    }
  } else if (d.kind === "palmislet"){
    // a tiny uninhabited sand dot with a single palm, pure scenery
    ctx.fillStyle = "rgba(0,0,0,.14)"; ctx.fillRect(sx + 4, sy + 20, 26, 4);
    ctx.fillStyle = "#caa66a"; ctx.fillRect(sx + 5, sy + 16, 24, 7);
    ctx.fillStyle = "#dcc089"; ctx.fillRect(sx + 9, sy + 17, 16, 3);
    var lean = Math.round(Math.sin(G.time / 700) * 2);
    ctx.fillStyle = "#6e5436"; ctx.fillRect(sx + 15 + lean, sy + 4, 3, 14);
    ctx.fillStyle = "#2f7a4a";
    ctx.fillRect(sx + 9 + lean, sy + 2, 9, 3); ctx.fillRect(sx + 16 + lean, sy + 1, 9, 3); ctx.fillRect(sx + 13 + lean, sy + 5, 8, 3);
  } else if (d.kind === "raycloud"){
    // a drifting cloud shadow sliding across the water
    var drift = (G.time / 60) % 120 - 30;
    ctx.fillStyle = "rgba(8,30,44,.18)";
