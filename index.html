<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MARKET FORCES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15121c;
    --ink2:#1f1a2b;
    --paper:#f2e8d5;
    --brass:#e8b04b;
    --ticker:#43d17c;
    --panic:#e25549;
    --teal:#3fb8af;
    --shadow:rgba(0,0,0,.45);
    --display:'Press Start 2P', 'Courier New', monospace;
    --body:'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--ink);color:var(--paper);font-family:var(--body);overflow:hidden;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
  #app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1100px 760px at 50% -10%, #241c36 0%, var(--ink) 64%)}
  #stage{position:relative;width:100%;height:100%;max-width:960px;max-height:720px;display:flex;align-items:center;justify-content:center}
  @media(min-width:1000px){
    #stage{border-radius:18px;overflow:hidden;
      box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.06)}
  }
  #fx{position:absolute;inset:0;pointer-events:none;z-index:4;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.09) 0px, rgba(0,0,0,.09) 1px, transparent 2px, transparent 3px),
      radial-gradient(125% 95% at 50% 50%, transparent 58%, rgba(0,0,0,.45) 100%);
    mix-blend-mode:multiply}
  #fade{position:absolute;inset:0;pointer-events:none;z-index:40;background:#0d0a12;
    opacity:0;transition:opacity .18s ease}
  #fade.on{opacity:1}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:var(--ink);display:block;
    width:100%;height:100%;object-fit:contain}

  /* ---------- HUD ---------- */
  #hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;
    padding:10px 12px;pointer-events:none;z-index:5}
  .hud-card{background:rgba(21,18,28,.82);border:2px solid var(--brass);border-radius:6px;padding:6px 10px;
    font-family:var(--display);font-size:9px;line-height:1.7;color:var(--paper);box-shadow:0 3px 0 var(--shadow)}
  .hud-card .lbl{color:var(--brass);font-size:7px;display:block}
  #hud-stars{letter-spacing:2px}
  #hud-stars .got{color:var(--brass)} #hud-stars .miss{color:#4d445f}
  #led-rows{display:block;font-size:7px;line-height:1.5;color:#cabf9f;margin-top:3px}
  #hud-status{display:none;background:rgba(21,18,28,.82);border:2px solid var(--panic);border-radius:6px;
    padding:6px 10px;font-family:var(--display);font-size:8px;color:var(--panic)}

  /* ---------- Toast + dialogue ---------- */
  #toast{position:absolute;left:50%;top:18%;transform:translateX(-50%);background:var(--ink2);
    border:2px solid var(--teal);border-radius:8px;padding:10px 16px;font-family:var(--display);font-size:9px;
    line-height:1.8;color:var(--paper);max-width:78%;text-align:center;display:none;z-index:8;
    box-shadow:0 4px 0 var(--shadow)}
  #dialogue{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);width:min(560px,92%);
    background:rgba(21,18,28,.95);border:3px solid var(--brass);border-radius:10px;padding:14px 16px;display:none;z-index:9;
    box-shadow:0 5px 0 var(--shadow)}
  #dialogue .who{font-family:var(--display);font-size:9px;color:var(--brass);margin-bottom:8px}
  #dialogue .txt{font-size:17px;line-height:1.45}
  #dialogue .hint{font-family:var(--display);font-size:7px;color:var(--teal);margin-top:10px;text-align:right}
  #arrival{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);width:min(480px,92%);
    background:rgba(13,10,18,.92);border:1px solid rgba(255,255,255,.16);border-radius:10px;
    padding:14px 16px;z-index:22;display:none;text-align:left;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #arrival.on{display:block}
  #arrival .who{font-family:var(--display);font-size:9px;color:var(--brass);margin-bottom:8px}
  #arrival .line{font-size:15px;line-height:1.45;margin-bottom:12px;color:var(--paper)}
  #arrival .row{display:flex;gap:10px;justify-content:flex-end}
  #arrival button{font-family:var(--display);font-size:8px;padding:11px 14px;border-radius:8px;cursor:pointer;
    background:#2a2240;border:2px solid #4d445f;color:var(--paper)}
  #arrival button:active{background:#3a2f57}
  #arrival #arrival-go{border-color:var(--teal);color:var(--teal)}
  body.touch #arrival{bottom:170px}

  /* ---------- The cinematic scene stage. Milestone 7. ----------
     A full screen photo behind the dialogue or interior UI, in THE CLOSER
     tradition: the sharp image over a blurred darkened copy of itself,
     with a scrim darkening the lower third for text. Missing images fall
     back to the pixel scene, so nothing ever breaks. */
  #scene-stage{position:absolute;inset:0;z-index:5;pointer-events:none;display:none;
    background:#0d0a12;overflow:hidden}
  #scene-stage.on{display:block}
  #scene-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    transform:scale(1.12);filter:blur(26px) brightness(.5);opacity:0;transition:opacity .35s ease}
  #scene-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    opacity:0;transition:opacity .35s ease}
  @media(min-width:900px){#scene-img{object-fit:contain}}
  #scene-scrim{position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(13,10,18,0) 36%,rgba(13,10,18,.4) 66%,rgba(13,10,18,.9) 100%)}
  #scene-bg.show,#scene-img.show{opacity:1}
  body.interior-live #panel-interior{background:transparent}
  body.interior-live #panel-interior .panel-inner{background:rgba(13,10,18,.78);
    border:1px solid rgba(255,255,255,.08);border-radius:14px;backdrop-filter:blur(3px)}
  body.scene-live .panel{background:transparent}
  body.scene-live .panel-inner{background:rgba(13,10,18,.78);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;backdrop-filter:blur(3px)}
  body.scene-live #dialogue{background:rgba(13,10,18,.85)}

  /* ---------- Touch controls ---------- */
  #touch{position:absolute;inset:0;pointer-events:none;z-index:6;display:none}
  body.touch #touch{display:block}
  #dpad{position:absolute;left:14px;bottom:18px;width:140px;height:140px;pointer-events:auto}
  .dbtn{position:absolute;width:46px;height:46px;background:rgba(232,176,75,.18);border:2px solid var(--brass);
    border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--brass);
    font-family:var(--display);font-size:12px}
  .dbtn:active{background:rgba(232,176,75,.45)}
  #d-up{left:47px;top:0}#d-down{left:47px;bottom:0}#d-left{left:0;top:47px}#d-right{right:0;top:47px}
  #abtn{position:absolute;right:20px;bottom:34px;width:74px;height:74px;border-radius:50%;pointer-events:auto;
    background:rgba(63,184,175,.2);border:3px solid var(--teal);color:var(--teal);font-family:var(--display);
    font-size:11px;display:flex;align-items:center;justify-content:center}
  #abtn:active{background:rgba(63,184,175,.5)}

  /* ---------- Panels (title, interiors, etc) ---------- */
  .panel{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:20;
    background:radial-gradient(ellipse at 50% 30%, #241c36 0%, var(--ink) 70%)}
  .panel.open{display:flex}
  .panel-inner{width:min(620px,94%);max-height:94%;overflow-y:auto;text-align:center;padding:24px 18px}
  .eyebrow{font-family:var(--display);font-size:9px;color:var(--teal);letter-spacing:1px;margin-bottom:14px}
  h1.logo{font-family:var(--display);font-size:clamp(22px,6vw,40px);color:var(--brass);line-height:1.4;
    text-shadow:0 4px 0 var(--shadow);margin-bottom:8px}
  .sub{font-size:18px;color:var(--paper);opacity:.9;margin-bottom:26px;line-height:1.5}
  .btn{font-family:var(--display);font-size:11px;background:var(--brass);color:var(--ink);border:none;
    border-radius:8px;padding:16px 26px;cursor:pointer;box-shadow:0 4px 0 #8a6422;margin:6px}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a6422}
  .btn.ghost{background:transparent;color:var(--teal);border:2px solid var(--teal);box-shadow:0 4px 0 #1d5a55}
  .keys{margin-top:30px;font-family:var(--display);font-size:8px;color:#8d83a5;line-height:2}

  /* ---------- Interiors ---------- */
  #panel-interior{background:rgba(13,10,20,.92)}
  .room{background:var(--ink2);border:3px solid var(--brass);border-radius:12px;padding:22px 20px;text-align:left;
    box-shadow:0 6px 0 var(--shadow)}
  .room.temptation{border-color:var(--teal)}
  .room .place{font-family:var(--display);font-size:12px;color:var(--brass);margin-bottom:4px}
  .room.temptation .place{color:var(--teal)}
  .room .host{font-family:var(--display);font-size:8px;color:#8d83a5;margin-bottom:14px}
  .room .speech{font-size:17px;line-height:1.5;margin-bottom:18px}
  .room .question{font-family:var(--display);font-size:9px;line-height:1.8;color:var(--paper);margin-bottom:14px}
  .choice{display:block;width:100%;text-align:left;background:#2a2240;border:2px solid #4d445f;border-radius:8px;
    color:var(--paper);font-family:var(--body);font-size:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
  .choice:active{background:#3a2f57}
  .room .verdict{font-size:15px;line-height:1.5;border-left:4px solid var(--ticker);padding-left:10px;margin:8px 0 16px;display:none}
  .room .verdict.bad{border-left-color:var(--panic)}
  .insight-card{background:linear-gradient(160deg,#2c2342,#1f1a2b);border:2px solid var(--brass);border-radius:10px;
    padding:14px;margin-bottom:16px;display:none}
  .insight-card .ic-title{font-family:var(--display);font-size:9px;color:var(--brass);margin-bottom:8px}
  .insight-card .ic-body{font-size:15px;line-height:1.5}

  /* ---------- Chapter complete ---------- */
  #panel-complete{background:radial-gradient(ellipse at 50% 30%, #2c2342 0%, var(--ink) 75%)}
  .score-table{width:100%;max-width:440px;margin:0 auto 22px;border-collapse:collapse}
  .score-table td{padding:9px 6px;font-size:16px;border-bottom:1px solid #3a3152;text-align:left}
  .score-table td:last-child{text-align:right;font-family:var(--display);font-size:10px;color:var(--brass)}
  .score-table tr.total td{border-bottom:none;font-weight:700}
  .score-table tr.total td:last-child{color:var(--ticker);font-size:12px}
  .banked{font-family:var(--display);font-size:9px;color:var(--teal);line-height:2;margin-bottom:20px}

  /* ---------- The bookshelf ---------- */
  .book{background:#241d38;border:2px solid #4d445f;border-left-width:8px;border-radius:8px;
    padding:12px 14px;margin-bottom:12px;cursor:pointer;text-align:left}
  .book.for{border-left-color:var(--brass)}
  .book.against{border-left-color:var(--teal)}
  .book .b-side{font-family:var(--display);font-size:7px;letter-spacing:1px;margin-bottom:6px}
  .book.for .b-side{color:var(--brass)}
  .book.against .b-side{color:var(--teal)}
  .book .b-title{font-size:18px;font-weight:700;line-height:1.3}
  .book .b-author{font-size:14px;color:#a89cc4;margin-top:2px}
  .book .b-summary{font-size:15px;line-height:1.5;margin-top:10px;display:none}
  .book.read-open .b-summary{display:block}
  .book .b-link{display:inline-block;margin-top:10px;font-family:var(--display);font-size:8px;color:var(--ticker);
    text-decoration:none;border:2px solid var(--ticker);border-radius:6px;padding:7px 10px}
  .book .b-read{font-family:var(--display);font-size:7px;color:var(--ticker);float:right}

  /* ---------- The Decision Desk ---------- */
  #panel-desk{background:radial-gradient(ellipse at 50% 20%, #1d2a3a 0%, var(--ink) 75%)}
  .desk-room{background:var(--ink2);border:3px solid var(--brass);border-radius:12px;padding:20px 18px;text-align:left;
    box-shadow:0 6px 0 var(--shadow)}
  .desk-room .place{font-family:var(--display);font-size:12px;color:var(--brass);margin-bottom:4px}
  .desk-room .beatno{font-family:var(--display);font-size:8px;color:#8d83a5;margin-bottom:14px}
  .gauges{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-bottom:16px}
  @media (max-width:480px){ .gauges{grid-template-columns:1fr} }
  .gauge{display:grid;grid-template-columns:86px 1fr 30px 36px;align-items:center;gap:6px}
  .gauge .g-name{font-family:var(--display);font-size:7px;letter-spacing:.5px}
  .gauge .g-bar{height:12px;background:#15121c;border:1px solid #4d445f;border-radius:6px;overflow:hidden}
  .gauge .g-fill{height:100%;border-radius:5px;transition:width .5s ease}
  .gauge.low .g-fill{animation:gpulse 1s infinite}
  @keyframes gpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .gauge .g-val{font-family:var(--display);font-size:8px;text-align:right}
  .gauge .g-delta{font-family:var(--display);font-size:8px;text-align:left}
  .gauge .g-delta.up{color:var(--ticker)}
  .gauge .g-delta.down{color:var(--panic)}
  .desk-room .question{font-family:var(--display);font-size:9px;line-height:1.8;color:var(--paper);margin-bottom:14px}
  .opt-label{display:inline-block;font-family:var(--display);font-size:6px;letter-spacing:1px;color:var(--ink);
    background:var(--brass);border-radius:4px;padding:3px 6px;margin-bottom:6px}
  .desk-room .verdict{font-size:15px;line-height:1.5;border-left:4px solid var(--ticker);padding-left:10px;margin:8px 0 16px;display:none}
  .desk-room .verdict.bad{border-left-color:var(--panic)}
  .desk-room.collapsed{border-color:var(--panic)}
  .desk-room.collapsed .place{color:var(--panic)}
  .collapse-line{font-size:17px;line-height:1.55;border-left:4px solid var(--panic);padding-left:12px;margin:12px 0 18px}

  /* ---------- Free Play: the sandbox over the same desk ---------- */
  #panel-free{background:radial-gradient(ellipse at 50% 20%, #15323a 0%, var(--ink) 75%)}
  .free-room{background:var(--ink2);border:3px solid var(--teal);border-radius:12px;padding:20px 18px;text-align:left;
    box-shadow:0 6px 0 var(--shadow)}
  .free-room .place{font-family:var(--display);font-size:12px;color:var(--teal);margin-bottom:4px}
  .free-room .beatno{font-family:var(--display);font-size:8px;color:#8d83a5;margin-bottom:14px}
  .free-room .speech{font-size:16px;line-height:1.5;margin-bottom:14px}
  .free-room.collapsed{border-color:var(--panic)}
  .free-room.collapsed .place{color:var(--panic)}
  .free-note{font-family:var(--display);font-size:7px;color:#8d83a5;line-height:2;margin:10px 0 4px}
  .free-event{font-size:15px;line-height:1.5;border-left:4px solid var(--teal);padding-left:10px;margin:10px 0 14px;min-height:24px}
  .free-event.shock{border-left-color:var(--panic)}
  .lever{margin-bottom:12px}
  .lever .l-name{font-family:var(--display);font-size:8px;color:var(--paper);margin-bottom:6px}
  .lever .l-row{display:flex;gap:6px;flex-wrap:wrap}
  .lever .l-btn{font-family:var(--display);font-size:7px;color:var(--paper);background:#15121c;border:2px solid #4d445f;
    border-radius:6px;padding:8px 9px;cursor:pointer}
  .lever .l-btn.on{background:var(--teal);color:#06262b;border-color:var(--teal)}
  .free-bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

  /* ---------- The title chooser ---------- */
  #chapter-list{margin:14px 0 6px;display:flex;flex-direction:column;gap:10px;max-width:560px;margin-left:auto;margin-right:auto}
  .ch-card{background:var(--ink2);border:2px solid var(--brass);border-radius:10px;padding:12px 14px;text-align:left;
    box-shadow:0 4px 0 var(--shadow)}
  .ch-card.locked{border-color:#4d445f;opacity:.75}
  .ch-card .ch-name{font-family:var(--display);font-size:10px;color:var(--brass);margin-bottom:6px}
  .ch-card.locked .ch-name{color:#8d83a5}
  .ch-card .ch-sub{font-size:14px;line-height:1.45;color:var(--paper);margin-bottom:8px}
  .ch-card .ch-status{font-family:var(--display);font-size:7px;color:#8d83a5;line-height:1.9;margin-bottom:8px}
  .ch-card .ch-status .clr{color:var(--ticker)}
  .ch-card .ch-row{display:flex;gap:8px;flex-wrap:wrap}
  .ch-card .btn{margin:0;font-size:8px;padding:10px 12px}

  /* ---------- The Arcade: a distinct presentation ---------- */
  #panel-arcade{background:
    repeating-linear-gradient(0deg, rgba(67,209,124,.04) 0 2px, transparent 2px 4px),
    radial-gradient(ellipse at 50% 18%, #0a1f12 0%, #04090a 75%)}
  .arcade-room{background:#06120c;border:3px solid var(--ticker);border-radius:12px;padding:22px 20px;text-align:left;
    box-shadow:0 0 22px rgba(67,209,124,.25), 0 6px 0 var(--shadow)}
  .arcade-room .place{font-family:var(--display);font-size:13px;color:var(--ticker);margin-bottom:4px;
    text-shadow:0 0 8px rgba(67,209,124,.6)}
  .arcade-room .beatno{font-family:var(--display);font-size:8px;color:#5a8a6c;margin-bottom:14px}
  .arcade-room .speech{font-size:17px;line-height:1.5;margin-bottom:18px}
  .arcade-room .rules{font-family:var(--display);font-size:8px;line-height:2.2;color:#9fe0b8;margin-bottom:16px}
  .arcade-room .rules b{color:var(--ticker)}
  .btn.tick{background:var(--ticker);color:#04150b;box-shadow:0 4px 0 #1d6b41}
  .btn.tick:active{box-shadow:0 1px 0 #1d6b41}
  .arcade-room .score-table td{border-bottom-color:#1d4a31}
  .arcade-room .score-table td:last-child{color:var(--ticker)}
  .arcade-room .score-table tr.total td:last-child{color:var(--brass)}
  /* ---------- THE BRIEFING (the opening crawl). Milestone 24. ---------- */
  #panel-briefing{--bf-accent:#3fb8af;--bf-title:#e8b04b;--bf-bg1:#1a1430;--bf-bg2:#08060f;
    background:radial-gradient(ellipse at 50% 62%, var(--bf-bg1) 0%, var(--bf-bg2) 82%);overflow:hidden}
  #panel-briefing .panel-inner{width:100%;max-width:100%;height:100%;max-height:100%;padding:0;
    overflow:hidden;text-align:center;position:relative}
  .bf-sky{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
  .bf-p{position:absolute;border-radius:50%;pointer-events:none;opacity:.5}
  .bf-star{width:2px;height:2px;background:var(--paper);animation:bfTwinkle 3s ease-in-out infinite}
  .bf-warm{width:2px;height:2px;background:#e8d6a8;animation:bfTwinkle 3.4s ease-in-out infinite}
  .bf-sea{width:2px;height:2px;background:#7fe6df;animation:bfTwinkle 2.6s ease-in-out infinite}
  .bf-ember{width:3px;height:3px;background:#f0a648;box-shadow:0 0 5px #e8731f;animation:bfRise linear infinite}
  .bf-mote{width:2px;height:2px;background:#8fd9ff;box-shadow:0 0 6px #6db8ff;animation:bfRise linear infinite}
  .bf-snow{width:2px;height:2px;background:#dfe7f0;animation:bfFall linear infinite}
  .bf-ticker{width:2px;height:14px;border-radius:1px;background:linear-gradient(#43d17c,rgba(67,209,124,0));
    animation:bfFall linear infinite}
  @keyframes bfTwinkle{0%,100%{opacity:.14}50%{opacity:.66}}
  @keyframes bfRise{0%{transform:translateY(10px);opacity:0}12%{opacity:.7}100%{transform:translateY(-130px);opacity:0}}
  @keyframes bfFall{0%{transform:translateY(-16px);opacity:0}12%{opacity:.6}100%{transform:translateY(130px);opacity:0}}
  .bf-stage{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
    perspective:300px;perspective-origin:50% 0%;overflow:hidden;z-index:2}
  .bf-tilt{width:min(680px,86%);transform-origin:50% 100%;transform:rotateX(30deg)}
  .bf-crawl{width:100%;color:var(--paper);will-change:transform}
  .bf-crawl.bf-scroll{animation:bfCrawl 32s linear forwards}
  @keyframes bfCrawl{0%{transform:translateY(72vh)}100%{transform:translateY(-165%)}}
  .bf-eyebrow{font-family:var(--display);font-size:9px;letter-spacing:1px;color:var(--bf-accent);
    line-height:1.7;margin-bottom:12px}
  .bf-title{font-family:var(--display);font-size:clamp(15px,4vw,24px);line-height:1.5;color:var(--bf-title);
    text-shadow:0 3px 0 var(--shadow);margin-bottom:24px}
  .bf-body{font-size:clamp(15px,2.4vw,19px);line-height:1.7;color:var(--paper);text-align:left}
  .bf-body h4{font-family:var(--display);font-size:10px;letter-spacing:1px;color:var(--bf-accent);
    margin:22px 0 8px;text-align:center}
  .bf-body p{margin:0 0 12px}

  var mem = {};

    var k = "__mf_probe__";
    window.localStorage.setItem(k, "1");
    window.localStorage.removeItem(k);
    ok = true;
  } catch(e){ ok = false; }
  return {
    usingMemory: function(){ return !ok; },
    get: function(key, dflt){
      try {
        if (ok) {
          var v = window.localStorage.getItem(key);
          return v === null ? dflt : JSON.parse(v);
        }
      } catch(e){}
      return (key in mem) ? mem[key] : dflt;
    },
    set: function(key, val){
      mem[key] = val;
      try { if (ok) window.localStorage.setItem(key, JSON.stringify(val)); } catch(e){}
    }
  };
})();

function rebuildCollision(){
  solid = [];
  for (var y=0;y<MAP_H;y++){
    solid[y]=[];
    for (var x=0;x<MAP_W;x++){
      var c = MAP_ROWS[y][x];
      solid[y][x] = (c==="T"||c==="F"||c==="C"||c==="~") ? 1 : 0;
    }
  }
  BUILDINGS.forEach(function(b){
    for (var y=b.y; y<b.y+b.h; y++)
      for (var x=b.x; x<b.x+b.w; x++)
        solid[y][x] = 1;
    // the doorway tile itself stays solid; the trigger sits one tile below
  });
}
rebuildCollision();

function isSolid(tx,ty){
  if (tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return true;
  return solid[ty][tx]===1;
}

/* ---------- Progress: chapter completion and unlocks ----------
   Milestone 5. Key mf_progress, same Store pattern as mf_lifetime,
   so a returning player keeps Free Play and cleared chapter state
   across sessions. Short runs, permanent progress. */
var PROGRESS_KEY = "mf_progress";
var CHAPTER_ORDER = ["ch0", "chF", "ch1", "ch2", "ch3", "chP", "chV"];
function blankChapterProgress(){ return { cleared: false, clears: 0, bestDesk: 0, bestArcade: 0 }; }
function freshProgress(){
  var p = {};
  CHAPTER_ORDER.forEach(function(id){ p[id] = blankChapterProgress(); });
  return p;
}
var Progress = (function(){
  var p = Store.get(PROGRESS_KEY, null);
  if (!p) p = freshProgress();
  // older saves carry forward: any missing chapter entry is added blank
  CHAPTER_ORDER.forEach(function(id){ if (!p[id]) p[id] = blankChapterProgress(); });
  return p;
})();
function saveProgress(){ Store.set(PROGRESS_KEY, Progress); }
function markChapterCleared(deskTotal){
  var p = Progress[CHAPTER_ID];
  p.cleared = true;
  p.clears = (p.clears || 0) + 1;
  if (deskTotal && deskTotal > (p.bestDesk || 0)) p.bestDesk = deskTotal;
  saveProgress();
}
function recordArcadeBest(total){
  var p = Progress[CHAPTER_ID];
  if (total > (p.bestArcade || 0)){ p.bestArcade = total; saveProgress(); }
}
function freeUnlocked(chId){
  if (typeof chId !== "string" || !Progress[chId]) chId = CHAPTER_ID;
  return !!Progress[chId].cleared;
}
function chapterUnlocked(id){
  var ch = CHAPTERS[id];
  if (!ch) return false;
  if (Progress[id] && Progress[id].cleared) return true;
  return ch.unlock ? !!(Progress[ch.unlock] && Progress[ch.unlock].cleared) : true;
}

  if (sceneImgEl.getAttribute("src") !== src){
    sceneImgEl.classList.remove("show");

}

function spawnCritters(chId){

    return { kind: c.kind, x: c.x * TILE, y: c.y * TILE,

function updateCritters(dt){
  critters.forEach(function(c){
    var dx = c.tx - c.x, dy = c.ty - c.y;
    var d = Math.sqrt(dx*dx + dy*dy);
    if (d > 2){
      var sp = c.kind === "rat" ? 92 : c.kind === "seagull" ? 48 : c.kind === "sparrow" ? 66 : c.kind === "rabbit" ? 72 : c.kind === "squirrel" ? 82 : c.kind === "fox" ? 56 : c.kind === "deer" ? 40 : c.kind === "fawn" ? 60 : c.kind === "hedgehog" ? 18 : c.kind === "boar" ? 34 : c.kind === "cat" ? 34 : c.kind === "drone" ? 64 : c.kind === "duck" ? 26 : c.kind === "sheep" ? 16 : c.kind === "chicken" ? 24 : c.kind === "goat" ? 20 : c.kind === "goose" ? 26 : c.kind === "dog" ? 70 : c.kind === "crow" ? 40 : c.kind === "swan" ? 22 : c.kind === "robin" ? 70 : c.kind === "patroldog" ? 58 : c.kind === "paradeflock" ? 30 : c.kind === "kestrel" ? 24 : c.kind === "dolphin" ? 64 : c.kind === "gull" ? 52 : c.kind === "flyingfish" ? 88 : c.kind === "seaturtle" ? 16 : c.kind === "frigatebird" ? 30 : c.kind === "pelican" ? 38 : c.kind === "skydrone" ? 66 : c.kind === "servobot" ? 40 : c.kind === "butterdrone" ? 50 : c.kind === "robird" ? 70 : c.kind === "petbot" ? 58 : c.kind === "spheredroid" ? 30 : 52;
      c.x += dx/d * sp * dt/1000;
      c.y += dy/d * sp * dt/1000;
      c.flip = dx < 0 ? -1 : 1;
    } else {
      c.wait -= dt;
      if (c.wait <= 0){
        c.wait = 700 + Math.random() * 1800;
        var ang = Math.random() * 6.283;
        var r = TILE * (0.6 + Math.random() * 1.6);
        var nx = c.hx + Math.cos(ang) * r, ny = c.hy + Math.sin(ang) * r;
        var txi = Math.floor((nx + 4) / TILE), tyi = Math.floor((ny + 4) / TILE);
        if (!isSolid(txi, tyi)){ c.tx = nx; c.ty = ny; }
      }
    }
  });
}

}

function drawCritter(c, sx, sy){

  if (CUR.theme === "pirate") return drawPirateCritter(c, sx, sy);
  if (CUR.theme === "future") return drawVenusCritter(c, sx, sy);

    ctx.fillStyle = "#7a8494"; ctx.fillRect(sx, sy+4, 10, 7);

    ctx.fillStyle = "#3a3f48"; ctx.fillRect(sx+2, sy+11, 2, 3); ctx.fillRect(sx+6, sy+11, 2, 3);
  } else if (c.kind === "duck"){
    // a fountain duck, waddling and unbothered

    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(sx+1, sy+12, 12, 3);

  } else if (c.kind === "hedgehog"){
    // a community garden hedgehog, snuffling low with a spiky quill mantle

    else { ctx.fillRect(sx-1, ky-3, 5, 2); ctx.fillRect(sx+11, ky-3, 5, 2); }

}

/* ---------- Per chapter ground tiles. Milestone 8, Stage 1. ----------
   Each town owns its streets. Chapter 1 is the metro: concrete, asphalt,
   a glass tower skyline ringing the map. Chapter 2 is the commons: warm
   paving, tram rails, courtyard housing walls in the Red Vienna key.
   Visual only: the solid grid never changes. */
function tileHash(x, y){ return ((x * 73856093) ^ (y * 19349663)) >>> 0; }

function drawMetroGround(c, x, y, sx, sy){
  var st = CUR.streets || {};
  var road = (st.roadRows || []).indexOf(y) >= 0;
  if (road && c === "."){
    // asphalt with curbs, a faded center dash, and zebra crosswalks
    ctx.fillStyle = "#23242b"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "#3a3d47";
    ctx.fillRect(sx, sy, TILE, 2); ctx.fillRect(sx, sy + TILE - 2, TILE, 2);
    if ((st.crossAt || []).indexOf(x) >= 0){
      ctx.fillStyle = "rgba(222,222,228,.8)";
      for (var zx = sx + 2; zx < sx + TILE - 2; zx += 8){ ctx.fillRect(zx, sy + 4, 5, TILE - 8); }
    } else if (x % 2 === 0){
      ctx.fillStyle = "#b09030"; ctx.fillRect(sx + 4, sy + TILE/2 - 1, 14, 2);
    }
    return;
  }
  // concrete sidewalk with expansion joints
  ctx.fillStyle = ((x + y) % 2 === 0) ? CUR.palette.g1 : CUR.palette.g2;
  ctx.fillRect(sx, sy, TILE, TILE);
  ctx.fillStyle = "rgba(0,0,0,.10)";
  if (x % 2 === 0) ctx.fillRect(sx, sy, 1, TILE);
  if (y % 2 === 0) ctx.fillRect(sx, sy, TILE, 1);
  var h = tileHash(x, y);
  if (h % 23 === 0){ ctx.fillStyle = "rgba(255,255,255,.04)"; ctx.fillRect(sx + 6, sy + 8, 9, 5); }

  if (c === "T"){
    var border = (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1);
    if (border){
      // the financial canyon: one glass tower per border tile
      var v = h % 3;
      var body = v === 0 ? "#2c3a4e" : v === 1 ? "#33353d" : "#3a3330";
      var glass = v === 0 ? "rgba(127,178,229,.55)" : v === 1 ? "rgba(63,184,175,.45)" : "rgba(232,176,75,.40)";
      ctx.fillStyle = "#0e1016"; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = body; ctx.fillRect(sx + 2, sy - 6, TILE - 4, TILE + 6);
      // lit window grid, most lights on, a few dark by hash
      for (var wy = sy - 2; wy < sy + TILE - 4; wy += 6){
        for (var wx = sx + 5; wx < sx + TILE - 6; wx += 7){
          var wh = tileHash(wx + x, wy + y);
          ctx.fillStyle = (wh % 5 === 0) ? "rgba(10,12,16,.6)" : glass;
          ctx.fillRect(wx, wy, 4, 3);
        }
      }
      // rooftop furniture: a water tank or a blinking antenna
      if (h % 4 === 0){
        ctx.fillStyle = "#26282e"; ctx.fillRect(sx + 8, sy - 12, 12, 8);
        ctx.fillStyle = "#3a3d47"; ctx.fillRect(sx + 10, sy - 4, 2, 3); ctx.fillRect(sx + 16, sy - 4, 2, 3);
      } else if (h % 4 === 1){
        ctx.fillStyle = "#3a3d47"; ctx.fillRect(sx + TILE/2 - 1, sy - 13, 2, 8);
        var blink = (Math.floor(G.time / 600) + (h % 7)) % 3 === 0;
        ctx.fillStyle = blink ? "#e25549" : "#5a2a26"; ctx.fillRect(sx + TILE/2 - 2, sy - 15, 4, 3);
      }
    } else {
      // a street tree in a square concrete planter
      ctx.fillStyle = "#3d3f48"; ctx.fillRect(sx + 5, sy + 18, TILE - 10, 12);
      ctx.fillStyle = "#23242b"; ctx.fillRect(sx + 7, sy + 20, TILE - 14, 8);
      ctx.fillStyle = "#2a4634"; ctx.fillRect(sx + 6, sy + 4, TILE - 12, 16);
      ctx.fillStyle = "#3a5e44"; ctx.fillRect(sx + 9, sy + 1, TILE - 18, 14);
      ctx.fillStyle = "#4a7553"; ctx.fillRect(sx + 12, sy + 4, TILE - 24, 8);
    }
  } else if (c === "F"){
    // the plaza fountain: granite ring, teal water, a moving shimmer
    ctx.fillStyle = "#4a4d57"; ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    ctx.fillStyle = "#33353d"; ctx.fillRect(sx + 4, sy + 4, TILE - 8, TILE - 8);
    ctx.fillStyle = "#2e7d78"; ctx.fillRect(sx + 6, sy + 6, TILE - 12, TILE - 12);
    var sh = (Math.floor(G.time / 260) + x + y) % 4;
    ctx.fillStyle = "rgba(190,235,230,.65)";
    ctx.fillRect(sx + 8 + sh * 3, sy + 9, 6, 2); ctx.fillRect(sx + 18 - sh * 2, sy + 18, 5, 2);
  } else if (c === "C"){
    // street furniture: a hydrant or a pair of news boxes, by hash
    if (h % 2 === 0){
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(sx + 8, sy + 24, 16, 5);
      ctx.fillStyle = "#c14b40"; ctx.fillRect(sx + 11, sy + 10, 10, 16);
      ctx.fillRect(sx + 8, sy + 14, 16, 5);
      ctx.fillStyle = "#e0d8c8"; ctx.fillRect(sx + 13, sy + 7, 6, 4);
    } else {
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(sx + 4, sy + 24, 24, 5);
      ctx.fillStyle = "#2f7d78"; ctx.fillRect(sx + 4, sy + 8, 11, 18);
      ctx.fillStyle = "#b08a30"; ctx.fillRect(sx + 17, sy + 8, 11, 18);
      ctx.fillStyle = "rgba(240,240,245,.7)"; ctx.fillRect(sx + 6, sy + 10, 7, 6); ctx.fillRect(sx + 19, sy + 10, 7, 6);
    }
  }
}

function drawCommonsGround(c, x, y, sx, sy){
  var st = CUR.streets || {};
  var tram = (st.tramRows || []).indexOf(y) >= 0;
  var bike = (st.bikeRows || []).indexOf(y) >= 0;
  // warm paving stones
  ctx.fillStyle = ((x + y) % 2 === 0) ? CUR.palette.g1 : CUR.palette.g2;
  ctx.fillRect(sx, sy, TILE, TILE);
  var h = tileHash(x, y);
  if (h % 11 === 0){ ctx.fillStyle = "rgba(180,130,70,.10)"; ctx.fillRect(sx + 3, sy + 3, TILE - 6, TILE - 6); }
  ctx.fillStyle = "rgba(0,0,0,.08)";
  ctx.fillRect(sx, sy, TILE, 1); ctx.fillRect(sx, sy, 1, TILE);

  if (tram && c === "."){
    // tram rails with ties across the paving
    ctx.fillStyle = "rgba(60,46,34,.5)";
    for (var tx3 = sx + 2; tx3 < sx + TILE; tx3 += 8){ ctx.fillRect(tx3, sy + 8, 4, 16); }
    ctx.fillStyle = "#5a5e66";
    ctx.fillRect(sx, sy + 9, TILE, 2); ctx.fillRect(sx, sy + 21, TILE, 2);
    ctx.fillStyle = "rgba(220,220,228,.25)";
    ctx.fillRect(sx, sy + 9, TILE, 1); ctx.fillRect(sx, sy + 21, TILE, 1);
    return;
  }
  if (bike && c === "."){
    // the bike street: a tinted lane, dashes, and a wheel glyph now and then
    ctx.fillStyle = "rgba(63,140,120,.20)"; ctx.fillRect(sx, sy + 4, TILE, TILE - 8);
    ctx.fillStyle = "rgba(240,240,235,.55)";
    if (x % 2 === 0) ctx.fillRect(sx + 10, sy + TILE/2 - 1, 12, 2);
    if (h % 6 === 0){
      ctx.strokeStyle = "rgba(240,240,235,.6)";
      ctx.beginPath(); ctx.arc(sx + 11, sy + 18, 4, 0, 7); ctx.stroke();
      ctx.beginPath(); ctx.arc(sx + 21, sy + 18, 4, 0, 7); ctx.stroke();
      ctx.fillStyle = "rgba(240,240,235,.6)"; ctx.fillRect(sx + 11, sy + 12, 10, 2);
    }
    return;
  }

  if (c === "T"){
    var border = (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1);
    if (border){
      // the courtyard wall: monumental housing in the Red Vienna key,
      // with Bologna porticoes and shape only murals along the street
      var v = h % 4;
      var wall = v === 0 ? "#9c5a48" : v === 1 ? "#b07a4a" : v === 2 ? "#a3504f" : "#8a6a4c";
      ctx.fillStyle = "#1c1611"; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = wall; ctx.fillRect(sx, sy - 4, TILE, TILE + 4);
      // the tiled roofline
      ctx.fillStyle = "#6e3231"; ctx.fillRect(sx, sy - 8, TILE, 6);
      ctx.fillStyle = "rgba(0,0,0,.15)"; ctx.fillRect(sx, sy - 3, TILE, 2);
      if (h % 3 === 0){
        // a portico arch opening with column edges
        ctx.fillStyle = "#241a12"; ctx.fillRect(sx + 9, sy + 12, 14, 20);
        ctx.fillRect(sx + 11, sy + 8, 10, 6);
        ctx.fillStyle = "#e8d8bc"; ctx.fillRect(sx + 6, sy + 8, 3, 24); ctx.fillRect(sx + 23, sy + 8, 3, 24);
      } else if (h % 3 === 1){
        // arched windows with warm light and a flower box
        ctx.fillStyle = "rgba(255,225,170,.55)";
        ctx.fillRect(sx + 6, sy + 8, 8, 12); ctx.fillRect(sx + 18, sy + 8, 8, 12);
        ctx.fillRect(sx + 8, sy + 5, 4, 4); ctx.fillRect(sx + 20, sy + 5, 4, 4);
        ctx.fillStyle = "#3f6e3a"; ctx.fillRect(sx + 5, sy + 20, 10, 3); ctx.fillRect(sx + 17, sy + 20, 10, 3);
        ctx.fillStyle = "#e25549"; ctx.fillRect(sx + 7, sy + 18, 2, 2); ctx.fillRect(sx + 21, sy + 18, 2, 2);
      } else {
        // a mural in shapes and color only
        ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + 5, sy + 7, 9, 9);
        ctx.fillStyle = "#3fb8af"; ctx.fillRect(sx + 16, sy + 11, 11, 6);
        ctx.fillStyle = "#e25549";
        ctx.beginPath(); ctx.arc(sx + 20, sy + 24, 5, 0, 7); ctx.fill();
        ctx.fillStyle = "rgba(240,235,220,.5)"; ctx.fillRect(sx + 6, sy + 22, 7, 3);
      }
    } else {
      // a linden in a tended ring of earth
      ctx.fillStyle = "#4a3424"; ctx.fillRect(sx + 8, sy + 22, TILE - 16, 8);
      ctx.fillStyle = "#2f5232"; ctx.fillRect(sx + 4, sy + 4, TILE - 8, 18);
      ctx.fillStyle = "#41743f"; ctx.fillRect(sx + 7, sy + 1, TILE - 14, 15);
      ctx.fillStyle = "#5c9450"; ctx.fillRect(sx + 10, sy + 4, TILE - 20, 9);
      var bh = tileHash(x + 3, y + 5);
      if (bh % 3 === 0){ ctx.fillStyle = "#f2e8d5"; ctx.fillRect(sx + 12, sy + 5, 2, 2); ctx.fillRect(sx + 18, sy + 9, 2, 2); }
    }
  } else if (c === "F"){
    // the commons fountain: warm stone, gentle water
    ctx.fillStyle = "#8a6a4c"; ctx.fillRect(sx + 1, sy + 1, TILE - 2, TILE - 2);
    ctx.fillStyle = "#5c4632"; ctx.fillRect(sx + 4, sy + 4, TILE - 8, TILE - 8);
    ctx.fillStyle = "#46618c"; ctx.fillRect(sx + 6, sy + 6, TILE - 12, TILE - 12);
    var sh2 = (Math.floor(G.time / 300) + x * 2 + y) % 4;
    ctx.fillStyle = "rgba(200,225,250,.6)";
    ctx.fillRect(sx + 9 + sh2 * 2, sy + 10, 5, 2); ctx.fillRect(sx + 17 - sh2, sy + 18, 5, 2);
  } else if (c === "C"){
    // a raised communal garden bed, tended and producing
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx + 3, sy + 25, 26, 4);
    ctx.fillStyle = "#5c3a25"; ctx.fillRect(sx + 3, sy + 8, 26, 18);
    ctx.fillStyle = "#3a2a1c"; ctx.fillRect(sx + 5, sy + 10, 22, 14);
    ctx.fillStyle = "#3f6e3a";
    ctx.fillRect(sx + 7, sy + 11, 4, 8); ctx.fillRect(sx + 14, sy + 9, 4, 10); ctx.fillRect(sx + 21, sy + 12, 4, 7);
    ctx.fillStyle = "#e25549"; ctx.fillRect(sx + 8, sy + 10, 2, 2);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + 22, sy + 11, 2, 2);
  }
}

function drawPlannedGround(c, x, y, sx, sy){
  // The planned city: monumental concrete megaslabs in a rigid grid, and one
  // ceremonial boulevard, a red carpet, running the length of the map to the
  // plan's monument. Everything is symmetric, austere, and aimed at the center.
  var slab = (Math.floor(x / 3) + Math.floor(y / 3)) % 2;   // big 3x3 megaslabs
  ctx.fillStyle = slab ? CUR.palette.g1 : CUR.palette.g2;
  ctx.fillRect(sx, sy, TILE, TILE);
  // deep cast seams between slabs, hairline highlight within
  ctx.fillStyle = "rgba(0,0,0,.24)";
  if (x % 3 === 0) ctx.fillRect(sx, sy, 2, TILE);
  if (y % 3 === 0) ctx.fillRect(sx, sy, TILE, 2);
  ctx.fillStyle = "rgba(255,255,255,.03)";
  ctx.fillRect(sx + 2, sy + 2, TILE - 4, 1);
  // the ceremonial axis: a wide central boulevard, cols 16 to 19
  var onAxis = (x >= 16 && x <= 19);
  if (onAxis && c === "."){
    ctx.fillStyle = "#4c4e57"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "rgba(255,255,255,.05)"; ctx.fillRect(sx, sy, TILE, 1);
    if (x === 17 || x === 18){                 // the red carpet down the middle
      ctx.fillStyle = "#8f2c27"; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#b0413a"; ctx.fillRect(sx + 2, sy, TILE - 4, TILE);
      ctx.fillStyle = "rgba(0,0,0,.20)"; ctx.fillRect(sx, sy, 2, TILE);
      if (y % 2 === 0){                          // gold chevrons aimed at the monument
        ctx.fillStyle = "rgba(232,176,75,.55)";
        ctx.fillRect(sx + TILE/2 - 4, sy + TILE/2 - 1, 8, 2);
      }
    }
  }
  if (c === "T"){
    // a concrete barrier block, the parade route's edge
    var border = (x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1);
    if (border){
      ctx.fillStyle = "#2a2c33"; ctx.fillRect(sx, sy, TILE, TILE);
      ctx.fillStyle = "#3a3d45"; ctx.fillRect(sx + 3, sy + 3, TILE - 6, TILE - 6);
      ctx.fillStyle = "rgba(0,0,0,.3)"; ctx.fillRect(sx, sy + TILE - 4, TILE, 4);
    } else {
      ctx.fillStyle = "#4a4c54"; ctx.fillRect(sx + 4, sy + 8, TILE - 8, TILE - 12);
      ctx.fillStyle = "#5c5e68"; ctx.fillRect(sx + 6, sy + 5, TILE - 12, 8);
      ctx.fillStyle = "#9a2f2a"; ctx.fillRect(sx + 6, sy + 5, TILE - 12, 2);
      ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(sx + 4, sy + TILE - 6, TILE - 8, 2);
    }
  } else if (c === "F"){
    // the plinth at the city's heart: the gate beacon stands here
    ctx.fillStyle = "#3a3c44"; ctx.fillRect(sx, sy + 4, TILE, TILE - 4);
    ctx.fillStyle = "#54565f"; ctx.fillRect(sx + 3, sy + 2, TILE - 6, TILE - 6);
    ctx.fillStyle = "#9a2f2a"; ctx.fillRect(sx + 7, sy + 8, TILE - 14, 6);
  } else if (c === "C"){
    // a low stone marker
    ctx.fillStyle = "#44464e"; ctx.fillRect(sx + 5, sy + 7, TILE - 10, TILE - 12);
    ctx.fillStyle = "#5a5c66"; ctx.fillRect(sx + 7, sy + 4, TILE - 14, 8);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + TILE/2 - 2, sy + 9, 4, 4);
  }
}

function drawGroundTile(c, x, y, sx, sy){
  if (CUR.theme === "stoneage") return drawStoneAgeGround(c, x, y, sx, sy);
  if (CUR.theme === "metro") return drawMetroGround(c, x, y, sx, sy);
  if (CUR.theme === "commons") return drawCommonsGround(c, x, y, sx, sy);
  if (CUR.theme === "planned") return drawPlannedGround(c, x, y, sx, sy);
  if (CUR.theme === "feudal") return drawFeudalGround(c, x, y, sx, sy);
  if (CUR.theme === "pirate") return drawPirateGround(c, x, y, sx, sy);
  if (CUR.theme === "future") return drawVenusGround(c, x, y, sx, sy);
  // the old cobble checker, kept as the fallback for future chapters
  ctx.fillStyle = ((x + y) % 2 === 0) ? CUR.palette.g1 : CUR.palette.g2;
  ctx.fillRect(sx, sy, TILE, TILE);
  if (c === "T"){
    ctx.fillStyle = "#1d3a2b"; ctx.fillRect(sx + 4, sy + 8, TILE - 8, TILE - 10);
    ctx.fillStyle = "#2f5e41"; ctx.fillRect(sx + 7, sy + 3, TILE - 14, TILE - 14);
    ctx.fillStyle = "#3f7d55"; ctx.fillRect(sx + 10, sy + 6, TILE - 20, TILE - 20);
  } else if (c === "F"){
    ctx.fillStyle = "#46618c"; ctx.fillRect(sx + 2, sy + 2, TILE - 4, TILE - 4);
    ctx.fillStyle = "#7fb2e5"; ctx.fillRect(sx + 7, sy + 7, TILE - 14, TILE - 14);
  } else if (c === "C"){
    ctx.fillStyle = "#6e4a24"; ctx.fillRect(sx + 4, sy + 6, TILE - 8, TILE - 10);
    ctx.strokeStyle = "#a3713c"; ctx.strokeRect(sx + 4.5, sy + 6.5, TILE - 9, TILE - 11);
  }
}

/* ---------- Per archetype building art. Milestone 7, Stage 3. ----------
   The facade speaks the system. Downtown's range runs from the casino's
   electric palace to the factory's gray box to the bar's peeling paint. */
function drawGenericBuilding(b, bx, by, bw, bh){
  ctx.fillStyle = b.hue; ctx.fillRect(bx, by+10, bw, bh-10);
  ctx.fillStyle = b.roof; ctx.fillRect(bx-3, by, bw+6, 16);
  ctx.fillStyle = "rgba(242,232,213,.85)";
  for (var wx = bx+12; wx < bx+bw-16; wx += 26){ ctx.fillRect(wx, by+24, 12, 12); }
}

var BUILDING_ART = {
  factory1: function(b, bx, by, bw, bh){
    ctx.fillStyle = "#4a4c50"; ctx.fillRect(bx, by+10, bw, bh-10);
    ctx.fillStyle = "#37393d"; ctx.fillRect(bx-3, by, bw+6, 14);

    ctx.fillStyle = "rgba(0,0,0,.18)";
    ctx.fillRect(bx+10, by+10, 6, bh-10); ctx.fillRect(bx+bw-30, by+10, 8, bh-10);

    for (var wx = bx+16; wx < bx+bw-18; wx += 24){ ctx.fillRect(wx, by+30, 10, 10); }

    ctx.fillStyle = "#37393d";

    ctx.fillStyle = "#928c7d"; ctx.fillRect(bx-4, by, bw+8, 12);
    ctx.fillStyle = "#b3ac9a"; ctx.fillRect(bx+8, by-8, bw-16, 8);
    ctx.fillStyle = "#efe6d2";
    for (var cx2 = bx+10; cx2 < bx+bw-12; cx2 += 28){ ctx.fillRect(cx2, by+14, 10, bh-16); }

  },
  exchange1: function(b, bx, by, bw, bh){

    ctx.fillStyle = "#2a3a4e"; ctx.fillRect(bx, by-12, bw, bh+6);
    ctx.fillStyle = "#1c2734"; ctx.fillRect(bx-3, by-16, bw+6, 8);
    for (var gy = by-6; gy < by+bh-26; gy += 12){
      for (var gx = bx+6; gx < bx+bw-10; gx += 14){
        ctx.fillStyle = ((gx+gy) % 42 < 14) ? "rgba(63,184,175,.7)" : "rgba(207,226,239,.45)";
        ctx.fillRect(gx, gy, 10, 8);
      }
    }
    // the market screen: a jagged line that climbs and dives, shapes only
    ctx.fillStyle = "#0c1118"; ctx.fillRect(bx+bw/2-26, by+2, 52, 22);

        ctx.fillStyle = "#43d17c"; ctx.fillRect(tx2, by+bh-21, 8, 4);

  garage1: function(b, bx, by, bw, bh){

    ctx.fillStyle = "#d8d2c4"; ctx.fillRect(bx, by+12, bw, bh-12);
    ctx.fillStyle = "#9a948a"; ctx.fillRect(bx-3, by+4, bw+6, 10);
    // a rooftop solar panel and a small dish
    ctx.fillStyle = "#27435c"; ctx.fillRect(bx+8, by-4, 26, 8);
    ctx.fillStyle = "rgba(127,178,229,.6)"; ctx.fillRect(bx+10, by-2, 6, 4); ctx.fillRect(bx+18, by-2, 6, 4); ctx.fillRect(bx+26, by-2, 6, 4);
    ctx.fillStyle = "#b3ac9a"; ctx.fillRect(bx+bw-18, by-6, 3, 10);
    ctx.beginPath(); ctx.arc(bx+bw-16, by-7, 5, 0, 7); ctx.fill();
    // the rollup door, half open after a long night
    ctx.fillStyle = "#54422e"; ctx.fillRect(bx+bw/2-26, by+22, 52, bh-24);
    ctx.fillStyle = "#1c1a22"; ctx.fillRect(bx+bw/2-24, by+bh-16, 48, 14);
    ctx.fillStyle = "rgba(0,0,0,.2)";

function drawRoomBust(cx2, midY, cfg){
  var hw = 64, hh = 60;                       // the head
  var sw = 150, sh = 80;                      // the shoulders
  // shoulders and top
  ctx.fillStyle = cfg.top;
  ctx.fillRect(cx2 - sw/2, midY + hh/2 - 6, sw, sh);
  ctx.fillStyle = "rgba(0,0,0,.18)";
  ctx.fillRect(cx2 - sw/2, midY + hh/2 - 6, sw, 8);
  // collar
  ctx.fillStyle = cfg.collar;
  ctx.fillRect(cx2 - 26, midY + hh/2 - 6, 52, 14);
  // neck and head
  ctx.fillStyle = cfg.skin;
  ctx.fillRect(cx2 - 12, midY + hh/2 - 18, 24, 16);
  ctx.fillRect(cx2 - hw/2, midY - hh/2, hw, hh);
  // hair
  ctx.fillStyle = cfg.hairC;
  if (cfg.hair === "bun"){
    ctx.fillRect(cx2 - hw/2 - 2, midY - hh/2 - 6, hw + 4, 18);
    ctx.fillRect(cx2 - 14, midY - hh/2 - 18, 28, 16);
  } else if (cfg.hair === "curls"){
    ctx.fillRect(cx2 - hw/2 - 6, midY - hh/2 - 8, hw + 12, 22);
    ctx.fillRect(cx2 - hw/2 - 6, midY - hh/2 + 8, 12, 30);
    ctx.fillRect(cx2 + hw/2 - 6, midY - hh/2 + 8, 12, 30);
  } else if (cfg.hair === "long"){
    ctx.fillRect(cx2 - hw/2 - 4, midY - hh/2 - 6, hw + 8, 16);
    ctx.fillRect(cx2 - hw/2 - 8, midY - hh/2, 14, hh + 26);
    ctx.fillRect(cx2 + hw/2 - 6, midY - hh/2, 14, hh + 26);
  } else if (cfg.hair === "cap"){
    ctx.fillRect(cx2 - hw/2 - 2, midY - hh/2 - 8, hw + 4, 20);
    ctx.fillRect(cx2 - hw/2 - 14, midY - hh/2 + 6, 18, 8);
  } else if (cfg.hair === "bandana"){
    // a wrapped headscarf, knotted at the side, with a hanging tail
    ctx.fillRect(cx2 - hw/2 - 2, midY - hh/2 - 4, hw + 4, 16);
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(cx2 - hw/2 - 2, midY - hh/2 + 6, hw + 4, 4);
    ctx.fillStyle = cfg.hairC;
    ctx.fillRect(cx2 + hw/2 - 4, midY - hh/2 + 2, 12, 10);   // side knot
    ctx.fillRect(cx2 + hw/2 + 2, midY - hh/2 + 8, 6, 18);    // tail
  } else {
    ctx.fillRect(cx2 - hw/2, midY - hh/2 - 4, hw, 14);
  }
  // eyes
  ctx.fillStyle = "#15121c";
  ctx.fillRect(cx2 - 18, midY - 6, 8, 8);
  ctx.fillRect(cx2 + 10, midY - 6, 8, 8);
  // accessories
  if (cfg.acc === "glasses"){
    ctx.fillStyle = "rgba(239,230,210,.85)";
    ctx.fillRect(cx2 - 24, midY - 10, 20, 16); ctx.fillRect(cx2 + 4, midY - 10, 20, 16);
    ctx.fillRect(cx2 - 4, midY - 4, 8, 4);
    ctx.fillStyle = cfg.skin; ctx.fillRect(cx2 - 20, midY - 6, 12, 8); ctx.fillRect(cx2 + 8, midY - 6, 12, 8);
    ctx.fillStyle = "#15121c"; ctx.fillRect(cx2 - 17, midY - 4, 6, 6); ctx.fillRect(cx2 + 11, midY - 4, 6, 6);
  }
  if (cfg.acc === "eyepatch"){
    // a patch over one eye with a strap across the brow
    ctx.fillStyle = "#15121c";
    ctx.fillRect(cx2 + 8, midY - 10, 14, 14);
    ctx.fillStyle = "#0e0b12";
    ctx.fillRect(cx2 - 22, midY - 6, 46, 3);
  }
  if (cfg.acc === "beard"){
    ctx.fillStyle = cfg.hairC;
    ctx.fillRect(cx2 - hw/2 + 6, midY + 12, hw - 12, 18);
  }
  if (cfg.acc === "apron"){
    ctx.fillStyle = "#caa06a";
    ctx.fillRect(cx2 - 30, midY + hh/2 + 16, 60, sh - 22);
    ctx.fillStyle = "rgba(0,0,0,.15)";
    ctx.fillRect(cx2 - 30, midY + hh/2 + 16, 60, 6);
  }
  if (cfg.acc === "steth"){
    ctx.fillStyle = "#3a3f48";
    ctx.fillRect(cx2 - 34, midY + hh/2 - 2, 10, 34);
    ctx.fillRect(cx2 + 24, midY + hh/2 - 2, 10, 34);

function drawRoomCanvas(roomId){
  var key = roomKeyFor(roomId);

  th.props.forEach(function(p){ if (ROOM_PROPS[p]) ROOM_PROPS[p](th); });

var arrivalEl = document.getElementById("arrival");

var arrivalLine = arrivalEl.querySelector(".line");
var arrivalGoBtn = document.getElementById("arrival-go");
var arrivalByeBtn = document.getElementById("arrival-bye");
var arrival = null;
var pendingFarewell = null;

function arrivalCfg(key){
  var t = ARRIVALS[CHAPTER_ID] || {};
  return t[key] || null;
}
function showArrival(key, onGo){
  var cfg = arrivalCfg(key);
  if (!cfg){ onGo(); return false; }
  arrival = { key: key, cfg: cfg, onGo: onGo, phase: "hello" };
  arrivalWho.textContent = cfg.who;
  arrivalLine.textContent = cfg.hello;
  arrivalGoBtn.textContent = cfg.action;
  arrivalGoBtn.style.display = "";
  arrivalByeBtn.textContent = "LEAVE";
  arrivalEl.classList.add("on");
  G.scene = "ARRIVAL";
  return true;
}
function showFarewell(key){
  var cfg = arrivalCfg(key);
  if (!cfg){ G.scene = "WALK"; sceneHide(); return false; }
  arrival = { key: key, cfg: cfg, phase: "bye" };
  arrivalWho.textContent = cfg.who;
  arrivalLine.textContent = cfg.bye;
  arrivalGoBtn.style.display = "none";
  arrivalByeBtn.textContent = "WALK ON";
  arrivalEl.classList.add("on");
  G.scene = "ARRIVAL";
  return true;
}
function hideArrival(){
  arrivalEl.classList.remove("on");
  arrival = null;
}
function arrivalGo(){
  if (!arrival || arrival.phase !== "hello") return;
  var go = arrival.onGo;
  hideArrival();
  go();
}
function arrivalLeave(){
  if (!arrival) return;
  if (arrival.phase === "hello"){
    var key = arrival.key;
    hideArrival();
    showFarewell(key);
  } else {
    hideArrival();
    G.scene = "WALK";
    sceneHide();
  }
}
arrivalGoBtn.addEventListener("click", arrivalGo);
arrivalByeBtn.addEventListener("click", arrivalLeave);

var KEYMAP = {
  ArrowUp:"up", KeyW:"up", ArrowDown:"down", KeyS:"down",
  ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right"
};
function onKeyDown(e){
  if (KEYMAP[e.code]) { G.keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (e.code==="Space" || e.code==="Enter") { action(); e.preventDefault(); }
}
function onKeyUp(e){ if (KEYMAP[e.code]) G.keys[KEYMAP[e.code]] = false; }
window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);

/* Touch pad */
function bindHold(id, dir){
  var el = document.getElementById(id);
  if (!el) return;
  var on = function(e){ G.keys[dir]=true; e.preventDefault(); };
  var off = function(e){ G.keys[dir]=false; e.preventDefault(); };
  el.addEventListener("pointerdown", on);
  el.addEventListener("pointerup", off);
  el.addEventListener("pointerleave", off);
  el.addEventListener("pointercancel", off);
}
bindHold("d-up","up"); bindHold("d-down","down");
bindHold("d-left","left"); bindHold("d-right","right");

/* ---------- Action button ---------- */
function action(){
  if (G.scene==="BRIEFING"){ endBriefing(); return; }
  if (G.scene==="TITLE"){ startGame(); return; }
  if (G.scene==="DIALOGUE"){ advanceDialogue(); return; }
  if (G.scene==="ARRIVAL"){
    if (arrival && arrival.phase === "hello") arrivalGo();
    else arrivalLeave();
    return;
  }
  if (G.scene==="ARCADE"){ if (arcade) arcade.fire(); return; }
  if (G.scene==="WALK"){
    if (G.nearGate){
      if (deskOpen()) openDesk();
      else if (gateOpen()) completeChapter();
      return;
    }
    if (G.nearDoor){ enterBuilding(G.nearDoor); return; }
    if (G.nearNPC){ talkTo(G.nearNPC); return; }
  }
}

function shuffled(arr){
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--){
    var j = Math.floor(rng() * (i + 1));
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function renderLessonStep(b, step, review){
  interiorInner.innerHTML = "";
  var room = el("div", "room");
  room.appendChild(el("div", "place", "THE LESSON HALL"));

  if (step < LESSON_CARDS.length){
    var card = LESSON_CARDS[step];
    room.appendChild(el("div", "host", "CARD " + (step+1) + " OF " + LESSON_CARDS.length + ": " + card.t));
    room.appendChild(el("div", "speech", card.b));
    var next = el("button", "btn", step === LESSON_CARDS.length - 1 ? (review ? "DONE" : "TO THE PRACTICE REP") : "NEXT CARD");
    next.addEventListener("click", function(){
      if (step === LESSON_CARDS.length - 1 && review){ buildInstituteRoom(b); return; }
      renderLessonStep(b, step + 1, review);
    });
    room.appendChild(next);
  } else if (step === LESSON_CARDS.length){
    renderQuestion(room, PRACTICE, function(){ renderLessonStep(b, step + 1, false); }, null);
  } else {
    var gi = step - LESSON_CARDS.length - 1; // 0 or 1
    renderQuestion(room, GATE_QS[gi],
      function(){ // correct
        if (gi === 0) renderLessonStep(b, step + 1, false);
        else passInstitute(b);
      },
      function(){ // wrong: the gate resets to question one
        renderLessonStep(b, LESSON_CARDS.length + 1, false);
      });
  }

  var back = el("button", "btn ghost", "LEAVE THE HALL");
  back.addEventListener("click", function(){ buildInstituteRoom(b); });
  room.appendChild(back);
  interiorInner.appendChild(room);
}

function renderQuestion(room, Q, onPass, onFail){
  room.appendChild(el("div", "question", Q.q));
  var verdict = el("div", "verdict");
  instRenderOrder = shuffled(Q.choices);
  var locked = false;
  instRenderOrder.forEach(function(c, i){
    var btn = el("button", "choice", String.fromCharCode(65+i) + ".  " + c.t);
    btn.addEventListener("click", function(){
      if (locked) return;
      verdict.style.display = "block";
      verdict.innerHTML = c.why;
      verdict.classList.toggle("bad", !c.ok);
      if (c.ok){
        locked = true;
        var go = el("button", "btn", "CONTINUE");
        go.addEventListener("click", onPass);
        room.insertBefore(go, verdict.nextSibling);
      } else if (onFail){
        locked = true;
        var retry = el("button", "btn", "BACK TO GATE 1");
        retry.addEventListener("click", onFail);
        room.insertBefore(retry, verdict.nextSibling);
      }
    });
    room.appendChild(btn);
  });
  room.appendChild(verdict);
}

var HAZARDS = [];          // live copies, set per chapter by selectChapter
var HAZARD_SNAPSHOT = [];
G.hazardHits = 0;
G.invulnUntil = 0;
var hazardsActive = true;

function rectsOverlap(ax,ay,aw,ah, bx,by,bw,bh){
  return ax < bx+bw && ax+aw > bx && ay < by+bh && ay+ah > by;
}

function hazardHit(h){
  if (G.time < G.invulnUntil) return;
  if (G.time < G.careUntil) return;   // the clinic's CARE shield
  G.invulnUntil = G.time + 1500;
  G.hazardHits++;
  G.runPoints = Math.max(0, G.runPoints - h.cost);
  // knockback away from the hazard
  var p = G.player;
  var pushX = (p.x + p.w/2) - (h.x + h.w/2);
  var pushY = (p.y + p.h/2) - (h.y + h.h/2);
  var mag = Math.sqrt(pushX*pushX + pushY*pushY) || 1;
  tryMove(Math.round(pushX/mag*26), 0);
  tryMove(0, Math.round(pushY/mag*26));
  toast(h.line);
  refreshHUD();
}

function updateHazards(dt){
  if (!hazardsActive) return;
  var p = G.player;
  // the Black Death arrives once the realm is two thirds understood
  if (CHAPTER_ID === "chF" && !G.plagueArrived && insightCount() >= 2){
    G.plagueArrived = true;
    HAZARDS.forEach(function(h){ if (h.type === "plague") h.active = true; });
    toast("THE BLACK DEATH ARRIVES.<br>It does not knock, and it does not care for rank.", 4200);
  }
  HAZARDS.forEach(function(h){
    if (h.type === "plague" && !h.active) return;
    if (h.type === "cart"){
      h.x += h.dir * h.speed * dt/1000;
      if (h.x <= h.minX){ h.x = h.minX; h.dir = 1; }
      if (h.x >= h.maxX){ h.x = h.maxX; h.dir = -1; }
    } else if (h.type === "collector"){
      var dx = (p.x+p.w/2) - (h.x+h.w/2);
      var dy = (p.y+p.h/2) - (h.y+h.h/2);
      var d = Math.sqrt(dx*dx+dy*dy);
      var csp = h.speed * ((CHAPTER_ID === "chF" && G.protected) ? 0.45 : 1);
      if (d < h.radius && d > 2){
        h.x += dx/d * csp * dt/1000;
        h.y += dy/d * csp * dt/1000;
      } else if (d >= h.radius){
        var hx = h.homeX - h.x, hy = h.homeY - h.y;
        var hd = Math.sqrt(hx*hx+hy*hy);
        if (hd > 4){ h.x += hx/hd * h.speed*0.6 * dt/1000; h.y += hy/hd * h.speed*0.6 * dt/1000; }
      }
    } else if (h.type === "bubble"){
      h.x += h.vx * dt/1000; h.y += h.vy * dt/1000;
      if (h.x <= h.minX || h.x >= h.maxX) h.vx = -h.vx;
      if (h.y <= h.minY || h.y >= h.maxY) h.vy = -h.vy;
      h.x = Math.max(h.minX, Math.min(h.x, h.maxX));
      h.y = Math.max(h.minY, Math.min(h.y, h.maxY));
    } else if (h.type === "brigand"){
      var bsp = h.speed * ((CHAPTER_ID === "chF" && G.protected) ? 0.5 : 1);
      h.y += h.dirY * bsp * dt/1000;
      if (h.y <= h.minY){ h.y = h.minY; h.dirY = 1; }
      if (h.y >= h.maxY){ h.y = h.maxY; h.dirY = -1; }
    } else if (h.type === "plague"){
      h.x += h.vx * dt/1000; h.y += h.vy * dt/1000;
      if (h.x <= h.minX || h.x >= h.maxX) h.vx = -h.vx;
      if (h.y <= h.minY || h.y >= h.maxY) h.vy = -h.vy;
      h.x = Math.max(h.minX, Math.min(h.x, h.maxX));
      h.y = Math.max(h.minY, Math.min(h.y, h.maxY));
    }
    if (rectsOverlap(p.x, p.y, p.w, p.h, h.x, h.y, h.w, h.h)) hazardHit(h);
  });
}

/* The engine: pure state and rules, no DOM. */
function DeskEngine(cfg){
  var E = {
    cfg: cfg,
    beat: 0,
    done: false,
    collapsed: null,        // needle id that hit zero, or null
    needles: {},
    fitSum: 0,
    beatsSurvived: 0,
    log: []
  };
  NEEDLE_DEFS.forEach(function(n){ E.needles[n.id] = 50; });

  E.current = function(){ return E.cfg.beats[E.beat] || null; };

  E.choose = function(optIdx){
    var beat = E.current();
    if (!beat || E.done) return null;
    var opt = beat.options[optIdx];
    if (!opt) return null;
    var deltas = {};
    NEEDLE_DEFS.forEach(function(n){
      var d = opt.fx[n.id] || 0;
      var before = E.needles[n.id];
      var after = Math.max(0, Math.min(100, before + d));
      deltas[n.id] = after - before;
      E.needles[n.id] = after;
    });
    E.fitSum += (opt.fit || 0);
    E.log.push({ beat: E.beat, opt: optIdx, fit: opt.fit || 0 });
    var zero = null;
    NEEDLE_DEFS.forEach(function(n){ if (zero === null && E.needles[n.id] === 0) zero = n.id; });
    if (zero){ E.collapsed = zero; E.done = true; }
    else { E.beatsSurvived++; }
    return { deltas: deltas, why: opt.why, label: opt.label, collapsed: zero };
  };

  E.advance = function(){
    if (E.done) return false;
    E.beat++;
    if (E.beat >= E.cfg.beats.length) E.done = true;
    return !E.done;
  };

  E.score = function(){
    var beatPts = E.beatsSurvived * BEAT_POINTS;
    var mult = shelfMultiplier();
    var close = E.collapsed ? 0 : Math.round(E.fitSum * FIT_POINTS * mult);
    return { beatPts: beatPts, fitSum: E.fitSum, mult: mult, close: close, total: beatPts + close };
  };

  return E;
}

/* ---------- Desk UI ---------- */
var panelDesk = document.getElementById("panel-desk");
var deskInner = document.getElementById("desk-inner");
var desk = null;               // the active engine for this run
var deskRenderOrder = null;    // current beat's options in shuffled render order

function deskOpen(){
  return G.institutePassed && !G.deskPassed && !G.chapterDone;
}

function openDesk(){
  if (!deskOpen()) return;
  if (!desk) desk = DeskEngine(DESK_CFG);
  sceneFlash();
  sceneShow("desk" + chapterDigit());
  showArrival("desk", function(){
    G.scene = "DESK";
    panelDesk.classList.add("open");
    if (desk.beat === 0 && desk.log.length === 0) renderDeskIntro();
    else renderDeskBeat();
  });
}

function closeDesk(){
  panelDesk.classList.remove("open");
  deskInner.innerHTML = "";
  refreshHUD();
  if (desk && !desk.done && !desk.collapsed && showFarewell("desk")) return;
  G.scene = "WALK";
  sceneHide();
}

function deskHeader(room, sub){
  room.appendChild(el("div", "place", "THE DECISION DESK"));
  room.appendChild(el("div", "beatno", sub));
}

/* needle labels: a chapter may rename the four needles for its own world
   (Piracy shows PLUNDER, LOYALTY, LIBERTY, ORDER) without touching the engine. */
function needleLabel(n){
  var cfg = (G.scene === "FREEPLAY") ? FREEPLAY_CFG : DESK_CFG;
  return (cfg && cfg.needleNames && cfg.needleNames[n.id]) || n.name;
}

function buildGauges(deltas, needles){
  var src = needles || (desk ? desk.needles : {});
  var wrap = el("div", "gauges");
  NEEDLE_DEFS.forEach(function(n){
    var v = src[n.id];
    var g = el("div", "gauge" + (v <= 15 ? " low" : ""));
    g.appendChild(el("div", "g-name", needleLabel(n)));
    var bar = el("div", "g-bar");
    var fill = el("div", "g-fill");
    fill.style.width = v + "%";
    fill.style.background = n.color;
    bar.appendChild(fill);
    g.appendChild(bar);
    var val = el("div", "g-val", String(v));
    val.style.color = n.color;
    g.appendChild(val);
    var d = deltas ? (deltas[n.id] || 0) : 0;
    var chip = el("div", "g-delta" + (d > 0 ? " up" : d < 0 ? " down" : ""),
      d > 0 ? "\u25B2" + d : d < 0 ? "\u25BC" + (-d) : "");
    g.appendChild(chip);
    wrap.appendChild(g);
  });
  return wrap;
}

function renderDeskIntro(){
  deskInner.innerHTML = "";
  var room = el("div", "desk-room");
  deskHeader(room, DESK_CFG.chapter);
  room.appendChild(buildGauges(null));
  room.appendChild(el("div", "speech", DESK_CFG.intro));
  var go = el("button", "btn", "TAKE THE CHAIR");
  go.addEventListener("click", renderDeskBeat);
  room.appendChild(go);
  var back = el("button", "btn ghost", "NOT YET");
  back.addEventListener("click", closeDesk);
  room.appendChild(back);
  deskInner.appendChild(room);
}

function renderDeskBeat(){
  deskInner.innerHTML = "";
  var beat = desk.current();
  if (!beat){ renderDeskSummary(); return; }
  var room = el("div", "desk-room");
  deskHeader(room, DESK_CFG.chapter + "  \u2022  BEAT " + (desk.beat + 1) + " OF " + DESK_CFG.beats.length);
  room.appendChild(buildGauges(null));
  room.appendChild(el("div", "question", beat.prompt));

  deskRenderOrder = shuffled(beat.options.map(function(o, i){ return i; }));
  deskRenderOrder.forEach(function(dataIdx, i){
    var opt = beat.options[dataIdx];
    var html = "";
    if (DESK_CFG.labelsOn) html += '<span class="opt-label">' + opt.label + "</span><br>";
    html += String.fromCharCode(65 + i) + ".  " + opt.t;
    var btn = el("button", "choice", html);
    btn.addEventListener("click", function(){ deskChoose(dataIdx); });
    room.appendChild(btn);
  });

  deskInner.appendChild(room);
}

function deskChoose(dataIdx){
  if (!desk || desk.done && desk.collapsed) return;
  var result = desk.choose(dataIdx);
  if (!result) return;
  renderDeskFeedback(result);
}

function renderDeskFeedback(result){
  deskInner.innerHTML = "";
  var room = el("div", "desk-room");
  deskHeader(room, DESK_CFG.chapter + "  \u2022  BEAT " + (desk.beat + 1) + " OF " + DESK_CFG.beats.length);
  room.appendChild(buildGauges(result.deltas));
  var verdict = el("div", "verdict", result.why);
  verdict.style.display = "block";
  verdict.classList.toggle("bad", !!result.collapsed);
  room.appendChild(verdict);

  var go = el("button", "btn", result.collapsed ? "FACE IT" : "NEXT");
  go.addEventListener("click", function(){
    if (result.collapsed){ renderDeskCollapse(result.collapsed); return; }
    desk.advance();
    if (desk.done) renderDeskSummary();
    else renderDeskBeat();
  });
  room.appendChild(go);
  deskInner.appendChild(room);
}

function renderDeskSummary(){
  var s = desk.score();
  G.deskPassed = true;
  G.deskScore = s;
  G.runPoints += s.total;
  refreshHUD();

  deskInner.innerHTML = "";
  var room = el("div", "desk-room");
  deskHeader(room, DESK_CFG.chapter);
  room.appendChild(buildGauges(null));
  room.appendChild(el("div", "speech",
    "All " + DESK_CFG.beats.length + " beats, and the economy is still breathing. You ran it by its own logic, watched every tradeoff, and nobody asked you to believe a word."));

  row("Comprehension", s.fitSum + " of " + (DESK_CFG.beats.length * 2));

function renderDeskCollapse(needleId){
