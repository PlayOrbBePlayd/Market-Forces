/* ---------- Sea critters ---------- */
function drawPirateCritter(c, sx, sy){
  var f = c.flip < 0 ? -1 : 1;
  var t = G.time;
  if (c.kind === "gull"){
    var flap = Math.floor(t / 150 + (c.hx || 0)) % 2 === 0;
    ctx.fillStyle = "#eef2f5";
    if (flap){ ctx.fillRect(sx, sy + 2, 8, 3); ctx.fillRect(sx + 8, sy + 2, 8, 3); }
    else { ctx.fillRect(sx + 2, sy, 6, 3); ctx.fillRect(sx + 8, sy, 6, 3); }
    ctx.fillStyle = "#cfd8dd"; ctx.fillRect(sx + 6, sy + 1, 4, 4);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + (f > 0 ? 10 : 5), sy + 2, 2, 1);
  } else if (c.kind === "frigatebird"){
    // a big seabird wheeling on a wide circle
    var flap2 = Math.floor(t / 260) % 2 === 0;
    ctx.fillStyle = "#23262c";
    if (flap2){ ctx.fillRect(sx - 2, sy + 2, 11, 3); ctx.fillRect(sx + 9, sy + 2, 11, 3); }
    else { ctx.fillRect(sx + 1, sy - 1, 8, 3); ctx.fillRect(sx + 9, sy - 1, 8, 3); }
    ctx.fillStyle = "#15171c"; ctx.fillRect(sx + 7, sy + 1, 5, 5);
    ctx.fillStyle = "#c23a2a"; ctx.fillRect(sx + 8, sy + 5, 3, 2);
  } else if (c.kind === "pelican"){
    var glide = Math.round(Math.sin(t / 500) * 2);
    ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fillRect(sx + 2, sy + 16, 16, 3);
    ctx.fillStyle = "#cdd4d8"; ctx.fillRect(sx + 2, sy + 4 + glide, 16, 8);
    ctx.fillStyle = "#a9b2b8"; ctx.fillRect(sx + 2, sy + 9 + glide, 16, 3);
    ctx.fillStyle = "#e8c39e"; ctx.fillRect(sx + (f > 0 ? 14 : 0), sy + 2 + glide, 6, 6);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + (f > 0 ? 18 : -2), sy + 6 + glide, 5, 3);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? 16 : 3), sy + 4 + glide, 1, 1);
  } else if (c.kind === "dolphin"){
    // arcs out of the water and back on a loop
    var d = (t / 1500 + (c.hx || 0) * 0.05) % 1;
    if (d < 0.5){
      var arc = Math.sin(d / 0.5 * Math.PI);
      var dy = sy + 14 - arc * 22;
      ctx.fillStyle = "#3a6e84"; ctx.fillRect(sx + 2, dy, 18, 7);
      ctx.fillStyle = "#5b93ab"; ctx.fillRect(sx + 4, dy + 1, 12, 3);
      ctx.fillStyle = "#3a6e84"; ctx.fillRect(sx + (f > 0 ? 18 : 0), dy - 3, 4, 6);   // fin/tail
      ctx.fillStyle = "#2a5468"; ctx.fillRect(sx + 9, dy - 4, 4, 4);                   // dorsal
      ctx.fillStyle = "#15121c"; ctx.fillRect(sx + (f > 0 ? 5 : 16), dy + 1, 1, 1);
    } else {
      ctx.fillStyle = "rgba(214,238,245,.35)";
      ctx.fillRect(sx + 4, sy + 12, 6, 2); ctx.fillRect(sx + 12, sy + 13, 5, 2);
    }
  } else if (c.kind === "flyingfish"){
    var g = (t / 1100 + (c.hx || 0) * 0.07) % 1;
    if (g < 0.4){
      var a2 = Math.sin(g / 0.4 * Math.PI);
      var fx = sx + g * 30 * f, fy = sy + 8 - a2 * 16;
      ctx.fillStyle = "#7fb2c8"; ctx.fillRect(fx, fy, 8, 4);
      ctx.fillStyle = "#bfe4ef"; ctx.fillRect(fx + (f > 0 ? -2 : 6), fy - 2, 5, 3);   // wing fin
      ctx.fillStyle = "#5b8fa6"; ctx.fillRect(fx + (f > 0 ? 7 : -2), fy, 3, 4);
    } else {
      ctx.fillStyle = "rgba(214,238,245,.3)"; ctx.fillRect(sx + 4, sy + 8, 5, 2);
    }
  } else if (c.kind === "seaturtle"){
    var paddle = Math.round(Math.sin(t / 600 + (c.hx || 0)) * 2);
    ctx.fillStyle = "rgba(0,0,0,.14)"; ctx.fillRect(sx + 2, sy + 16, 20, 3);
    ctx.fillStyle = "#3f5a2e"; ctx.fillRect(sx + 3, sy + 5, 17, 11);
    ctx.fillStyle = "#5a7a3c"; ctx.fillRect(sx + 6, sy + 7, 11, 7);
    ctx.fillStyle = "#2f4522"; ctx.fillRect(sx + 8, sy + 8, 3, 3); ctx.fillRect(sx + 13, sy + 10, 3, 3);
    ctx.fillStyle = "#6a8a4c"; ctx.fillRect(sx + (f > 0 ? 18 : -1), sy + 7, 5, 4);     // head
    ctx.fillStyle = "#4a6630"; ctx.fillRect(sx + 1, sy + 6 + paddle, 4, 4); ctx.fillRect(sx + 17, sy + 12 - paddle, 4, 4); // flippers
  }
}

/* ---------- The player as a ship, top down sloop ---------- */
function drawShipPlayer(px, py, bob){
  var p = G.player, t = G.time;
  var cx = px + p.w / 2, cy = py + p.h / 2 + bob;
  var moving = p.anim > 0;
  // wake trailing opposite the heading
  var wob = Math.sin(t / 160) * 2;
  ctx.fillStyle = "rgba(214,238,245,.4)";
  if (p.dir === "up"){ ctx.fillRect(cx - 5, cy + 8, 4, 7 + (moving ? 3 : 0)); ctx.fillRect(cx + 1, cy + 8, 4, 7 + (moving ? 3 : 0)); }
  else if (p.dir === "down"){ ctx.fillRect(cx - 5, cy - 14, 4, 6); ctx.fillRect(cx + 1, cy - 14, 4, 6); }
  else if (p.dir === "left"){ ctx.fillRect(cx + 6, cy - 3, 7 + (moving ? 3 : 0), 4); }
  else { ctx.fillRect(cx - 13, cy - 3, 7 + (moving ? 3 : 0), 4); }
  // hull
  ctx.fillStyle = "#5c3a1e"; ctx.fillRect(cx - 7, cy - 10, 14, 20);
  ctx.fillStyle = "#7a4f28"; ctx.fillRect(cx - 6, cy - 11, 12, 6);   // bow
  ctx.fillStyle = "#3a2412"; ctx.fillRect(cx - 7, cy + 7, 14, 3);    // stern
  // deck
  ctx.fillStyle = "#8a6a44"; ctx.fillRect(cx - 4, cy - 6, 8, 12);
  // mast and a billowing sail
  ctx.fillStyle = "#3a2412"; ctx.fillRect(cx - 1, cy - 8, 2, 14);
  var bil = Math.round(wob);
  ctx.fillStyle = "#efe6d2"; ctx.fillRect(cx - 6 + bil, cy - 7, 12, 9);
  ctx.fillStyle = "#d8cdb4"; ctx.fillRect(cx - 6 + bil, cy - 7, 12, 2);
  // the black flag
  var fl = Math.floor(t / 220) % 2 === 0 ? 0 : 1;
  ctx.fillStyle = "#15121c"; ctx.fillRect(cx + 1, cy - 16, 7 - fl, 5);
  ctx.fillStyle = "#efe6d2"; ctx.fillRect(cx + 3, cy - 15, 2, 1); ctx.fillRect(cx + 2, cy - 13, 4, 1);
}

/* ---------- Grog Island: freedom includes a long sail home ---------- */
var grogDrank = false;
function buildGrogRoom(b){
  var room = el("div", "room temptation");
  room.appendChild(el("div", "place", b.name));
  room.appendChild(el("div", "host", "GROG MOTHER TULLY"));
  room.appendChild(el("div", "speech",
    "No king and no captain tells you how to spend a night ashore, friend. That is the whole point of the free sea. The first tankard is cheap. The morning watch is the price."));
  var verdict = el("div", "verdict");

  var drink = el("button", "choice", "Call for grog  (+10 pts, but SLOWED for 30s once you sail)");
  drink.addEventListener("click", function(){
    if (grogDrank) return;
    grogDrank = true;
    G.runPoints += 10;
    verdict.style.display = "block";
    verdict.classList.add("bad");
    verdict.innerHTML = "A fine night, freely chosen. A sea with no master leaves you free to dull your own watch. +10 pts, and the deck will pitch a while.";
    drink.disabled = true; drink.style.opacity = .4;
    refreshHUD();
  });

  var resist = el("button", "choice", "Just water from the cask  (+5 pts)");
  resist.addEventListener("click", function(){
    if (room._resisted || grogDrank) return;
    room._resisted = true;
    G.runPoints += 5;
    verdict.style.display = "block";
    verdict.classList.remove("bad");
    verdict.innerHTML = "Temptation passed. The free sea never made you come ashore, and it never makes you stay at the cask.";
    refreshHUD();
  });

  var back = el("button", "btn ghost", "BACK TO THE WATER");
  back.addEventListener("click", closeInterior);
  room.appendChild(drink); room.appendChild(resist); room.appendChild(verdict); room.appendChild(back);
  interiorInner.appendChild(room);
}

/* ---------- The Gambling Hulk: a bet on a fancied prize, posted odds ---------- */
function buildGamblingHulkRoom(b){
  var room = el("div", "room temptation");
  room.appendChild(el("div", "place", b.name));
  room.appendChild(el("div", "host", "GAMBLER SOLOMON KIDD"));
  room.appendChild(el("div", "speech",
    "Bet your share on a fancied prize, friend. You take it 9 casts in 20. The hold keeps the difference, and the difference keeps the lanterns lit."));
  var verdict = el("div", "verdict");

  [10, 25, 50].forEach(function(stake){
    var btn = el("button", "choice", "Stake " + stake + " run points on the prize");
    btn.addEventListener("click", function(){
      if (G.runPoints < stake){
        verdict.style.display = "block"; verdict.classList.add("bad");
        verdict.innerHTML = "The table takes coin, not promises. You need " + stake + " to play.";
        return;
      }
      var win = rng() < 0.45;
      verdict.style.display = "block";
      if (win){
        G.runPoints += stake;
        verdict.classList.remove("bad");
        verdict.innerHTML = "PRIZE TAKEN. +" + stake + " pts. The cast ran your way. The odds have not moved.";
      } else {
        G.runPoints -= stake;
        verdict.classList.add("bad");
        verdict.innerHTML = "PRIZE LOST. " + stake + " pts gone over the side. The hold's cut is no trick. It is the posted price of the thrill.";
      }
      refreshHUD();
    });
    room.appendChild(btn);
  });

  var back = el("button", "btn ghost", "BACK TO THE WATER");
  back.addEventListener("click", closeInterior);
  room.appendChild(verdict); room.appendChild(back);
  interiorInner.appendChild(room);
}

/* =====================================================
   BLACK FLAG RUN. The Chapter 5 cabinet. M19 S4.
   A sea scroller in the River Raid tradition, and a brand
   new engine since no chapter cabinet repeats. Sail up a
   winding lane between reef banks, fire on merchant prizes
   to board them, dodge the navy and the storms, and top up
   powder and provisions at a friendly port before the hold
   runs dry. The player verb is plunder. Public API mirrors
   ArcadeEngine: input, fire, update(dt), score, over, banked,
   hits, playerHits, elapsed. Pure state, no DOM, seeded rng.
   ===================================================== */
function SeaEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var E = {
    cfg: cfg, W: W, H: H, kind: "sea",
    wave: 0, spawned: 0, spawnTimer: 500, prizeSeq: 0,
    portTimer: 2600, navyTimer: 1400, stormTimer: 2200,
    scroll: 0,
    ship: { x: W/2 - 13, y: H - 96, w: 26, h: 34, cooldown: 0, invulnUntil: 0, flash: 0 },
    prizes: [], navy: [], storms: [], ports: [], shots: [], wake: [], fx: [],
    supply: cfg.supplyMax,
    input: { left:false, right:false, up:false, down:false },
    elapsed: 0,
    hits: 0, damagePts: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false, outOfSupply: false
  };

  function waveCfg(){ return cfg.waves[E.wave]; }
  // the meandering lane: a center that winds and a half width that narrows by wave
  E.center = function(worldY){
    return W/2 + Math.sin(worldY * 0.0052) * 104 + Math.sin(worldY * 0.0131 + 1.7) * 52;
  };
  E.half = function(){ return waveCfg().half; };

  function addFx(text, x, y, bad){ E.fx.push({ text:text, x:x, y:y, t:900, bad:!!bad }); }

  function takeHit(reason, x, y){
    if (E.elapsed < E.ship.invulnUntil) return;
    E.playerHits++;
    E.combo = 0;
    E.ship.invulnUntil = E.elapsed + 1000;
    E.ship.flash = 1000;
    addFx(reason, x, y, true);
  }

  E.fire = function(){
    if (E.over) return false;
    if (E.ship.cooldown > 0) return false;
    E.ship.cooldown = cfg.shotCooldown;
    E.shots.push({ x: E.ship.x + E.ship.w/2 - 2, y: E.ship.y - 6, w: 4, h: 10 });
    return true;
  };

  function spawnPrize(){
    var wc = waveCfg();
    E.prizeSeq++;
    var fat = wc.fatEvery > 0 && (E.prizeSeq % wc.fatEvery === 0);
    var w = fat ? 40 : 28, h = fat ? 30 : 22;
    var cx = E.center(E.scroll + H + 40), hw = E.half();
    var x = cx - hw + 14 + rng() * (hw * 2 - 28 - w);
    E.prizes.push({ x:x, y:-h, w:w, h:h, hp: fat ? 2 : 1, fat:fat, pts: fat ? cfg.fatPts : cfg.hitPts, sway: 8 + rng()*10, phase: rng()*6.28, baseX:x });
    E.spawned++;
  }
  function spawnNavy(){
    var wc = waveCfg();
    var cx = E.center(E.scroll + H + 40), hw = E.half();
    var x = cx - hw + 12 + rng() * (hw * 2 - 24 - 30);
    E.navy.push({ x:x, y:-30, w:30, h:24, vx:(rng()<0.5?-1:1) * wc.navySway, baseX:x });
  }
  function spawnStorm(){
    var cx = E.center(E.scroll + H + 40), hw = E.half();
    var x = cx - hw + rng() * (hw * 2 - 46);
    E.storms.push({ x:x, y:-46, w:46, h:42, vx:(rng()<0.5?-1:1)*26 });
  }
  function spawnPort(){
    var cx = E.center(E.scroll + H + 40), hw = E.half();
    var side = rng() < 0.5 ? -1 : 1;
    var x = cx + side * (hw - 30);
    E.ports.push({ x:x - 18, y:-30, w:36, h:30, used:false });
  }

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var wc = waveCfg();
    E.scroll += wc.scroll * s;

    // powder and provisions burn down as you sail; empty hold ends the run
    E.supply -= cfg.supplyDrain * s;
    if (E.supply <= 0){ E.supply = 0; E.over = true; E.outOfSupply = true; }

    // the ship answers the helm
    if (E.ship.cooldown > 0) E.ship.cooldown -= dt;
    if (E.ship.flash > 0) E.ship.flash -= dt;
    var sp = cfg.shipSpeed * s;
    if (E.input.left)  E.ship.x -= sp;
    if (E.input.right) E.ship.x += sp;
    if (E.input.up)    E.ship.y = Math.max(H*0.42, E.ship.y - sp);
    if (E.input.down)  E.ship.y = Math.min(H - 50, E.ship.y + sp);
    E.ship.x = Math.max(4, Math.min(E.ship.x, W - 4 - E.ship.w));

    // run aground if you stray onto the reef banks
    var cx = E.center(E.scroll + (H - E.ship.y)), hw = E.half();
    if (E.ship.x < cx - hw){ E.ship.x = cx - hw; takeHit((cfg.lines && cfg.lines.aground) || "RUN AGROUND", E.ship.x, E.ship.y - 12); }
    if (E.ship.x + E.ship.w > cx + hw){ E.ship.x = cx + hw - E.ship.w; takeHit((cfg.lines && cfg.lines.aground) || "RUN AGROUND", E.ship.x, E.ship.y - 12); }

    // a short wake for motion
    if (E.elapsed % 60 < dt) E.wake.push({ x: E.ship.x + E.ship.w/2, y: E.ship.y + E.ship.h, t: 500 });

    // spawn the lane's traffic
    if (E.spawned < wc.count){
      E.spawnTimer -= dt;
      if (E.spawnTimer <= 0){ spawnPrize(); E.spawnTimer = wc.spawnGap; }
    }
    E.navyTimer -= dt; if (E.navyTimer <= 0){ spawnNavy(); E.navyTimer = wc.navyGap; }
    E.stormTimer -= dt; if (E.stormTimer <= 0){ spawnStorm(); E.stormTimer = wc.stormGap; }
    E.portTimer -= dt; if (E.portTimer <= 0){ spawnPort(); E.portTimer = cfg.portGap; }

    // everything in the lane streams downstream as you sail up it
    var dy = wc.scroll * s;
    function drift(arr){ for (var i=arr.length-1;i>=0;i--){ if (arr[i].y > H + 50) arr.splice(i,1); } }

    for (var i = E.prizes.length - 1; i >= 0; i--){
      var p = E.prizes[i];
      p.y += dy;
      p.x = p.baseX + Math.sin(E.elapsed/600 + p.phase) * p.sway;
      if (p.y > H + 40) E.prizes.splice(i, 1);
    }
    for (var n = E.navy.length - 1; n >= 0; n--){
      var nv = E.navy[n];
      nv.y += dy; nv.x += nv.vx * s;
      var ncx = E.center(E.scroll + (H - nv.y)), nhw = E.half();
      if (nv.x < ncx - nhw){ nv.x = ncx - nhw; nv.vx = Math.abs(nv.vx); }
      if (nv.x + nv.w > ncx + nhw){ nv.x = ncx + nhw - nv.w; nv.vx = -Math.abs(nv.vx); }
      if (nv.y > H + 40){ E.navy.splice(n, 1); continue; }
      if (rectsOverlap(nv.x, nv.y, nv.w, nv.h, E.ship.x, E.ship.y, E.ship.w, E.ship.h))
        takeHit((cfg.lines && cfg.lines.navy) || "THE NAVY RAKED YOU", E.ship.x, E.ship.y - 12);
    }
    for (var st = E.storms.length - 1; st >= 0; st--){
      var so = E.storms[st];
      so.y += dy; so.x += so.vx * s;
      if (so.y > H + 50){ E.storms.splice(st, 1); continue; }
      if (rectsOverlap(so.x+6, so.y+6, so.w-12, so.h-12, E.ship.x, E.ship.y, E.ship.w, E.ship.h))
        takeHit((cfg.lines && cfg.lines.storm) || "A SQUALL THREW THE HELM", E.ship.x, E.ship.y - 12);
    }
    for (var pt = E.ports.length - 1; pt >= 0; pt--){
      var po = E.ports[pt];
      po.y += dy;
      if (po.y > H + 40){ E.ports.splice(pt, 1); continue; }
      if (!po.used && rectsOverlap(po.x, po.y, po.w, po.h, E.ship.x, E.ship.y, E.ship.w, E.ship.h)){
        po.used = true;
        E.supply = Math.min(cfg.supplyMax, E.supply + cfg.portRefill);
        E.damagePts += cfg.portBonus;
        addFx("RESUPPLIED +" + cfg.portBonus, E.ship.x, E.ship.y - 14, false);
      }
    }

    // the cannon: shots rise and board prizes, and can rake the navy too
    for (var j = E.shots.length - 1; j >= 0; j--){
      var sh = E.shots[j];
      sh.y -= cfg.shotSpeed * s;
      if (sh.y + sh.h < 0){ E.shots.splice(j, 1); continue; }
      var struck = false;
      for (var k = E.prizes.length - 1; k >= 0; k--){
        var pp = E.prizes[k];
        if (rectsOverlap(sh.x, sh.y, sh.w, sh.h, pp.x, pp.y, pp.w, pp.h)){
          E.shots.splice(j, 1); struck = true; pp.hp--;
          if (pp.hp <= 0){
            E.prizes.splice(k, 1);
            E.hits++; E.damagePts += pp.pts; E.combo++;
            if (E.combo > E.bestCombo) E.bestCombo = E.combo;
            var line = "+" + pp.pts;
            if (E.combo % cfg.comboEvery === 0){ E.comboPts += cfg.comboBonus; line = "STREAK x" + E.combo + " +" + cfg.comboBonus; }
            addFx(line, pp.x + pp.w/2, pp.y, false);
          } else { addFx("HULLED", pp.x + pp.w/2, pp.y, false); }
          break;
        }
      }
      if (struck) continue;
      for (var m = E.navy.length - 1; m >= 0; m--){
        var nn = E.navy[m];
        if (rectsOverlap(sh.x, sh.y, sh.w, sh.h, nn.x, nn.y, nn.w, nn.h)){
          E.shots.splice(j, 1); E.navy.splice(m, 1);
          E.hits++; E.damagePts += cfg.navyPts; E.combo++;
          if (E.combo > E.bestCombo) E.bestCombo = E.combo;
          addFx("NAVY SUNK +" + cfg.navyPts, nn.x + nn.w/2, nn.y, false);
          break;
        }
      }
    }
    drift(E.wake);
    for (var wq = E.wake.length - 1; wq >= 0; wq--){ E.wake[wq].t -= dt; E.wake[wq].y += dy; if (E.wake[wq].t <= 0) E.wake.splice(wq, 1); }
    for (var f = E.fx.length - 1; f >= 0; f--){ E.fx[f].t -= dt; E.fx[f].y -= 18 * s; if (E.fx[f].t <= 0) E.fx.splice(f, 1); }

    // a wave clears when its prizes are spawned and the lane ahead is empty
    if (E.spawned >= wc.count && E.prizes.length === 0){
      if (E.wave < cfg.waves.length - 1){
        E.wave++; E.spawned = 0; E.spawnTimer = 700;
        addFx("LEG " + (E.wave + 1), W/2, H/2 - 40, false);
      } else if (E.navy.length === 0 && E.storms.length === 0){
        E.over = true;
      }
    }
  };

  E.score = function(){
    var clean = (E.playerHits === 0 && !E.outOfSupply);
    var noHit = clean ? cfg.noHitBonus : 0;
    var speed = (E.over && !E.outOfSupply)
      ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000)))
      : 0;
    return {
      damage: E.damagePts, comboPts: E.comboPts, bestCombo: E.bestCombo,
      noHit: noHit, speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* ---------- BLACK FLAG RUN renderer ---------- */
function renderSea(){
  var E = arcade, t = G.time;
  ctx.fillStyle = "#0a2230"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // the lane: water in the channel, reef banks outside, scrolling
  for (var y = 0; y <= VIEW_H; y += 8){
    var worldY = E.scroll + (VIEW_H - y);
    var cx = E.center(worldY), hw = E.half();
    // reef banks
    ctx.fillStyle = "#123a2a"; ctx.fillRect(0, y, Math.max(0, cx - hw), 8);
    ctx.fillStyle = "#123a2a"; ctx.fillRect(cx + hw, y, VIEW_W - (cx + hw), 8);
    ctx.fillStyle = "#0e3326"; ctx.fillRect(0, y, Math.max(0, cx - hw - 6), 8);
    ctx.fillStyle = "#0e3326"; ctx.fillRect(cx + hw + 6, y, VIEW_W - (cx + hw + 6), 8);
    // water with a scrolling crest
    ctx.fillStyle = ((Math.floor((worldY)/8) % 2) === 0) ? "#13495f" : "#15506a";
    ctx.fillRect(cx - hw, y, hw * 2, 8);
    if ((Math.floor(worldY/24) % 3) === 0){ ctx.fillStyle = "rgba(150,205,224,.16)"; ctx.fillRect(cx - hw + 8, y + 2, 18, 2); }
    // surf line at the bank edges
    ctx.fillStyle = "rgba(214,238,245,.35)"; ctx.fillRect(cx - hw, y, 3, 8); ctx.fillRect(cx + hw - 3, y, 3, 8);
  }
  // ports
  E.ports.forEach(function(po){
    ctx.fillStyle = po.used ? "#5a4a3a" : "#caa66a"; ctx.fillRect(po.x, po.y, po.w, po.h);
    ctx.fillStyle = "#6e5436"; ctx.fillRect(po.x + 6, po.y - 8, 6, 12);
    ctx.fillStyle = po.used ? "#7a6a40" : "#e8b04b"; ctx.fillRect(po.x + 4, po.y - 12, 14, 5);
  });
  // storms
  E.storms.forEach(function(so){
    var pr = so.w/2;
    ctx.fillStyle = "rgba(24,44,58,.6)"; ctx.beginPath(); ctx.arc(so.x+pr, so.y+pr-4, pr, 0, 7); ctx.fill();
    var ro = (t/40)%10; ctx.fillStyle = "rgba(150,205,224,.6)";
    for (var rx=0; rx<so.w; rx+=7){ ctx.fillRect(so.x+rx, so.y+pr+((ro+rx)%10), 1, 6); }
    if (Math.floor(t/600)%5===0){ ctx.fillStyle="rgba(255,250,210,.85)"; ctx.fillRect(so.x+pr-1, so.y+pr, 3, so.h-pr); }
  });
  // prizes: fat merchant cogs and lean traders
  E.prizes.forEach(function(p){
    ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.fillRect(p.x+2, p.y+p.h-3, p.w-4, 4);
    ctx.fillStyle = p.fat ? "#7a4f28" : "#8a6a44"; ctx.fillRect(p.x, p.y+4, p.w, p.h-6);

    if (p.fat){ ctx.fillStyle="#e8b04b"; ctx.fillRect(p.x+4, p.y+p.h-7, p.w-8, 3); }
  });

    ctx.fillStyle = "#efe6d2"; ctx.fillRect(sh.x+sh.w/2-8+bil3, sh.y+2, 16, 11);
    ctx.fillStyle = "#15121c"; ctx.fillRect(sh.x+sh.w/2+1, sh.y-8, 7, 5);  // black flag
  }

  E.fx.forEach(function(fx){
    ctx.fillStyle = fx.bad ? "#e25549" : "#7fe5b0";
    ctx.font = "9px 'Press Start 2P', monospace"; ctx.textAlign = "center";
    ctx.globalAlpha = Math.max(0, Math.min(1, fx.t/900));
    ctx.fillText(fx.text, fx.x, fx.y); ctx.globalAlpha = 1;
  });
  // HUD: the supply gauge, the score, the leg, the streak
  ctx.fillStyle = "rgba(13,10,18,.7)"; ctx.fillRect(0, 0, VIEW_W, 28);
  ctx.fillStyle = "#cfc8b8"; ctx.font = "8px 'Press Start 2P', monospace"; ctx.textAlign = "left";

}

/* ---------- The luminous plaza: ground ---------- */
function drawVenusGround(c, x, y, sx, sy){
  if (c === "."){
    // a clean plaza: cool slate panels with glowing seams and a slow light sweep
    var base = ((x + y) % 2 === 0) ? "#1b3450" : "#18304a";
    ctx.fillStyle = base; ctx.fillRect(sx, sy, TILE, TILE);
    // panel seams in soft teal
    ctx.fillStyle = "rgba(90,200,210,.10)";
    ctx.fillRect(sx, sy, TILE, 1); ctx.fillRect(sx, sy, 1, TILE);
    // a pulsing light node on a subset of panels
    if ((x * 3 + y * 5) % 6 === 0){
      var pul = (Math.sin(G.time / 700 + x * 0.6 + y * 0.4) + 1) / 2;
      ctx.fillStyle = "rgba(120,225,224," + (0.06 + pul * 0.12).toFixed(3) + ")";
      ctx.fillRect(sx + 12, sy + 12, 8, 8);
    }
    // a diagonal light sweep drifting across the floor
    var sweep = (G.time / 22 + x * 9 - y * 5) % 96;
    if (sweep < 10){ ctx.fillStyle = "rgba(190,235,240,.07)"; ctx.fillRect(sx, sy, TILE, TILE); }
  } else if (c === "T"){
    // a biome column: a translucent glass tube of greenery with a glowing rim
    ctx.fillStyle = "#152a40"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "rgba(90,200,210,.14)"; ctx.fillRect(sx + 5, sy + 2, TILE - 10, TILE - 2);
    ctx.fillStyle = "#2f7a52"; ctx.fillRect(sx + 8, sy + 5, TILE - 16, TILE - 8);
    ctx.fillStyle = "#46a06a"; ctx.fillRect(sx + 10, sy + 7, TILE - 20, TILE - 14);
    var gl = Math.floor(G.time / 360 + x + y) % 2 === 0;
    ctx.fillStyle = gl ? "rgba(120,225,224,.6)" : "rgba(120,225,224,.3)";
    ctx.fillRect(sx + 5, sy + 2, TILE - 10, 2);
    ctx.fillStyle = "#bfe9ea"; ctx.fillRect(sx + 14, sy + 9, 3, 6);
  } else if (c === "C"){
    // a light well: a circular glow set into the floor with rising motes
    ctx.fillStyle = "#16304a"; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = "rgba(120,225,224,.16)"; ctx.beginPath(); ctx.arc(sx + 16, sy + 16, 13, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(190,235,240,.5)"; ctx.beginPath(); ctx.arc(sx + 16, sy + 16, 6, 0, 7); ctx.fill();
    ctx.fillStyle = "rgba(232,210,150,.55)"; ctx.beginPath(); ctx.arc(sx + 16, sy + 16, 3, 0, 7); ctx.fill();
    for (var m = 0; m < 3; m++){
      var mt = (G.time / 1400 + m * 0.33 + x * 0.1) % 1;
      ctx.fillStyle = "rgba(190,235,240," + (0.5 - mt * 0.4).toFixed(2) + ")";
      ctx.fillRect(sx + 12 + m * 4, sy + 22 - mt * 18, 2, 2);
    }
  } else {
    ctx.fillStyle = "#142840"; ctx.fillRect(sx, sy, TILE, TILE);
  }
}

/* ---------- City decor: ambient candy of the future ---------- */
function drawVenusDecor(d, sx, sy){
  var t = G.time;
  if (d.kind === "beacon"){
    // a tall light beacon, a slow color breath up its length
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(sx + 10, sy + 20, 12, 4);
    ctx.fillStyle = "#26424f"; ctx.fillRect(sx + 13, sy - 30, 6, 50);
    var br = (Math.sin(t / 600) + 1) / 2;
    ctx.fillStyle = "rgba(120,225,224," + (0.3 + br * 0.4).toFixed(2) + ")"; ctx.fillRect(sx + 14, sy - 28, 4, 46);
    ctx.fillStyle = "#bfe9ea"; ctx.fillRect(sx + 12, sy - 34, 8, 6);
    if (br > 0.6){ ctx.fillStyle = "rgba(120,225,224,.18)"; ctx.beginPath(); ctx.arc(sx + 16, sy - 31, 12, 0, 7); ctx.fill(); }
  } else if (d.kind === "holotree"){
    // a holographic tree projection that flickers and scans
    var fl = Math.floor(t / 120) % 8 !== 0;
    ctx.fillStyle = "rgba(90,200,210,.16)"; ctx.fillRect(sx + 6, sy + 22, 20, 3);
    if (fl){
      ctx.fillStyle = "rgba(70,200,170,.5)"; ctx.fillRect(sx + 14, sy + 4, 4, 20);
      ctx.fillStyle = "rgba(90,225,180,.4)";
      ctx.beginPath(); ctx.arc(sx + 16, sy + 6, 12, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(150,240,210,.5)";
      ctx.beginPath(); ctx.arc(sx + 16, sy + 5, 7, 0, 7); ctx.fill();
      var scan = (t / 30) % 24;
      ctx.fillStyle = "rgba(190,255,235,.5)"; ctx.fillRect(sx + 4, sy - 6 + scan, 24, 1);
    }
  } else if (d.kind === "skytraffic"){
    // a lane of flying cars drifting across, overhead
    for (var i = 0; i < 3; i++){
      var sp = (t / 14 + i * 60) % 160 - 40;
      var fy = sy - 30 + i * 9;
      ctx.fillStyle = i % 2 === 0 ? "#7fb2e5" : "#bfe9ea";
      ctx.fillRect(sx - 30 + sp, fy, 14, 5);
      ctx.fillStyle = "rgba(232,210,150,.7)"; ctx.fillRect(sx - 30 + sp + 13, fy + 1, 3, 3);
      ctx.fillStyle = "rgba(120,225,224,.25)"; ctx.fillRect(sx - 30 + sp - 6, fy + 1, 6, 3);
    }
  } else if (d.kind === "lightfountain"){
    // a fountain of light: rising luminous jets instead of water
    ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fillRect(sx + 4, sy + 22, 26, 4);
    ctx.fillStyle = "#1f4f5a"; ctx.fillRect(sx + 6, sy + 18, 22, 6);
    for (var j = 0; j < 6; j++){
      var jt = (t / 900 + j * 0.16) % 1;
      var jx = sx + 8 + j * 3.4 + Math.sin(jt * 6.28 + j) * 3;
      var jy = sy + 18 - jt * 20;
      ctx.fillStyle = "rgba(120,225,224," + (0.7 - jt * 0.6).toFixed(2) + ")";
      ctx.fillRect(jx, jy, 3, 4);
    }
    ctx.fillStyle = "rgba(190,235,240,.5)"; ctx.fillRect(sx + 8, sy + 18, 18, 2);
  } else if (d.kind === "hologlobe"){
    // a slowly rotating holographic globe on a pedestal
    ctx.fillStyle = "#26424f"; ctx.fillRect(sx + 12, sy + 16, 8, 10);
    var spin = t / 700;
    ctx.fillStyle = "rgba(90,200,210,.3)"; ctx.beginPath(); ctx.arc(sx + 16, sy + 8, 11, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(150,240,210,.7)"; ctx.lineWidth = 1;
    for (var r = 0; r < 3; r++){
      ctx.beginPath();
      ctx.ellipse ? ctx.ellipse(sx + 16, sy + 8, 10, 3 + r * 2, spin + r, 0, 7) : ctx.arc(sx + 16, sy + 8, 10 - r * 2, 0, 7);
      ctx.stroke();
    }
    ctx.fillStyle = "#bfe9ea"; ctx.beginPath(); ctx.arc(sx + 16, sy + 8, 2, 0, 7); ctx.fill();
  } else if (d.kind === "vinewall"){
    // a vertical garden panel, leaves swaying, with grow lights
    ctx.fillStyle = "#1c3a44"; ctx.fillRect(sx + 4, sy + 2, 24, 24);
    var sway = Math.round(Math.sin(t / 700 + sx) * 2);
    ctx.fillStyle = "#2f7a52";
    for (var vx = 0; vx < 4; vx++){
      for (var vy = 0; vy < 4; vy++){
        ctx.fillRect(sx + 6 + vx * 6 + (vy % 2 ? sway : 0), sy + 4 + vy * 6, 5, 5);
      }
    }
    ctx.fillStyle = "rgba(150,240,210,.3)"; ctx.fillRect(sx + 4, sy + 2, 24, 2);
    var gl = Math.floor(t / 500) % 2 === 0;
    ctx.fillStyle = gl ? "rgba(232,150,210,.4)" : "rgba(232,150,210,.2)"; ctx.fillRect(sx + 4, sy + 24, 24, 2);
  } else if (d.kind === "solartree"){
    // a solar collector tree, panels turning to a slow sun
    ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fillRect(sx + 10, sy + 22, 12, 3);
    ctx.fillStyle = "#26424f"; ctx.fillRect(sx + 14, sy + 4, 4, 20);
    var tilt = Math.round(Math.sin(t / 1200) * 3);
    ctx.fillStyle = "#1f3a6a";
    ctx.fillRect(sx + 4, sy + 2 + tilt, 10, 7); ctx.fillRect(sx + 18, sy + 2 - tilt, 10, 7);
    ctx.fillStyle = "rgba(120,180,235,.5)";
    ctx.fillRect(sx + 5, sy + 3 + tilt, 8, 2); ctx.fillRect(sx + 19, sy + 3 - tilt, 8, 2);
    var gl2 = Math.floor(t / 600) % 2 === 0;
    if (gl2){ ctx.fillStyle = "rgba(232,210,150,.4)"; ctx.fillRect(sx + 14, sy + 8, 4, 3); }
  } else if (d.kind === "mistjet"){
    // a cooling mist jet, a soft cloud that breathes out and fades
    var mt = (t / 1300) % 1;
    ctx.fillStyle = "#26424f"; ctx.fillRect(sx + 13, sy + 18, 6, 6);
    ctx.fillStyle = "rgba(190,235,240," + (0.4 - mt * 0.35).toFixed(2) + ")";
    var sprd = mt * 14;
    ctx.beginPath(); ctx.arc(sx + 16, sy + 14 - mt * 8, 4 + sprd, 0, 7); ctx.fill();
  } else if (d.kind === "benchpod"){
    // a curved seating pod with a soft underglow
    ctx.fillStyle = "rgba(0,0,0,.16)"; ctx.fillRect(sx + 3, sy + 18, 26, 4);
    ctx.fillStyle = "#2a4a58"; ctx.fillRect(sx + 4, sy + 10, 24, 9);
    ctx.fillStyle = "#36606e"; ctx.fillRect(sx + 4, sy + 8, 24, 4);
    var br = (Math.sin(t / 800) + 1) / 2;
    ctx.fillStyle = "rgba(120,225,224," + (0.2 + br * 0.3).toFixed(2) + ")"; ctx.fillRect(sx + 4, sy + 19, 24, 2);
  }
}

/* ---------- City critters: resident bots and microdrones ---------- */
function drawVenusCritter(c, sx, sy){
  var f = c.flip < 0 ? -1 : 1;
  var t = G.time;
  if (c.kind === "skydrone"){
    // a sleek courier drone hovering with a sweeping sensor light
    var hov = Math.round(Math.sin(t / 240 + (c.hx || 0)) * 3);
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx + 2, sy + 16, 12, 3);
    ctx.fillStyle = "#cfe2ef"; ctx.fillRect(sx + 3, sy - 12 + hov, 10, 5);
    ctx.fillStyle = "#7fb2e5"; ctx.fillRect(sx + 3, sy - 12 + hov, 10, 2);
    var spin = Math.floor(t / 70) % 2 === 0;
    ctx.fillStyle = "rgba(190,235,240,.6)";
    if (spin){ ctx.fillRect(sx - 2, sy - 13 + hov, 7, 1); ctx.fillRect(sx + 11, sy - 13 + hov, 7, 1); }
    else { ctx.fillRect(sx - 1, sy - 15 + hov, 1, 5); ctx.fillRect(sx + 14, sy - 15 + hov, 1, 5); }
    var bl = Math.floor(t / 360) % 2 === 0;
    ctx.fillStyle = bl ? "#78e9e0" : "#2a6a64"; ctx.fillRect(sx + 7, sy - 8 + hov, 2, 2);
  } else if (c.kind === "servobot"){
    // a small rolling service bot with a friendly light eye
    var roll = Math.round(Math.sin(t / 200) * 1);
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx + 1, sy + 13, 14, 3);
    ctx.fillStyle = "#cfd8e0"; ctx.fillRect(sx + 1, sy + 2, 14, 11);
    ctx.fillStyle = "#9aa6b8"; ctx.fillRect(sx + 1, sy + 9, 14, 4);
    ctx.fillStyle = "#2a3340"; ctx.fillRect(sx + 3, sy + 4, 10, 5);
    var bl = Math.floor(t / 500) % 2 === 0;
    ctx.fillStyle = bl ? "#78e9e0" : "#2f6a64"; ctx.fillRect(sx + (f > 0 ? 8 : 4), sy + 5, 4, 3);
    ctx.fillStyle = "#36606e"; ctx.fillRect(sx + 2 + roll, sy + 13, 4, 3); ctx.fillRect(sx + 10 - roll, sy + 13, 4, 3);
  } else if (c.kind === "butterdrone"){
    // a pollinator microdrone, wings of light, drifting like a butterfly
    var g = (t / 1000 + (c.hx || 0) * 0.06) % 1;
    var fy = sy + 4 - Math.sin(g * 6.28) * 6;
    var wing = Math.floor(t / 90) % 2 === 0;
    ctx.fillStyle = "#2a3340"; ctx.fillRect(sx + 7, fy, 3, 7);
    ctx.fillStyle = wing ? "rgba(232,150,210,.7)" : "rgba(232,150,210,.4)";
    ctx.fillRect(sx + (wing ? 2 : 4), fy, 5, 5); ctx.fillRect(sx + 10, fy, 5, 5);
    ctx.fillStyle = wing ? "rgba(120,225,224,.7)" : "rgba(120,225,224,.4)";
    ctx.fillRect(sx + (wing ? 2 : 4), fy + 4, 4, 3); ctx.fillRect(sx + 10, fy + 4, 4, 3);
  } else if (c.kind === "robird"){
    // a robotic songbird, metal sheen, a clicking beak
    var flap = Math.floor(t / 160 + (c.hx || 0)) % 2 === 0;
    ctx.fillStyle = "#8aa0b0";
    if (flap){ ctx.fillRect(sx, sy + 2, 8, 3); ctx.fillRect(sx + 8, sy + 2, 8, 3); }
    else { ctx.fillRect(sx + 2, sy, 6, 3); ctx.fillRect(sx + 8, sy, 6, 3); }
    ctx.fillStyle = "#aebccc"; ctx.fillRect(sx + 6, sy + 1, 5, 5);
    ctx.fillStyle = "#78e9e0"; ctx.fillRect(sx + (f > 0 ? 9 : 6), sy + 2, 2, 2);
    ctx.fillStyle = "#e8b04b"; ctx.fillRect(sx + (f > 0 ? 11 : 5), sy + 3, 2, 1);
  } else if (c.kind === "petbot"){
    // a small companion bot, trotting on soft legs, a wagging light tail
    var step = Math.floor(t / 200) % 2 === 0 ? 1 : 0;
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(sx + 2, sy + 14, 14, 3);
    ctx.fillStyle = "#d8c0a0"; ctx.fillRect(sx + 2, sy + 5, 13, 8);
    ctx.fillStyle = "#c0a888"; ctx.fillRect(sx + (f > 0 ? 12 : 0), sy + 3, 6, 6);
    ctx.fillStyle = "#2a3340"; ctx.fillRect(sx + (f > 0 ? 14 : 1), sy + 5, 2, 2);
    var wag = Math.round(Math.sin(t / 160) * 2);
    ctx.fillStyle = "#78e9e0"; ctx.fillRect(sx + (f > 0 ? 0 : 14), sy + 4 + wag, 3, 2);
    ctx.fillStyle = "#b09878"; ctx.fillRect(sx + 3, sy + 13, 2, 3); ctx.fillRect(sx + 11, sy + 13 - step, 2, 3);
  } else if (c.kind === "spheredroid"){
    // a floating sphere droid bobbing with an orbiting spark
    var hov = Math.round(Math.sin(t / 300 + (c.hx || 0)) * 4);
    ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.fillRect(sx + 3, sy + 16, 12, 3);
    ctx.fillStyle = "#c0cad6"; ctx.beginPath(); ctx.arc(sx + 9, sy + 6 + hov, 7, 0, 7); ctx.fill();
    ctx.fillStyle = "#8a98a8"; ctx.beginPath(); ctx.arc(sx + 9, sy + 8 + hov, 7, 0, 3.2); ctx.fill();
    ctx.fillStyle = "#78e9e0"; ctx.beginPath(); ctx.arc(sx + 9, sy + 5 + hov, 2, 0, 7); ctx.fill();
    var oa = t / 300;
    ctx.fillStyle = "rgba(232,210,150,.9)";
    ctx.fillRect(sx + 9 + Math.cos(oa) * 10 - 1, sy + 6 + hov + Math.sin(oa) * 5 - 1, 2, 2);
  }
}

/* ---------- The player: a resident on a hover plate ---------- */
function drawVenusPlayer(px, py, bobp){
  var p = G.player, t = G.time;
  var face = (p.dir === "left") ? -1 : 1;
  // a teal hover ring stands in for the ground shadow
  var pulse = (Math.sin(t / 240) + 1) / 2;
  ctx.fillStyle = "rgba(120,225,224," + (0.18 + pulse * 0.22).toFixed(2) + ")";
  ctx.beginPath(); ctx.ellipse ? ctx.ellipse(px + p.w / 2, py + p.h - 1, p.w / 2, 4, 0, 0, 7) : ctx.arc(px + p.w / 2, py + p.h - 1, p.w / 2, 0, 7); ctx.fill();
  ctx.fillStyle = "#78e9e0"; ctx.fillRect(px + 2, py + p.h - 3 + bobp, p.w - 4, 2);
  // a sleek luminous jumpsuit
  ctx.fillStyle = "#2f5a6e"; ctx.fillRect(px, py + 8 + bobp, p.w, p.h - 10);
  ctx.fillStyle = "#3f7a8e"; ctx.fillRect(px + 2, py + 9 + bobp, p.w - 4, 4);
  ctx.fillStyle = "rgba(120,225,224,.7)"; ctx.fillRect(px + p.w / 2 - 1, py + 10 + bobp, 2, p.h - 14); // light seam
  // face and a soft visor
  ctx.fillStyle = "#e8c39e"; ctx.fillRect(px + 4, py + bobp, p.w - 8, 12);
  ctx.fillStyle = "#243a44"; ctx.fillRect(px + 3, py - 3 + bobp, p.w - 6, 6);     // hair/cap
  ctx.fillStyle = "rgba(120,225,224,.6)"; ctx.fillRect(px + 4, py + 3 + bobp, p.w - 8, 3); // visor band
  if (p.dir !== "up"){ ctx.fillStyle = "#15121c"; ctx.fillRect(px + (face > 0 ? 7 : 5), py + 4 + bobp, 2, 2); ctx.fillRect(px + p.w - 9, py + 4 + bobp, 2, 2); }
}

/* ---------- City pavilion facades, custom per site ---------- */
function vPlinth(bx, by, bw, bh){
  // a luminous base platform under each structure with a soft light skirt
  ctx.fillStyle = "rgba(120,225,224,.18)"; ctx.fillRect(bx - 8, by + bh - 12, bw + 16, 18);
  ctx.fillStyle = "#1c3a44"; ctx.fillRect(bx - 4, by + bh - 10, bw + 8, 14);
  ctx.fillStyle = "#2a4a58"; ctx.fillRect(bx, by + bh - 8, bw, 7);
  var br = Math.floor(G.time / 500) % 2 === 0;
  ctx.fillStyle = br ? "rgba(120,225,224,.6)" : "rgba(120,225,224,.35)";
  ctx.fillRect(bx, by + bh - 2, bw, 2);
}
BUILDING_ART.instituteV = function(b, bx, by, bw, bh){
  vPlinth(bx, by, bw, bh);
  // a domed hall of learning with a glowing oculus
  ctx.fillStyle = "#234c57"; ctx.fillRect(bx, by + 12, bw, bh - 10);
  ctx.fillStyle = "#2f6e7a"; ctx.fillRect(bx, by + 12, bw, 4);
  ctx.fillStyle = "#1f4f5a"; ctx.beginPath(); ctx.arc(bx + bw / 2, by + 12, bw / 2, 3.14, 0); ctx.fill();
  var gl = Math.floor(G.time / 500) % 2 === 0;
  ctx.fillStyle = gl ? "#bfe9ea" : "#6ea8b0"; ctx.beginPath(); ctx.arc(bx + bw / 2, by + 8, 6, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(190,235,240,.7)"; for (var wx = bx + 8; wx < bx + bw - 6; wx += 12){ ctx.fillRect(wx, by + 22, 6, bh - 20); }
};
BUILDING_ART.allochubV = function(b, bx, by, bw, bh){
  vPlinth(bx, by, bw, bh);

  ctx.fillStyle = "#244c63"; ctx.fillRect(bx, by + 12, bw, bh - 10);
  ctx.fillStyle = "#3a6e8a"; ctx.fillRect(bx, by + 12, bw, 4);

  var fl = (G.time / 40) % 16;
  ctx.fillStyle = "rgba(120,225,224,.5)";

  ctx.fillStyle = "#bfe9ea"; ctx.beginPath(); ctx.arc(bx + bw / 2, by + 26, 5, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(190,235,240,.6)"; ctx.beginPath(); ctx.arc(bx + bw / 2, by + 26, 9, 0, 7); ctx.fill();
};
BUILDING_ART.designlabV = function(b, bx, by, bw, bh){
  vPlinth(bx, by, bw, bh);
  // a lab crowned with a wireframe model under a scanning grid
  ctx.fillStyle = "#314e72"; ctx.fillRect(bx, by + 12, bw, bh - 10);
  ctx.fillStyle = "#4a6e9e"; ctx.fillRect(bx, by + 12, bw, 4);
  ctx.strokeStyle = "rgba(150,200,240,.6)"; ctx.lineWidth = 1;
  for (var gx = bx + 6; gx < bx + bw; gx += 8){ ctx.beginPath(); ctx.moveTo(gx, by + 18); ctx.lineTo(gx, by + bh - 2); ctx.stroke(); }
  // a floating wireframe model above the roof
  var rot = G.time / 800;
  ctx.strokeStyle = "rgba(120,225,224,.8)";

  ctx.beginPath(); ctx.moveTo(mcx - mr, mcy); ctx.lineTo(mcx, mcy - mr + Math.sin(rot) * 2); ctx.lineTo(mcx + mr, mcy); ctx.lineTo(mcx, mcy + mr); ctx.closePath(); ctx.stroke();
  ctx.lineWidth = 1;
};
BUILDING_ART.fabfarmV = function(b, bx, by, bw, bh){
  vPlinth(bx, by, bw, bh);
  // a greenhouse and fab block: vine racks beside a working arm
  ctx.fillStyle = "#28543c"; ctx.fillRect(bx, by + 12, bw, bh - 10);
  ctx.fillStyle = "#3f7a5a"; ctx.fillRect(bx, by + 12, bw, 4);
  // glass vine tiers
  ctx.fillStyle = "rgba(120,225,180,.3)"; ctx.fillRect(bx + 4, by + 18, bw / 2 - 6, bh - 18);

  var sw = Math.round(Math.sin(G.time / 360) * 4);
  ctx.fillStyle = "#9aa6b8"; ctx.fillRect(bx + bw - 16, by + 20, 4, bh - 20);
  ctx.fillStyle = "#cfd8e0"; ctx.fillRect(bx + bw - 16, by + 22, 10 + sw, 3);
  ctx.fillStyle = "#78e9e0"; ctx.fillRect(bx + bw - 8 + sw, by + 22, 3, 3);
};
BUILDING_ART.archiveV = function(b, bx, by, bw, bh){
  vPlinth(bx, by, bw, bh);
  // a quiet archive: a tall glass stack of data spindles, softly lit
  ctx.fillStyle = "#474472"; ctx.fillRect(bx, by + 12, bw, bh - 10);
  ctx.fillStyle = "#6e6a9e"; ctx.fillRect(bx, by + 12, bw, 4);
  for (var sx2 = bx + 6; sx2 < bx + bw - 4; sx2 += 10){
    ctx.fillStyle = "#2a2848"; ctx.fillRect(sx2, by + 18, 6, bh - 16);

  }
  ctx.fillStyle = "#bfa9ea"; ctx.fillRect(bx + bw / 2 - 6, by + 6, 12, 5);  // a soft sign light, no text
};
BUILDING_ART.immersionV = function(b, bx, by, bw, bh){
  vPlinth(bx, by, bw, bh);
  // a dim dome glowing with shifting immersion colors, a soft trap
  ctx.fillStyle = "#3a3060"; ctx.fillRect(bx, by + 12, bw, bh - 10);
  ctx.fillStyle = "#5a4a8a"; ctx.beginPath(); ctx.arc(bx + bw / 2, by + 14, bw / 2, 3.14, 0); ctx.fill();

};
BUILDING_ART.statusV = function(b, bx, by, bw, bh){
  vPlinth(bx, by, bw, bh);
  // a gilded court with a ranked podium, status that returns without money
  ctx.fillStyle = "#5d4524"; ctx.fillRect(bx, by + 12, bw, bh - 10);
  ctx.fillStyle = "#8a6a3c"; ctx.fillRect(bx, by + 12, bw, 4);

  ctx.fillStyle = "#caa23f"; ctx.fillRect(bx + bw / 2 - 4, by + 16, 8, bh - 14);

  ctx.fillStyle = "#e8b04b"; ctx.fillRect(bx + 6 + wv, by + 16, 6, 4); ctx.fillRect(bx + bw - 12 - wv, by + 18, 6, 4);
};

  var dive = el("button", "choice", "Dive into the immersion  (+10 pts, but SLOWED for 30s once you leave)");

  var resist = el("button", "choice", "Just look in, then step back out  (+5 pts)");
  resist.addEventListener("click", function(){
    if (room._resisted || immersionDove) return;
    room._resisted = true;
    G.runPoints += 5;
    verdict.style.display = "block";
    verdict.classList.remove("bad");
    verdict.innerHTML = "Temptation passed. The Commons never made you come in, and it never makes you stay. The freed time is yours to spend with intent.";
    refreshHUD();
  });

  var back = el("button", "btn ghost", "BACK TO THE CITY");
  back.addEventListener("click", closeInterior);
  room.appendChild(dive); room.appendChild(resist); room.appendChild(verdict); room.appendChild(back);
  interiorInner.appendChild(room);
}

/* ---------- The Status Court: status returns even when money does not.
   The casino bet is the reference: posted odds, a positional good. ---------- */
function buildStatusRoom(b){
  var room = el("div", "room temptation");
  room.appendChild(el("div", "place", b.name));
  room.appendChild(el("div", "host", "HERALD VANTA"));
  room.appendChild(el("div", "speech",
    "No one here is rich, because no one here is poor. But everyone still wants to be first. Stake your standing on the next contest. You place 9 times in 20. The rest go home a rung lower. Recognition is the one thing we never made abundant."));
  var verdict = el("div", "verdict");

  [10, 25, 50].forEach(function(stake){
    var btn = el("button", "choice", "Stake " + stake + " run points on your standing");
    btn.addEventListener("click", function(){
      if (G.runPoints < stake){
        verdict.style.display = "block"; verdict.classList.add("bad");
        verdict.innerHTML = "Standing is staked in points here. You need " + stake + " to enter.";
        return;
      }
      var win = rng() < 0.45;
      verdict.style.display = "block";
      if (win){
        G.runPoints += stake;
        verdict.classList.remove("bad");
        verdict.innerHTML = "YOU PLACED. +" + stake + " pts. You rose a rung. Someone else fell one, because rank is the one thing that cannot be shared.";
      } else {
        G.runPoints -= stake;
        verdict.classList.add("bad");
        verdict.innerHTML = "YOU SLIPPED. " + stake + " pts gone. Status is a game where the city as a whole gains nothing. That is the cost it hides.";
      }
      refreshHUD();
    });
    room.appendChild(btn);
  });

  var back = el("button", "btn ghost", "BACK TO THE CITY");
  back.addEventListener("click", closeInterior);
  room.appendChild(verdict); room.appendChild(back);
  interiorInner.appendChild(room);
}

/* =====================================================
   SOFT LANDING. The Chapter 6 cabinet. M20 S4. A physics
   lander in the Lunar Lander tradition, and a brand new
   engine, the sixth distinct chapter engine with no repeat:
   joust, shooter, catcher, stacker, sea scroller, and now
   lander. The player verb is allocate. You ferry resource
   pods down onto the city's landing pads with finite thrust
   and fuel, because abundance still obeys gravity. Descend
   too fast, drift off the pad, or run the tanks dry and the
   pod is lost. As the finale cabinet it is the hardest, dialed
   above the Piracy sea scroller. Public API mirrors the other
   engines: input, fire, update(dt), score, over, banked, hits,
   playerHits, elapsed. Pure state, no DOM, seeded rng.
   ===================================================== */
function LanderEngine(cfg){
  var W = VIEW_W, H = VIEW_H;
  var GROUND_Y = H - 40;
  var E = {
    cfg: cfg, W: W, H: H, kind: "lander",
    level: 0, dropsThisLevel: 0,
    craft: null, pad: null, wind: 0,
    stars: [], dust: [], fx: [],
    input: { left:false, right:false, up:false, down:false },
    elapsed: 0,
    hits: 0, damagePts: 0,
    combo: 0, bestCombo: 0, comboPts: 0,
    playerHits: 0,
    over: false, banked: false, crashedOut: false
  };

  // a still starfield behind the city skyline
  for (var i = 0; i < 60; i++){ E.stars.push({ x: rng() * W, y: rng() * (GROUND_Y - 20), tw: rng() * 6.28 }); }

  function lv(){ return cfg.levels[E.level]; }

  function newCraft(){
    var L = lv();
    E.craft = {
      x: W * (0.3 + rng() * 0.4) - 11, y: 56,
      w: 22, h: 20, vx: (rng() - 0.5) * L.entryDrift, vy: 0,
      fuel: L.fuel, state: "fly", timer: 0, impactV: 0,
      flameUp: 0, flameL: 0, flameR: 0
    };
  }
  function newPad(){
    var L = lv();
    var pw = L.padW;
    E.pad = { x: 24 + rng() * (W - 48 - pw), y: GROUND_Y, w: pw, h: 8, lit: 0 };
    E.wind = L.wind * (rng() < 0.5 ? -1 : 1);
  }
  newPad(); newCraft();

  function addFx(text, x, y, bad){ E.fx.push({ text:text, x:x, y:y, t:1000, bad:!!bad }); }

  function resolveDrop(){
    E.dropsThisLevel++;
    if (E.dropsThisLevel >= lv().drops){
      if (E.level < cfg.levels.length - 1){
        E.level++; E.dropsThisLevel = 0; newPad(); newCraft();
        addFx("SECTOR " + (E.level + 1), W/2, H/2 - 30, false);
      } else {
        E.over = true;
      }
    } else { newPad(); newCraft(); }
  }

  function land(){
    var c = E.craft, L = lv();
    c.state = "land"; c.timer = 700; c.vy = 0; c.vx = 0;
    c.y = GROUND_Y - c.h; E.pad.lit = 1;
    E.hits++; E.combo++;
    if (E.combo > E.bestCombo) E.bestCombo = E.combo;
    var fuelFrac = Math.max(0, c.fuel / L.fuel);
    var gentle = (c.impactV <= L.maxLandV * 0.5);
    var pts = cfg.landPts + Math.round(fuelFrac * cfg.fuelBonus) + (gentle ? cfg.gentleBonus : 0);
    E.damagePts += pts;
    var line = "POD DELIVERED +" + pts;
    if (E.combo % cfg.comboEvery === 0){ E.comboPts += cfg.comboBonus; line = "STREAK x" + E.combo + " +" + cfg.comboBonus; }
    addFx(line, c.x + c.w/2, c.y - 6, false);
  }
  function crash(reason){
    var c = E.craft;
    c.state = "boom"; c.timer = 900;
    E.playerHits++; E.combo = 0;
    // a little debris burst
    for (var d = 0; d < 10; d++){ E.dust.push({ x: c.x + c.w/2, y: c.y + c.h/2, vx: (rng()-0.5)*180, vy: -rng()*160, t: 700 }); }
    addFx(reason, c.x + c.w/2, c.y - 4, true);
  }

  E.fire = function(){
    // a thrust puff, so a tap of SPACE or A also lifts the craft
    if (E.over || !E.craft || E.craft.state !== "fly") return false;
    if (E.craft.fuel <= 0) return false;
    E.craft.vy -= lv().thrust * 0.16;
    E.craft.fuel -= 3;
    E.craft.flameUp = 120;
    return true;
  };

  E.update = function(dt){
    if (E.over) return;
    E.elapsed += dt;
    var s = dt / 1000;
    var c = E.craft, L = lv();
    if (!c) return;

    if (c.state === "land" || c.state === "boom"){
      c.timer -= dt;
      if (E.pad) E.pad.lit = Math.max(0, E.pad.lit - dt/700);
      for (var i = E.dust.length - 1; i >= 0; i--){
        var p = E.dust[i]; p.vy += 420 * s; p.x += p.vx * s; p.y += p.vy * s; p.t -= dt;
        if (p.t <= 0) E.dust.splice(i, 1);
      }
      if (c.timer <= 0){ E.dust = []; resolveDrop(); }
      for (var f0 = E.fx.length - 1; f0 >= 0; f0--){ E.fx[f0].t -= dt; E.fx[f0].y -= 16 * s; if (E.fx[f0].t <= 0) E.fx.splice(f0, 1); }
      return;
    }

    // physics: gravity, wind, and the player's thrust against finite fuel
    c.vy += L.gravity * s;
    c.vx += E.wind * s;
    c.flameUp = Math.max(0, c.flameUp - dt);
    c.flameL = Math.max(0, c.flameL - dt);
    c.flameR = Math.max(0, c.flameR - dt);
    if (c.fuel > 0){
      if (E.input.up){ c.vy -= L.thrust * s; c.fuel -= L.burnUp * s; c.flameUp = 80; }
      if (E.input.down){ c.vy += L.thrust * 0.5 * s; c.fuel -= L.burnSide * s; }
      if (E.input.left){ c.vx -= L.sideThrust * s; c.fuel -= L.burnSide * s; c.flameR = 80; }
      if (E.input.right){ c.vx += L.sideThrust * s; c.fuel -= L.burnSide * s; c.flameL = 80; }
      if (c.fuel < 0) c.fuel = 0;
    }
    c.x += c.vx * s; c.y += c.vy * s;

    // keep the craft on screen: a soft bounce off the walls
    if (c.x < 4){ c.x = 4; c.vx = Math.abs(c.vx) * 0.3; }
    if (c.x + c.w > W - 4){ c.x = W - 4 - c.w; c.vx = -Math.abs(c.vx) * 0.3; }
    if (c.y < 8){ c.y = 8; c.vy = Math.max(0, c.vy); }

    // touchdown test
    if (c.y + c.h >= GROUND_Y){
      c.y = GROUND_Y - c.h;
      c.impactV = c.vy;
      var cx = c.x + c.w/2;
      var onPad = (cx >= E.pad.x + 3 && cx <= E.pad.x + E.pad.w - 3);
      var gentle = (c.vy <= L.maxLandV && Math.abs(c.vx) <= L.maxLandVx);
      if (onPad && gentle){ land(); }
      else if (!onPad){ crash((cfg.lines && cfg.lines.offpad) || "MISSED THE PAD"); }
      else { crash((cfg.lines && cfg.lines.fast) || "DOWN TOO HARD"); }
    }

    for (var f = E.fx.length - 1; f >= 0; f--){ E.fx[f].t -= dt; E.fx[f].y -= 16 * s; if (E.fx[f].t <= 0) E.fx.splice(f, 1); }
  };

  E.score = function(){
    var clean = (E.playerHits === 0);
    var noHit = clean ? cfg.noHitBonus : 0;
    var speed = E.over ? Math.max(0, Math.min(cfg.speedCap, Math.round(cfg.par - E.elapsed / 1000))) : 0;
    return {
      damage: E.damagePts, comboPts: E.comboPts, bestCombo: E.bestCombo,
      noHit: noHit, speed: speed,
      total: E.damagePts + E.comboPts + noHit + speed
    };
  };

  return E;
}

/* ---------- SOFT LANDING renderer ---------- */
function renderLander(){
  var E = arcade, t = G.time;
  var GROUND_Y = VIEW_H - 40;
  // deep night sky over the circular city
  ctx.fillStyle = "#070d18"; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  // stars twinkling
  E.stars.forEach(function(st){
    var tw = (Math.sin(t / 600 + st.tw) + 1) / 2;
    ctx.fillStyle = "rgba(190,225,240," + (0.2 + tw * 0.6).toFixed(2) + ")";
    ctx.fillRect(st.x, st.y, 2, 2);
  });
  // a soft city glow band along the horizon
  ctx.fillStyle = "rgba(60,120,150,.18)"; ctx.fillRect(0, GROUND_Y - 26, VIEW_W, 26);
  // distant skyline silhouette with lit windows
  for (var b = 0; b < 12; b++){
    var bx = b * 56 + ((Math.floor(b * 37) % 18));
    var bh = 24 + (Math.floor(b * 53) % 40);
    ctx.fillStyle = "#0e1a2a"; ctx.fillRect(bx, GROUND_Y - bh, 40, bh);
    for (var wy = GROUND_Y - bh + 4; wy < GROUND_Y - 4; wy += 10){
      var litw = Math.floor(t / 700 + b + wy) % 3 === 0;
      ctx.fillStyle = litw ? "rgba(120,225,224,.5)" : "rgba(40,80,100,.4)";
      ctx.fillRect(bx + 6, wy, 6, 5); ctx.fillRect(bx + 22, wy, 6, 5);
    }
  }
  // the ground deck
  ctx.fillStyle = "#13283a"; ctx.fillRect(0, GROUND_Y, VIEW_W, VIEW_H - GROUND_Y);
  ctx.fillStyle = "#1c3a52"; ctx.fillRect(0, GROUND_Y, VIEW_W, 4);
  // the landing pad, lit with guide lights
  var pad = E.pad;
  if (pad){
    var glow = pad.lit > 0 ? pad.lit : (Math.sin(t / 300) + 1) / 2 * 0.5 + 0.3;
    ctx.fillStyle = "rgba(120,225,224," + glow.toFixed(2) + ")"; ctx.fillRect(pad.x, pad.y - 2, pad.w, 4);
    ctx.fillStyle = "#2f6e7a"; ctx.fillRect(pad.x, pad.y, pad.w, pad.h);
    ctx.fillStyle = "#bfe9ea"; ctx.fillRect(pad.x, pad.y - 4, 4, 6); ctx.fillRect(pad.x + pad.w - 4, pad.y - 4, 4, 6);
    // a beam of welcome light rising from the pad center
    ctx.fillStyle = "rgba(120,225,224,.10)"; ctx.fillRect(pad.x + pad.w/2 - 8, pad.y - 70, 16, 70);
    // chevrons pointing in
    ctx.fillStyle = "rgba(190,235,240,.5)";
    var ch = Math.floor(t / 300) % 2;
    ctx.fillRect(pad.x + pad.w/2 - 6, pad.y - 12 - ch * 2, 12, 2);
  }
  // debris dust
  E.dust.forEach(function(p){ ctx.fillStyle = "rgba(232,150,90," + Math.max(0, p.t/700).toFixed(2) + ")"; ctx.fillRect(p.x, p.y, 3, 3); });

  // the lander craft, a pod slung under a thruster frame
  var c = E.craft;
  if (c){
    if (c.state === "boom"){
      var bt = 1 - c.timer/900;
      var rad = 6 + bt * 26;
      ctx.fillStyle = "rgba(232,150,90," + (1 - bt).toFixed(2) + ")"; ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + c.h/2, rad, 0, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,230,160," + (0.8 - bt).toFixed(2) + ")"; ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + c.h/2, rad * 0.5, 0, 7); ctx.fill();
    } else {
      // thruster flames first, behind the hull
      if (c.flameUp > 0){
        var fl = Math.floor(t/60) % 2 === 0 ? 0 : 2;
        ctx.fillStyle = "#e8b04b"; ctx.fillRect(c.x + 6, c.y + c.h, 10, 8 + fl);
        ctx.fillStyle = "#ffe9b0"; ctx.fillRect(c.x + 8, c.y + c.h, 6, 5 + fl);
        ctx.fillStyle = "rgba(120,225,224,.5)"; ctx.fillRect(c.x + 9, c.y + c.h, 4, 3);
      }
      if (c.flameL > 0){ ctx.fillStyle = "#ffe9b0"; ctx.fillRect(c.x + c.w, c.y + 6, 6, 4); }
      if (c.flameR > 0){ ctx.fillStyle = "#ffe9b0"; ctx.fillRect(c.x - 6, c.y + 6, 6, 4); }
      // frame and legs
      ctx.fillStyle = "#9aa6b8"; ctx.fillRect(c.x + 1, c.y + 12, 4, 8); ctx.fillRect(c.x + c.w - 5, c.y + 12, 4, 8);
      ctx.fillStyle = "#cfd8e0"; ctx.fillRect(c.x + 4, c.y, c.w - 8, 14);   // thruster body
      ctx.fillStyle = "#7fb2e5"; ctx.fillRect(c.x + 6, c.y + 2, c.w - 12, 5); // canopy
      // the slung resource pod
      ctx.fillStyle = "#e8b04b"; ctx.fillRect(c.x + 6, c.y + 13, c.w - 12, 7);
      ctx.fillStyle = "#caa23f"; ctx.fillRect(c.x + 6, c.y + 13, c.w - 12, 2);
      ctx.fillStyle = "#78e9e0"; ctx.fillRect(c.x + c.w/2 - 1, c.y + 14, 2, 5);

  // floating feedback
  E.fx.forEach(function(fx){

    ctx.globalAlpha = Math.max(0, Math.min(1, fx.t/1000));
    ctx.fillText(fx.text, fx.x, fx.y); ctx.globalAlpha = 1;
  });

  // HUD: score, sector, streak, and the fuel and speed gauges
  ctx.fillStyle = "rgba(13,16,26,.72)"; ctx.fillRect(0, 0, VIEW_W, 30);
  ctx.fillStyle = "#cfe2ef"; ctx.font = "8px 'Press Start 2P', monospace"; ctx.textAlign = "left";
  ctx.fillText("DELIVERED " + (E.damagePts + E.comboPts), 10, 12);
  ctx.fillText("PODS " + E.hits, 10, 23);
  ctx.textAlign = "center"; ctx.fillStyle = "#78e9e0";
  ctx.fillText("SECTOR " + (E.level + 1) + " / " + E.cfg.levels.length, VIEW_W/2, 12);
  var dropsLeft = E.cfg.levels[E.level].drops - E.dropsThisLevel;
  ctx.fillStyle = "#cfe2ef"; ctx.fillText("PODS LEFT " + dropsLeft, VIEW_W/2, 23);
  if (E.combo >= 2){ ctx.fillStyle = "#7fe5b0"; ctx.fillText("STREAK x" + E.combo, VIEW_W/2, 30); }
  // fuel gauge
  if (c){
    ctx.textAlign = "right"; ctx.fillStyle = "#cfe2ef"; ctx.fillText("FUEL", VIEW_W - 86, 12);
    var fw = 70, ff = Math.round(fw * Math.max(0, c.fuel / E.cfg.levels[E.level].fuel));
    ctx.fillStyle = "#2a2c33"; ctx.fillRect(VIEW_W - 80, 5, fw, 8);
    ctx.fillStyle = c.fuel < E.cfg.levels[E.level].fuel * 0.25 ? "#e25549" : "#43d17c"; ctx.fillRect(VIEW_W - 80, 5, ff, 8);
    // descent speed gauge, green when gentle enough to land
    var L = E.cfg.levels[E.level];
    var safe = (c.vy <= L.maxLandV && Math.abs(c.vx) <= L.maxLandVx);
    ctx.fillStyle = "#cfe2ef"; ctx.fillText("V", VIEW_W - 86, 24);
    var vw = 70, vf = Math.round(vw * Math.min(1, Math.max(0, c.vy) / (L.maxLandV * 3)));
    ctx.fillStyle = "#2a2c33"; ctx.fillRect(VIEW_W - 80, 17, vw, 8);
    ctx.fillStyle = safe ? "#43d17c" : "#e8b04b"; ctx.fillRect(VIEW_W - 80, 17, vf, 8);
    // the safe-speed mark
    ctx.fillStyle = "#bfe9ea"; ctx.fillRect(VIEW_W - 80 + Math.round(vw / 3), 16, 2, 10);
  }
}

/* a shared sidewalk base and cornice so the lots sit on the street */
function dtBase(bx, by, bw, bh, body, cornice){
  ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.fillRect(bx - 4, by + bh - 4, bw + 8, 8);   // ground shadow
  ctx.fillStyle = body; ctx.fillRect(bx, by + 10, bw, bh - 10);
  ctx.fillStyle = cornice; ctx.fillRect(bx - 3, by + 4, bw + 6, 10);                  // cornice band
}
BUILDING_ART.factory1 = function(b, bx, by, bw, bh){
  // a red brick works: barred windows, a loading bay, and a smokestack puffing
  dtBase(bx, by, bw, bh, "#9e4a36", "#7d3527");
  // brick courses
  ctx.fillStyle = "rgba(0,0,0,.12)";
  for (var ry = by + 16; ry < by + bh - 4; ry += 7){ ctx.fillRect(bx, ry, bw, 1); }
  // tall industrial windows, lit from within
  for (var wx = bx + 8; wx < bx + bw - 12; wx += 22){
    ctx.fillStyle = "#2a2018"; ctx.fillRect(wx, by + 20, 14, bh - 28);
    var lit = Math.floor(G.time / 700 + wx) % 4 !== 0;
    ctx.fillStyle = lit ? "rgba(232,176,75,.5)" : "rgba(40,30,20,.6)"; ctx.fillRect(wx + 2, by + 22, 10, bh - 32);
    ctx.fillStyle = "#1a140e"; ctx.fillRect(wx + 6, by + 20, 2, bh - 28);   // mullion
  }
  // a roll up loading bay
  ctx.fillStyle = "#3a2c20"; ctx.fillRect(bx + bw - 26, by + bh - 16, 20, 14);
  ctx.fillStyle = "#5a4636"; for (var ly = by + bh - 14; ly < by + bh - 2; ly += 3){ ctx.fillRect(bx + bw - 26, ly, 20, 1); }
  // smokestack with a slow rising puff
  ctx.fillStyle = "#6e3527"; ctx.fillRect(bx + 6, by - 22, 8, 30);
  ctx.fillStyle = "#8a4636"; ctx.fillRect(bx + 6, by - 22, 8, 4);
  for (var p = 0; p < 3; p++){
    var pt = (G.time / 1600 + p * 0.33) % 1;
    ctx.fillStyle = "rgba(200,200,205," + (0.4 - pt * 0.35).toFixed(2) + ")";
    var pr = 4 + pt * 7;
    ctx.beginPath(); ctx.arc(bx + 10 + Math.sin(pt * 6) * 4, by - 24 - pt * 20, pr, 0, 7); ctx.fill();
  }
};

  ctx.fillStyle = "#b0a890"; ctx.fillRect(bx - 4, by + 8, bw + 8, 4);

};

  dtBase(bx, by, bw, bh, "#9a4a49", "#6e3231");

/* =====================================================
   COMMAND ECONOMY QUALITY BAR PASS. Chapter 4, internal id ch3.
   Milestone 23. The command city predated the Level 0 benchmark
   and had no custom facades at all. Its planned ground, decor,
   critters, hazards, and bespoke interiors already sit at the
   bar; this stage gives all seven buildings a theme locked,
   animated facade in the austere planned style: concrete
   monuments, a generic red star, ration hatches, and queues.
   Scarcity is shown as atmosphere, never as graphic suffering,
   per the neutrality charter. Pure rect and arc fills, G.time
   driven, no readable text and no real party branding.
   ===================================================== */
function redStar(cx, cy, r, fill){
  // a plain five point red star, generic period iconography, no party logo
  ctx.fillStyle = fill;
  ctx.beginPath();
  for (var i = 0; i < 10; i++){
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var rad = (i % 2 === 0) ? r : r * 0.42;
    ctx.lineTo(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad);
  }
  ctx.closePath(); ctx.fill();
}

  if (!last) last = ts;
  var dt = Math.min(50, ts-last);
  last = ts;
  update(dt);
  render();
  window.requestAnimationFrame(frame);
}
